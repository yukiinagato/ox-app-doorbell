; 開発テスト用 (資格情報はダミー — LAN 内開発専用)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[door-station](!)
type=endpoint
context=from-door
disallow=all
allow=ulaw
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[door-auth](!)
type=auth
auth_type=userpass

[door-aor](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=15

[8001](door-station)
auth=8001
aors=8001
callerid="TestDoor" <8001>
[8001](door-auth)
username=8001
password=devpass8001
[8001](door-aor)

[8002](door-station)
auth=8002
aors=8002
callerid="TestDoor2" <8002>
[8002](door-auth)
username=8002
password=devpass8002
[8002](door-aor)

; ソフトフォン (Linphone 等で受け側テスト)
[201](door-station)
context=from-internal
auth=201
aors=201
callerid="TestPhone" <201>
[201](door-auth)
username=201
password=devpass201
[201](door-aor)
