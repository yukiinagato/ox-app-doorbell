[from-door]
; 600: 自動応答 → アナウンス → エコー (門口機の音声送受・AEC 確認用)
exten => 600,1,NoOp(dev doorbell test from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-congrats)
 same => n,Echo()
 same => n,Hangup()

; 601: ソフトフォン 201 を鳴らす (対話テスト)
exten => 601,1,Dial(PJSIP/201,30)
 same => n,Hangup()

; 602: 鳴りっぱなし (180 Ringing を返して応答しない) — 室内機 answer 接管テスト用:
; 門口機がここへ発呼してリング中に、室内機が直呼 answer で電話腿を取り消す
; (tools/dev_intercom_test.sh)。60 秒で諦める。
exten => 602,1,Ringing()
 same => n,Wait(60)
 same => n,Hangup()

[from-internal]
exten => _800X,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
