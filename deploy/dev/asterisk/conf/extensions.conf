[globals]
DOORBELL_LANG=en
MENU_TIMEOUT=4
MENU_TRIES=2
MENU_TIMEOUT_ACTION=decline
REPLY_COUNT=4
REPLY_PREFIX=#2
DECLINE_CODE=#90

; The production voice menu (deploy/asterisk/doorbell-menu.conf), mounted by docker-compose.
#include "doorbell-menu.conf"

[from-door]
; 600: auto-answer -> announcement -> echo (door-station audio send/receive and AEC check)
exten => 600,1,NoOp(dev doorbell test from ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-congrats)
 same => n,Echo()
 same => n,Hangup()

; 601: ring softphone 201 (interactive test)
exten => 601,1,Dial(PJSIP/201,30)
 same => n,Hangup()

; 602: rings forever (180 Ringing, never answers) for the indoor answer-takeover test:
; while the door station rings here, an indoor panel answers with a direct call and cancels the
; phone leg (tools/dev_intercom_test.sh). Gives up after 60 seconds.
exten => 602,1,Ringing()
 same => n,Wait(60)
 same => n,Hangup()

; 620: voice menu on softphone 201, operated by a person.
exten => 620,1,Progress()
 same => n,Dial(PJSIP/201,40,gr(ring)U(doorbell-menu^${CHANNEL}))
 same => n,Goto(doorbell-result,s,1)

; 621-624: voice menu answered by a scripted "mobile" (tools/dev_ivr_test.sh).
;   621 picks reply 1 (#21), 622 talks (bridge, then echo), 623 declines (#90),
;   624 behaves like carrier voicemail and never presses a key (timeout -> #90).
exten => _62[1-4],1,Progress()
 same => n,Dial(Local/robot-${EXTEN}@robot-phone/n,40,gr(ring)U(doorbell-menu^${CHANNEL}))
 same => n,Goto(doorbell-result,s,1)

[robot-phone]
exten => robot-621,1,Answer()
 same => n,Wait(1.5)
 same => n,SendDTMF(2,250)
 same => n,Wait(1.5)
 same => n,SendDTMF(1,250)
 same => n,Wait(15)
 same => n,Hangup()
exten => robot-622,1,Answer()
 same => n,Wait(1.5)
 same => n,SendDTMF(1,250)
 same => n,Echo()
exten => robot-623,1,Answer()
 same => n,Wait(1.5)
 same => n,SendDTMF(9,250)
 same => n,Wait(15)
 same => n,Hangup()
exten => robot-624,1,Answer()
 same => n,Wait(30)
 same => n,Hangup()

[from-internal]
exten => _800X,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
