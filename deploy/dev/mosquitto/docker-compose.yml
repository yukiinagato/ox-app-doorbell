# Development Mosquitto instance for MQTT bridge integration tests. Production uses the HA add-on.
#   docker compose up -d
#   Verify subscriptions: docker exec doorbell-dev-mqtt mosquitto_sub -t '#' -v
services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: doorbell-dev-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
