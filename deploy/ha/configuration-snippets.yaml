# Home Assistant configuration fragments for configuration.yaml and automations.
# The leader node registers doorbell entities through MQTT Discovery (see README.*.md for the
# full list). entity_id is derived from the ASCII object_id and is therefore predictable:
#   event.doorbell_d_front                    (doorbell; event_type press/answered/missed/replied/cancelled)
#   sensor.doorbell_d_front_call_state        (idle / ringing / in_call)
#   sensor.doorbell_d_front_last_call         (latest finished call; attributes hold the details)
#   sensor.doorbell_d_front_missed_calls      (unseen missed calls)
#   image.doorbell_d_front_snapshot           (JPEG taken at the bell press, sent over MQTT)
#   select.doorbell_d_front_quick_reply       (send a quick reply to the call in progress)
#   binary_sensor.doorbell_d_front_motion     (motion, off_delay 30s)
#   binary_sensor.doorbell_emergency          (SOS; attributes: source, door, triggered_at, ...)
#   binary_sensor.doorbell_node_<first 8 chars of node_id>  (device online, connectivity)
#   binary_sensor.doorbell_bridge_online      (bridge liveness, derived from LWT)
# Entity names follow integrations.ha.language (ja/en/zh; default: first UI language).
#
# Live video does not travel over MQTT: go2rtc pulls it from the door station over HTTPS with a
# security v3 integration credential (see go2rtc.yaml).

# ---------- Optional: generic camera fetching /snapshot.jpg on demand ----------
# The MQTT image entity already carries the picture taken at each press. Use a generic camera
# only when you also want stills on demand. Requires the security v3 integration credential;
# the station certificate is self-signed, so verify_ssl must be false.
camera:
  - platform: generic
    name: genkan_front_still
    still_image_url: "https://10.0.1.11:47443/snapshot.jpg"
    username: ha-media
    password: !secret doorbell_media_password
    authentication: basic
    verify_ssl: false
  - platform: generic
    name: genkan_annex_still
    still_image_url: "https://10.0.1.12:47443/snapshot.jpg"
    username: ha-media
    password: !secret doorbell_media_password
    authentication: basic
    verify_ssl: false

# ---------- HomeKit Bridge: entrance cameras and doorbells in Apple Home ----------
# First expose the go2rtc.yaml streams to HA as camera.genkan_front and similar entities
# through the go2rtc/WebRTC integration or a generic RTSP camera at the go2rtc endpoint.
homekit:
  filter:
    include_entities:
      - camera.genkan_front
      - camera.genkan_annex
  entity_config:
    camera.genkan_front:
      name: "正面玄関"
      # MQTT Discovery creates this event entity with device_class doorbell. Its fixed ASCII
      # object_id makes the entity_id predictable from door_id.
      linked_doorbell_sensor: event.doorbell_d_front
      support_audio: false        # The MJPEG source has no audio; calls use SIP.
    camera.genkan_annex:
      name: "離れ玄関"
      linked_doorbell_sensor: event.doorbell_d_annex
      support_audio: false

automation:
  # ---------- Recommended: mesh outage watchdog (leader LWT remains offline for 2 minutes) ----------
  - alias: "doorbell: ブリッジ消失アラート"
    trigger:
      - platform: state
        entity_id: binary_sensor.doorbell_bridge_online   # Registered by Discovery from LWT.
        to: "off"
        for: "00:02:00"
    action:
      - service: notify.mobile_app_iphone
        data:
          title: "ドアホン"
          message: "ドアホン網が応答しません (停電/ネット断?)"
          data: { push: { sound: { name: default, critical: 1, volume: 1.0 } } }

  # ---------- iPhone ring notification with quick-reply actions ----------
  - alias: "doorbell: 按鈴 → 通知 (返信ボタン付き)"
    trigger:
      - platform: state
        entity_id: event.doorbell_d_front
    # The event entity also reports answered/missed/replied/cancelled; notify on press only.
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.attributes.event_type == 'press' }}"
    action:
      # The press snapshot arrives over MQTT a moment after the event; wait briefly for it.
      - wait_for_trigger:
          - platform: state
            entity_id: image.doorbell_d_front_snapshot
        timeout: "00:00:03"
        continue_on_timeout: true
      - service: notify.mobile_app_iphone
        data:
          title: "来客"
          message: "正面玄関に来客です"
          data:
            image: "/api/image_proxy/image.doorbell_d_front_snapshot"
            push: { sound: { name: default, critical: 1, volume: 1.0 } }
            actions:
              - { action: "DOORBELL_REPLY_AWAY",  title: "留守にしています" }
              - { action: "DOORBELL_REPLY_NO",    title: "結構です" }
              - { action: "DOORBELL_REPLY_WAIT",  title: "少々お待ちください" }

  # Notification action -> MQTT reply topic -> door-station display and TTS.
  # The payload may be a quick_replies key such as qr_away or free-form text.
  - alias: "doorbell: 通知アクション → 返信"
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data: { action: "DOORBELL_REPLY_AWAY" }
        id: qr_away
      - platform: event
        event_type: mobile_app_notification_action
        event_data: { action: "DOORBELL_REPLY_NO" }
        id: qr_no
      - platform: event
        event_type: mobile_app_notification_action
        event_data: { action: "DOORBELL_REPLY_WAIT" }
        id: qr_wait
    action:
      - service: mqtt.publish
        data:
          topic: "doorbell/d_front/reply/set"
          payload: "{{ trigger.id }}"        # reply_id, matching an app quick_replies key.

  # ---------- Example device-offline tamper notification ----------
  - alias: "doorbell: 門口機オフライン"
    trigger:
      - platform: state
        entity_id: binary_sensor.doorbell_node_4d80f37a   # Replace with the entity shown under Devices.
        to: "off"
        for: "00:01:00"
    action:
      - service: notify.mobile_app_iphone
        data: { title: "ドアホン", message: "正面玄関の門口機がオフラインです" }

  # ---------- Example receiver for app-to-MQTT DTMF unlock commands ----------
  # During a call, "*1" (ha_command in sip.dtmf_actions) publishes to doorbell/cmd/unlock.
  - alias: "doorbell: 開錠コマンド"
    trigger:
      - platform: mqtt
        topic: "doorbell/cmd/unlock"
    action:
      - service: lock.unlock
        target: { entity_id: lock.genkan }

  # ---------- Missed call reminder with the visitor's purpose ----------
  - alias: "doorbell: 不在着信"
    trigger:
      - platform: state
        entity_id: event.doorbell_d_front
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.attributes.event_type == 'missed' }}"
    action:
      - service: notify.mobile_app_iphone
        data:
          title: "ドアホン"
          message: >-
            正面玄関で不在着信 ({{ state_attr('sensor.doorbell_d_front_last_call', 'purpose') }})。
            未確認 {{ states('sensor.doorbell_d_front_missed_calls') }} 件
          data:
            image: "/api/image_proxy/image.doorbell_d_front_snapshot"

  # ---------- SOS details in the alert ----------
  - alias: "doorbell: SOS"
    trigger:
      - platform: state
        entity_id: binary_sensor.doorbell_emergency
        to: "on"
    action:
      - service: notify.mobile_app_iphone
        data:
          title: "緊急事態"
          message: >-
            {{ state_attr('binary_sensor.doorbell_emergency', 'source_name') }} から発報
            ({{ state_attr('binary_sensor.doorbell_emergency', 'triggered_at_iso') }})
          data: { push: { sound: { name: default, critical: 1, volume: 1.0 } } }
