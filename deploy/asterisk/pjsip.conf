;; app-doorbell — Asterisk pjsip.conf 参考設定 (ユーザー自身で管理・調整する前提のサンプル)
;; 前提: Asterisk 18+ (chan_pjsip)。門口機は 8001..、内線話機は 201..、
;; ひかり電話 HGW (PR-400/500/RX-600 系) には「内線子機」として REGISTER する。

;================ transport ================
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

;================ 門口機 endpoint テンプレート ================
[door-station](!)
type=endpoint
context=from-door          ; 門口機発の呼はここへ
disallow=all
allow=ulaw                 ; LAN 内 + ひかり電話は G.711 μ-law で貫通 (無転码)
dtmf_mode=rfc4733
direct_media=no            ; メディアは Asterisk 経由 (LAN 内なので負担は無視できる)
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; SIP ビデオ対応端末 (Tier A) の endpoint には個別に追記:
;   allow=ulaw,h264
;   max_video_streams=1

[door-auth](!)
type=auth
auth_type=userpass

[door-aor](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30       ; OPTIONS 心跳 — 落ちたら Asterisk 側でも検知できる

;---- 玄関1 (正面玄関) ----
[8001](door-station)
auth=8001
aors=8001
callerid="正面玄関" <8001>
[8001](door-auth)
username=8001
password=CHANGE_ME_8001
[8001](door-aor)

;---- 玄関2 (離れ) ----
[8002](door-station)
auth=8002
aors=8002
callerid="離れ玄関" <8002>
[8002](door-auth)
username=8002
password=CHANGE_ME_8002
[8002](door-aor)

;================ 内線話機 ================
[phone](!)
type=endpoint
context=from-internal
disallow=all
allow=ulaw
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[201](phone)
auth=201
aors=201
callerid="リビング" <201>
[201](door-auth)
username=201
password=CHANGE_ME_201
[201](door-aor)

; 202 = スマホの SIP クライアント (Linphone/Groundwire, VPN 経由)。ビデオ受信するなら allow=ulaw,h264
[202](phone)
allow=ulaw,h264
auth=202
aors=202
callerid="携帯" <202>
[202](door-auth)
username=202
password=CHANGE_ME_202
[202](door-aor)

;================ ひかり電話 HGW trunk ================
;; HGW 管理画面「電話設定 > 内線設定」で内線番号 (例: 4) を有効化し、
;; そのユーザー名/パスワードをここに写す。MAC 偽装は不要 — 普通の REGISTER でよい。
;; (参考: voip-info.jp「Asterisk pjsip trunk hgw」)
[hgw-reg]
type=registration
transport=transport-udp
outbound_auth=hgw-auth
server_uri=sip:192.168.1.1                 ; HGW の LAN IP
client_uri=sip:4@192.168.1.1               ; 4 = HGW 内線番号
contact_user=4
retry_interval=60
expiration=3600

[hgw-auth]
type=auth
auth_type=userpass
username=4                                  ; 機種により "0004" 等の場合あり — HGW 画面の表記に従う
password=CHANGE_ME_HGW

[hgw-aor]
type=aor
contact=sip:4@192.168.1.1

[hgw]
type=endpoint
context=from-hgw                            ; 光電話の着信はここへ
disallow=all
allow=ulaw
dtmf_mode=inband                            ; PSTN 側の按鍵は inband が多い。実測で rfc4733 に変えて良い
outbound_auth=hgw-auth
aors=hgw-aor
from_user=4
direct_media=no

[hgw-identify]
type=identify
endpoint=hgw
match=192.168.1.1
