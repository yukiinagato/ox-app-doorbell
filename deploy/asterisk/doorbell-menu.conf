;; app-doorbell — phone-side voice menu, included by extensions.conf.
;;
;; Flow: the door leg dials with Progress() early media and Dial(...,gr(ring)U(doorbell-menu^${CHANNEL})).
;; The first phone to answer hears the menu (1 talk, 2 quick reply, 9 decline). "Talk" returns
;; and Dial bridges, which answers the door leg. A reply or decline stores the DTMF code for the
;; door station in a SHARED variable on the door leg and drops the phone; [doorbell-result] then
;; sends that code as RFC 4733 DTMF over the still-unanswered door leg and releases it.
;;
;; Globals used (set them in [globals]): DOORBELL_LANG, MENU_TIMEOUT, MENU_TRIES,
;; MENU_TIMEOUT_ACTION (decline|talk), REPLY_COUNT, REPLY_PREFIX, DECLINE_CODE.
;; Prompts: <astdatadir>/sounds/<DOORBELL_LANG>/doorbell/{menu,reply-menu,invalid,reply-sent,declined}.wav,
;; generated by tools/gen_asterisk_prompts.sh.

;; After Dial returns on the door leg: a reply or decline chosen on the phone is handed to the
;; door station as RFC 4733 DTMF over the still-unanswered early-media leg, then released.
[doorbell-result]
exten => s,1,Set(ACTION=${SHARED(DOORBELL_DTMF)})
 same => n,Log(NOTICE,doorbell-result door=${CALLERID(num)} action=${IF($["${ACTION}" = ""]?none:${ACTION})})
 same => n,GotoIf($["${ACTION}" = ""]?done)
 same => n,Wait(0.5)
 same => n,SendDTMF(${ACTION},250)
 same => n,Wait(2)
 same => n(done),Hangup()

;; Runs on the phone that answered, before any bridge (Dial U option). ARG1 = door-leg channel.
;; Returning without GOSUB_RESULT bridges the call; CONTINUE drops this phone and resumes the
;; door leg in [doorbell-result].
[doorbell-menu]
exten => s,1,Set(CHANNEL(language)=${DOORBELL_LANG})
 same => n,Set(TRIES=0)
 same => n(menu),Set(TRIES=$[${TRIES} + 1])
 same => n,Read(CHOICE,doorbell/menu,1,,1,${MENU_TIMEOUT})
 same => n,GotoIf($["${CHOICE}" = "1"]?talk)
 same => n,GotoIf($["${CHOICE}" = "2"]?reply)
 same => n,GotoIf($["${CHOICE}" = "9"]?decline)
 same => n,GotoIf($["${CHOICE}" = ""]?timeout)
 same => n,Playback(doorbell/invalid)
 same => n,GotoIf($[${TRIES} < ${MENU_TRIES}]?menu:decline)
 same => n(timeout),GotoIf($[${TRIES} < ${MENU_TRIES}]?menu)
 same => n,GotoIf($["${MENU_TIMEOUT_ACTION}" = "talk"]?talk:decline)
 same => n(talk),Log(NOTICE,doorbell-menu talk door=${ARG1})
 same => n,Return()
 same => n(reply),Set(RTRIES=0)
 same => n(rmenu),Set(RTRIES=$[${RTRIES} + 1])
 same => n,Read(REPLY,doorbell/reply-menu,1,,1,${MENU_TIMEOUT})
 same => n,GotoIf($["${REPLY}" = "0"]?menu)
 same => n,GotoIf($["${REPLY}" = ""]?rnone)
 same => n,GotoIf($[${REGEX("^[1-9]$" ${REPLY})}]?range)
 same => n(bad),Playback(doorbell/invalid)
 same => n(rnone),GotoIf($[${RTRIES} < ${MENU_TRIES}]?rmenu:decline)
 same => n(range),GotoIf($[${REPLY} <= ${REPLY_COUNT}]?send:bad)
 same => n(send),Set(SHARED(DOORBELL_DTMF,${ARG1})=${REPLY_PREFIX}${REPLY})
 same => n,Playback(doorbell/reply-sent)
 same => n,Set(GOSUB_RESULT=CONTINUE)
 same => n,Return()
 same => n(decline),Set(SHARED(DOORBELL_DTMF,${ARG1})=${DECLINE_CODE})
 same => n,Playback(doorbell/declined)
 same => n,Set(GOSUB_RESULT=CONTINUE)
 same => n,Return()
