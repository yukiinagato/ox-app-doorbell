;; app-doorbell — extensions.conf reference configuration
;; Policy: Asterisk only bridges and runs the phone-side voice menu. The door station interprets
;; every DTMF feature code (unlock, quick reply, decline), so behavior is the same whichever leg
;; sends it. Time-of-day routing lives here (telephony); the app's quiet_hours governs
;; notifications. The two are independent.

[globals]
MOBILE=090XXXXXXXX                 ; mobile number rung while away (dialed through the HGW)
DOORBELL_LANG=ja                   ; prompt language: sounds/<lang>/doorbell/*.wav
; Voice menu on the answering phone: 1 = talk, 2 = quick reply, 9 = decline.
MENU_TIMEOUT=6                     ; seconds to wait for a key
MENU_TRIES=2                       ; prompts before the timeout action applies
MENU_TIMEOUT_ACTION=decline        ; decline | talk. Keep "decline" so a carrier voicemail that
                                   ; picks up the mobile never gets bridged to the visitor.
REPLY_COUNT=4                      ; number of replies read out (tools/gen_asterisk_prompts.sh
                                   ; prints the value matching the cluster's quick replies)
; DTMF sent back to the door station. They must match sip.dtmf_actions on the door station:
;   "#21".."#29" -> quick replies in display order, "#90" -> decline.
REPLY_PREFIX=#2
DECLINE_CODE=#90

; Voice menu and result handling shared with deploy/dev/asterisk.
#include "doorbell-menu.conf"

;================ Door-station call entry ================
;; The door station's "call target extension" dials here.
;; Convention: 600 = main entrance (r1), 601 = annex (r2), paired with the app's trigger_rules.
;;
;; The door leg is never answered before a person chooses "talk": Progress() opens early media
;; so the visitor hears ringback and DTMF can flow back, and the door station keeps the call
;; ringing on every indoor device. Only the bridge after "1" answers the door leg, which the
;; door station records as an answered call.
[from-door]
exten => 600,1,NoOp(Doorbell ${CALLERID(num)} -> main)
 same => n,Set(DOOR=${CALLERID(num)})
 same => n,Progress()
 ; Night 22:00-06:59 rings the indoor extensions only (no mobile). Adjust freely.
 same => n,GotoIfTime(22:00-06:59,*,*,*?night)
 ; Day: indoor extensions plus the mobile through the HGW; the first phone to answer gets the menu.
 same => n,Dial(PJSIP/201&PJSIP/202&PJSIP/hgw/sip:0${MOBILE}@192.168.1.1,50,gr(ring)U(doorbell-menu^${CHANNEL}))
 same => n,Goto(doorbell-result,s,1)
 same => n(night),Dial(PJSIP/201&PJSIP/202,50,gr(ring)U(doorbell-menu^${CHANNEL}))
 same => n,Goto(doorbell-result,s,1)

exten => 601,1,NoOp(Doorbell ${CALLERID(num)} -> annex)
 same => n,Progress()
 same => n,Dial(PJSIP/202&PJSIP/hgw/sip:0${MOBILE}@192.168.1.1,50,gr(ring)U(doorbell-menu^${CHANNEL}))
 same => n,Goto(doorbell-result,s,1)

;================ Inbound Hikari calls (outside -> home) ================
[from-hgw]
exten => _X.,1,NoOp(Hikari inbound: ${CALLERID(all)})
 same => n,Dial(PJSIP/201&PJSIP/202,30)
 same => n,Hangup()

;================ Internal extensions ================
[from-internal]
; Extension-to-extension
exten => _20X,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Reverse call (monitor / talk-back): extension -> 8001 etc.; the door station answers itself
; (Alert-Info: <sip:auto>;answer-after=0 plus a caller on its auto-answer allow list).
exten => _800X,1,Set(PJSIP_HEADER(add,Alert-Info)=<sip:auto>\;answer-after=0)
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

; 0 prefix -> outbound through the Hikari line
exten => _0X.,1,Dial(PJSIP/hgw/sip:${EXTEN}@192.168.1.1,60)
 same => n,Hangup()
