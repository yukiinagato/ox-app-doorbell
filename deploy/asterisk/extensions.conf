;; app-doorbell — extensions.conf 参考設定
;; 方針: Asterisk は純粋なブリッジ。DTMF 機能碼 (開錠等) は門口機 app 側が解釈する
;; (どの腿から掛かっても挙動が同じになるため)。時間帯分岐はここ (電話系) と
;; app 側 quiet_hours (通知系) の 2 箇所にある — 役割が違う点に注意。

[globals]
MOBILE=090XXXXXXXX          ; 外出時に鳴らす携帯番号

;================ 門口機の按鈴入口 ================
;; 門口機 app の設定「呼出先分機」がここに掛けてくる。
;; 約定: 600 = 正面玄関系 (r1), 601 = 離れ (r2) — app 側 trigger_rules と対で管理。
[from-door]
exten => 600,1,NoOp(Doorbell ${CALLERID(num)} -> main)
 same => n,Set(DOOR=${CALLERID(num)})
 ; 夜間 22:00-06:59 は内線のみ (携帯を鳴らさない) — 例。自由に調整
 same => n,GotoIfTime(22:00-06:59,*,*,*?night)
 ; 日中: 内線群 + ひかり電話経由で携帯を同時に鳴らし、先取り。g: 呼出側が切っても dialplan 継続
 same => n,Dial(PJSIP/201&PJSIP/202&PJSIP/hgw/sip:0${MOBILE}@192.168.1.1,50,g)
 same => n,Hangup()
 same => n(night),Dial(PJSIP/201&PJSIP/202,50,g)
 same => n,Hangup()

exten => 601,1,NoOp(Doorbell ${CALLERID(num)} -> annex)
 same => n,Dial(PJSIP/202&PJSIP/hgw/sip:0${MOBILE}@192.168.1.1,50,g)
 same => n,Hangup()

;; 携帯の留守番電話に取られるのを防ぎたい場合は U(confirm) で「1 を押して応答」:
;;  same => n,Dial(PJSIP/201&PJSIP/hgw/sip:0${MOBILE}@192.168.1.1,50,gU(confirm^s^1))
;; [confirm]
;; exten => s,1,Background(press-1-to-accept)   ; 音声ファイルは自前で用意
;;  same => n,Return()

;================ 光電話の着信 (外から家へ) ================
[from-hgw]
exten => _X.,1,NoOp(Hikari inbound: ${CALLERID(all)})
 same => n,Dial(PJSIP/201&PJSIP/202,30)
 same => n,Hangup()

;================ 内線側 ================
[from-internal]
; 内線互拨
exten => _20X,1,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; 逆呼び (モニタ/呼びかけ): 内線から 8001 等へ → 門口機は自動応答
; (門口機 app は Alert-Info: <sip:auto>;answer-after=0 + 主叫が自動応答白名单なら即応答)
exten => _800X,1,Set(PJSIP_HEADER(add,Alert-Info)=<sip:auto>\;answer-after=0)
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

; 0 発信 → ひかり電話へ出局
exten => _0X.,1,Dial(PJSIP/hgw/sip:${EXTEN}@192.168.1.1,60)
 same => n,Hangup()
