<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<script>

  (function () {
    try {
      var u = localStorage.getItem("db_admin_ui");
      if (u) document.documentElement.setAttribute("data-ui", u);
    } catch (e) {}
  })();

<style>
  :root { --bg:#101418; --card:#1a2027; --fg:#e8edf2; --dim:#8a97a5; --acc:#4da3ff; --warn:#ffb454; --err:#ff6b6b; --ok:#5dd39e; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif; font-size:15px; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--card); border-bottom:1px solid #2a333d; }
  header h1 { font-size:17px; font-weight:600; }
  header .node { color:var(--dim); font-size:12px; margin-left:auto; }
  nav { display:flex; gap:4px; padding:8px 12px; flex-wrap:wrap; }
  nav button { background:none; border:1px solid #2a333d; color:var(--fg); padding:7px 14px; border-radius:8px; cursor:pointer; font-size:14px; display:inline-flex; align-items:center; gap:6px; }
  nav button.on { background:var(--acc); border-color:var(--acc); color:#04121f; font-weight:600; }
  .ic { width:1.05em; height:1.05em; vertical-align:-0.16em; fill:none;
        stroke:currentColor; flex:none; }
  .btn .ic, .btn2 .ic { vertical-align:-0.16em; }
  main { padding:12px 16px 40px; max-width:960px; margin:0 auto; }
  .card { background:var(--card); border:1px solid #2a333d; border-radius:10px; padding:14px; margin-bottom:12px; }
  .card h2 { font-size:15px; font-weight:600; margin-bottom:8px; }
  .chead { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .chead h2 { margin-bottom:0; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:6px 8px; border-bottom:1px solid #242d36; }
  th { color:var(--dim); font-weight:500; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .err { color:var(--err); } .dim { color:var(--dim); }
  .tag { display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px; border:1px solid #2a333d; }
  .chip { display:inline-block; padding:2px 10px; margin:2px 4px 2px 0; border-radius:99px; font-size:12px; background:#243040; }
  textarea { width:100%; min-height:300px; background:#0c1014; color:var(--fg); border:1px solid #2a333d; border-radius:8px; padding:10px; font:12px/1.5 ui-monospace,Menlo,monospace; }
  input,select { background:#0c1014; color:var(--fg); border:1px solid #2a333d; border-radius:8px; padding:9px 12px; font-size:15px; }
  .dropzone { border:2px dashed #2a333d; border-radius:10px; padding:18px; text-align:center; color:var(--dim); margin:8px 0; cursor:pointer; user-select:none; transition:border-color .12s, background .12s; }
  .dropzone.drag { border-color:var(--acc); background:rgba(90,200,250,0.08); color:var(--fg); }
  input[type=password],input[type=text],input[type=number],input[type=time] { width:100%; }
  input[type=checkbox],input[type=radio] { width:auto; }
  .btn { background:var(--acc); color:#04121f; border:none; border-radius:8px; padding:9px 18px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn.small { padding:6px 14px; font-size:13px; }
  .btn.ghost { background:none; color:var(--fg); border:1px solid #2a333d; }
  .btn2 { background:none; color:var(--acc); border:1px solid #2a333d; border-radius:7px; padding:4px 10px; font-size:12px; cursor:pointer; }
  .btn2.danger { color:var(--err); }
  .ops { white-space:nowrap; }
  tr.offline td { opacity:.45; }
  .card.rule.offline { opacity:.55; }
  .frow { margin-bottom:10px; }
  .flab { display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  .fhint { font-size:11px; margin-top:3px; }
  .frow-check { padding:4px 0; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .mcwrap { display:inline-flex; flex-wrap:wrap; gap:2px 10px; }
  .mc { display:inline-flex; align-items:center; gap:4px; font-size:13px; cursor:pointer; padding:2px 0; }
  .arow { display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:6px 0; border-bottom:1px dashed #242d36; }
  .arow input[type=time] { width:auto; padding:5px 8px; }
  .arow input[type=text] { width:auto; padding:5px 8px; }
  .arow select { padding:5px 8px; }
  .mono { font-family:ui-monospace,Menlo,monospace; font-size:13px; word-break:break-all; }
  .pin { font-size:52px; font-weight:700; letter-spacing:10px; text-align:center; margin:14px 0 6px; color:var(--acc); }
  #login { max-width:340px; margin:14vh auto; }
  #login h2 { margin-bottom:14px; font-size:16px; }
  #login .row { margin-bottom:10px; }
  .hidden { display:none !important; }
  #msg { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:#243040; padding:8px 18px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; z-index:30; }
  #modal { position:fixed; inset:0; background:rgba(4,8,12,.62); z-index:20; overflow:auto; padding:5vh 12px; }
  .mbox { max-width:640px; margin:0 auto; }
  .mbtns { display:flex; gap:8px; margin-top:14px; }

  .scrollx { overflow-x:auto; }
  .bounded-table { table-layout:fixed; }
  .bounded-table th,.bounded-table td { min-width:0; vertical-align:top; }
  .breakable,.peer-address { overflow-wrap:anywhere; word-break:break-word; }
  .peer-address { display:block; line-height:1.35; }
  .event-detail { white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; }
  .live-card { min-width:0; }
  .live-frame { position:relative; width:100%; aspect-ratio:4/3; overflow:hidden;
                border-radius:6px; background:#000; transition:aspect-ratio .12s ease; }
  .live-frame>img,.live-frame>video { position:absolute; left:50%; top:50%; width:100%; height:100%;
                object-fit:contain; background:#000; transform:translate(-50%,-50%); transform-origin:center; }
  .agrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .acard { background:#141a21; border:1px solid #2a333d; border-radius:9px; padding:9px; }
  .athumb { width:100%; height:92px; border-radius:6px; background:#0c1014 center/cover no-repeat;
            display:block; }
  .acard audio { width:100%; margin-top:6px; }
  .acard .lbl { font-size:13px; margin:6px 0 2px; word-break:break-all; }
  .refs { font-size:11px; line-height:1.5; }
  .prog { height:6px; background:#0c1014; border-radius:4px; overflow:hidden; margin-top:8px;
          display:none; }
  .prog > div { height:100%; width:0; background:var(--acc); }
  input[type=file] { background:none; border:none; padding:0; font-size:13px; }
  input[type=color] { width:56px; height:36px; padding:2px; vertical-align:middle; }
  .swatches { display:inline-block; vertical-align:middle; margin-left:8px; }
  .sw { width:24px; height:24px; border-radius:6px; border:1px solid #2a333d; padding:0;
        cursor:pointer; margin-right:4px; vertical-align:middle; }

  .tprev { position:relative; width:300px; height:210px; border-radius:12px; overflow:hidden;
           border:1px solid #2a333d; background:#101418 center/cover no-repeat; color:#fff;
           text-shadow:0 1px 3px rgba(0,0,0,.75); text-align:center; }
  /* The darkening layer sits over the background and under everything drawn on it, exactly
     where a shell composites it. */
  .tprev .tbackdrop { position:absolute; inset:0; pointer-events:none; }
  .tprev .inner { position:absolute; inset:0; display:flex; flex-direction:column;
                  align-items:center; justify-content:center; gap:9px; }
  .tprev .pclock { font-size:28px; font-weight:700; letter-spacing:1px; }
  .tprev .pcall { width:66%; padding:13px 0; border:2px solid var(--acc); border-radius:12px;
                  background:rgba(16,20,24,.5); font-size:15px; font-weight:700; }
  .tprev .pprow { display:flex; gap:6px; }
  .tprev .pp { width:32px; height:32px; border-radius:8px; background:rgba(16,20,24,.5);
               border:1px solid rgba(255,255,255,.28); font-size:15px; line-height:30px; }
  .i18ntbl th { white-space:nowrap; }
  .i18ntbl td { vertical-align:top; }
  .i18ntbl textarea { min-height:0; height:36px; resize:vertical; padding:7px 8px;
                      font:13px/1.4 "Hiragino Sans","Yu Gothic UI",system-ui,sans-serif; }
  .i18ntbl .k { font-family:ui-monospace,Menlo,monospace; font-size:12px; white-space:nowrap;
                padding-top:14px; }
  .spin { display:inline-block; width:11px; height:11px; margin-right:7px; border-radius:50%;
          border:2px solid #2a333d; border-top-color:var(--acc); vertical-align:-1px;
          animation:spin 0.9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .pairrow { display:flex; justify-content:space-between; align-items:center; gap:10px;
             padding:9px; border:1px solid #2a333d; border-radius:8px; margin-bottom:6px; }
  .pairwho { min-width:0; word-break:break-word; }
  .pairaddr { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .qrbox { margin-top:12px; text-align:center; }
  .qrbox canvas { image-rendering:pixelated; border-radius:6px; background:#fff; padding:0;
                  max-width:280px; }
  .qrph { display:flex; align-items:center; justify-content:center; width:100%; max-width:280px;
          height:240px; margin:0 auto; border:1px dashed #2a333d; border-radius:6px; }
  .pairscan { position:fixed; inset:0; background:#04080c; z-index:40; display:flex;
              align-items:center; justify-content:center; }
  .pairscan video { width:100%; height:100%; object-fit:cover; }
  .pairscanframe { position:absolute; width:min(64vw,64vh); height:min(64vw,64vh);
                   border:3px solid var(--acc); border-radius:14px; pointer-events:none; }
  .pairscanbar { position:absolute; left:0; right:0; bottom:0; padding:14px 16px;
                 background:rgba(4,8,12,.78); display:flex; align-items:center; gap:12px;
                 justify-content:space-between; color:#e8edf2; font-size:13px; }
  [data-ui="retro"] .pairrow { border-color:#808080; }
  [data-ui="retro"] .qrph { border-color:#808080; }
  .iconpick { margin-top:6px; }
  .iconpick button { font-size:17px; padding:3px 8px; margin:0 4px 4px 0; }


  [data-ui="retro"] body {
    background:#008080;
    color:#000;
    font-family:"MS Sans Serif","Tahoma","Segoe UI",system-ui,sans-serif;
    font-size:13px;

    -webkit-font-smoothing:none;
    -moz-osx-font-smoothing:unset;
    font-smooth:never;
    text-rendering:optimizeSpeed;
  }

  [data-ui="retro"] * { border-radius:0 !important; }

  [data-ui="retro"] .card,
  [data-ui="retro"] nav button,
  [data-ui="retro"] .btn,
  [data-ui="retro"] .btn2,
  [data-ui="retro"] .tag,
  [data-ui="retro"] .chip,
  [data-ui="retro"] .acard,
  [data-ui="retro"] .sw,
  [data-ui="retro"] .mbox {
    background:#c0c0c0; color:#000; border:none;
    box-shadow: inset -1px -1px 0 #000, inset 1px 1px 0 #dfdfdf,
                inset -2px -2px 0 #808080, inset 2px 2px 0 #fff;
  }

  [data-ui="retro"] .card,
  [data-ui="retro"] .mbox,
  [data-ui="retro"] .acard {
    box-shadow: inset -1px -1px 0 #000, inset 1px 1px 0 #dfdfdf,
                inset -2px -2px 0 #808080, inset 2px 2px 0 #fff,
                4px 4px 0 0 rgba(0,0,0,.5);
    padding:12px;
  }

  [data-ui="retro"] input,
  [data-ui="retro"] select,
  [data-ui="retro"] textarea,
  [data-ui="retro"] .dropzone,
  [data-ui="retro"] .athumb,
  [data-ui="retro"] .prog,
  [data-ui="retro"] pre.mono {
    background:#fff; color:#000; border:none;
    box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #fff,
                inset 2px 2px 0 #000, inset -2px -2px 0 #dfdfdf;
  }
  [data-ui="retro"] input[type=file] { background:none; box-shadow:none; }
  [data-ui="retro"] input[type=checkbox],
  [data-ui="retro"] input[type=radio] { box-shadow:none; }

  [data-ui="retro"] header {
    background:#000080; color:#fff; border-bottom:2px solid #000;
    box-shadow: 0 2px 0 0 rgba(0,0,0,.5);
  }
  [data-ui="retro"] header h1 { color:#fff; }
  [data-ui="retro"] header .tag { background:#000080; color:#fff; box-shadow:none; border:1px solid #fff; }
  [data-ui="retro"] header .node { color:#c0d0ff; }

  [data-ui="retro"] nav { gap:2px; padding:6px 10px; }
  [data-ui="retro"] nav button { color:#000; padding:5px 12px; font-size:13px; }
  [data-ui="retro"] nav button.on {
    background:#c0c0c0; color:#000; font-weight:700;
    box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #fff,
                inset 2px 2px 0 #000, inset -2px -2px 0 #dfdfdf;
  }

  [data-ui="retro"] .btn:active,
  [data-ui="retro"] .btn2:active,
  [data-ui="retro"] nav button:active {
    box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #fff,
                inset 2px 2px 0 #000, inset -2px -2px 0 #dfdfdf;
  }
  [data-ui="retro"] .btn { color:#000; font-weight:700; padding:7px 16px; }
  [data-ui="retro"] .btn2 { color:#000; padding:4px 10px; }

  [data-ui="retro"] .ok   { color:#006000; }
  [data-ui="retro"] .warn { color:#8a5000; }
  [data-ui="retro"] .err  { color:#a00000; }
  [data-ui="retro"] .dim  { color:#404040; }
  [data-ui="retro"] .btn2.danger { color:#a00000; }

  [data-ui="retro"] th, [data-ui="retro"] td { border-bottom:1px solid #808080; }
  [data-ui="retro"] th { color:#000080; font-weight:700; }
  [data-ui="retro"] main { color:#000; }
  [data-ui="retro"] .card h2 { color:#000080; font-weight:700; }

  [data-ui="retro"] #modal { background:rgba(0,0,64,.35); }
  [data-ui="retro"] #msg {
    background:#c0c0c0; color:#000;
    box-shadow: inset -1px -1px 0 #000, inset 1px 1px 0 #fff, 4px 4px 0 0 rgba(0,0,0,.5);
  }
  [data-ui="retro"] .pin { color:#000080; }
  [data-ui="retro"] .dropzone.drag { background:#e8e8ff; }

  [data-ui="retro"] a { color:#000080; }
</style>
</head>

<div id="login" class="card hidden">
  <h2 data-i18n="admin.login"></h2>
  <div class="row"><input id="pw" type="password" data-i18n-ph="admin.password"></div>
  <button class="btn" id="loginBtn" data-i18n="admin.login"></button>
  <div id="loginErr" class="err" style="margin-top:8px"></div>
</div>

<div id="app" class="hidden">
  <header>
    <h1 data-i18n="app.name"></h1><span class="tag" data-i18n="admin.title"></span>
    <span class="node" id="nodeInfo"></span>
    <select id="langSel" data-i18n-title="admin.language" style="margin-left:12px; padding:5px 8px; font-size:13px">
      <option value="ja" data-i18n="language.name_ja"></option>
      <option value="en" data-i18n="language.name_en"></option>
      <option value="zh" data-i18n="language.name_zh"></option>
    </select>
    <select id="uiSel" data-i18n-title="admin.ui_style" style="margin-left:6px; padding:5px 8px; font-size:13px">
      <option value="modern">Modern</option>
      <option value="retro">Retro (90s)</option>
    </select>
  </header>
  <nav>
    <button data-tab="dash" class="on"><svg class="ic"><use href="#i-home"/></svg><span data-i18n="admin.dashboard"></span></button>
    <button data-tab="doors"><svg class="ic"><use href="#i-building-community"/></svg><span data-i18n="admin.doors"></span></button>
    <button data-tab="devices"><svg class="ic"><use href="#i-device-tablet"/></svg><span data-i18n="admin.devices"></span></button>
    <button data-tab="rules"><svg class="ic"><use href="#i-adjustments"/></svg><span data-i18n="admin.rules"></span></button>
    <button data-tab="qr"><svg class="ic"><use href="#i-message-reply"/></svg><span data-i18n="admin.quick_replies"></span></button>
    <button data-tab="purposes"><svg class="ic"><use href="#i-list"/></svg><span data-i18n="admin.purposes"></span></button>
    <button data-tab="texts"><svg class="ic"><use href="#i-note"/></svg><span data-i18n="admin.texts"></span></button>
    <button data-tab="theme"><svg class="ic"><use href="#i-brush"/></svg><span data-i18n="admin.theme"></span></button>
    <button data-tab="assets"><svg class="ic"><use href="#i-photo"/></svg><span data-i18n="admin.assets"></span></button>
    <button data-tab="households"><svg class="ic"><use href="#i-users"/></svg><span data-i18n="admin.households"></span></button>
    <button data-tab="integrations"><svg class="ic"><use href="#i-link"/></svg><span data-i18n="admin.integrations"></span></button>
    <button data-tab="events"><svg class="ic"><use href="#i-clock"/></svg><span data-i18n="admin.events"></span></button>
    <button data-tab="pair"><svg class="ic"><use href="#i-plus"/></svg><span data-i18n="pair.tab"></span></button>
    <button data-tab="system"><svg class="ic"><use href="#i-settings"/></svg><span data-i18n="admin.system"></span></button>
  </nav>
  <main>
    <section id="tab-dash">
      <div id="adminEmergency" class="card hidden" role="alert" style="background:#8f1010;border-color:#ff8f85">
        <div class="chead"><h2 style="font-size:24px;color:#fff" data-i18n="admin.sos_active"></h2>
          <button class="btn" id="adminEmergencyCancel" style="background:#fff;color:#7b0808" data-i18n="emergency.cancel"></button>
        </div>
        <div style="color:#fff" data-i18n="admin.sos_clear_audit"></div>
      </div>
      <div class="card"><div class="dim" id="bridgeInfo" style="margin-bottom:8px"></div>
        <div class="dim mono" id="localAddrs" style="margin-bottom:8px; font-size:12px"></div>
        <table id="peersTbl" class="bounded-table">
        <colgroup><col style="width:11%"><col style="width:13%"><col style="width:8%"><col style="width:13%"><col style="width:20%"><col style="width:10%"><col style="width:25%"></colgroup>
        <thead><tr><th data-i18n="info.node"></th><th data-i18n="info.role"></th><th data-i18n="admin.status"></th><th data-i18n="admin.duty"></th><th data-i18n="info.version"></th><th data-i18n="power.title"></th><th data-i18n="admin.addresses"></th></tr></thead>
        <tbody></tbody></table></div>
      <div id="liveGrid" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px"></div>
    </section>
    <section id="tab-doors" class="hidden"></section>
    <section id="tab-devices" class="hidden"></section>
    <section id="tab-rules" class="hidden"></section>
    <section id="tab-qr" class="hidden"></section>
    <section id="tab-purposes" class="hidden"></section>
    <section id="tab-texts" class="hidden"></section>
    <section id="tab-theme" class="hidden"></section>
    <section id="tab-assets" class="hidden"></section>
    <section id="tab-households" class="hidden"></section>
    <section id="tab-integrations" class="hidden"></section>
    <section id="tab-events" class="hidden"></section>
    <section id="tab-pair" class="hidden"></section>
    <section id="tab-system" class="hidden"></section>
  </main>
</div>
<div id="modal" class="hidden"></div>
<div id="msg"></div>
<script src="/panel/playback.js"></script>
<script src="app.js"></script>
</body>
</html>
