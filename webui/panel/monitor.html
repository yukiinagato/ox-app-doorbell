<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #101418; color: #e8edf2;
         font-family: "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  #soundBand { display: none; background: #ffb454; color: #3a2200; text-align: center;
               font-size: 26px; font-weight: bold; padding: 14px; cursor: pointer; }
  #offlineBand { display: none; background: #ff6b6b; color: #2a0505; text-align: center;
                 font-size: 26px; font-weight: bold; padding: 12px; }
  #pushBar { padding: 8px 16px; color: #8a97a5; }
  #pushBtn, #answerBtn, #monitorClose, #replyActions button {
                        background: #274261; border: 1px solid #4da3ff; border-radius: 9px;
                        color: #fff; font-size: 18px; padding: 9px 18px; margin: 5px; }
  #pushBtn:disabled { opacity: .45; }
  h1 { font-size: 24px; color: #8a97a5; font-weight: normal; padding: 12px 16px 4px; }

  #snapGrid { padding: 8px 12px; }
  .snapCard { display: inline-block; vertical-align: top; background: #1a2027;
              border: 1px solid #2a333d; border-radius: 10px; padding: 10px;
              margin: 6px; width: 46%; }
  .snapCard .lbl { font-size: 22px; padding-bottom: 6px; }
  .snapCard img, .snapCard video { width: 100%; background: #000; border-radius: 6px;
                                   min-height: 120px; }
  #evCard { background: #1a2027; border: 1px solid #2a333d; border-radius: 10px;
            margin: 8px 18px 24px; padding: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 20px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #242d36; }
  th { color: #8a97a5; font-weight: normal; font-size: 16px; }
  .dim { color: #8a97a5; }

  #callView { display: none; position: absolute; left: 0; top: 0; width: 100%;
              height: 100%; background: #101418; text-align: center; z-index: 10; }
  #callView .msg { font-size: 58px; font-weight: bold; color: #ffb454;
                   padding: 26px 10px; line-height: 1.3; }
  #callView img, #callView video { width: 92%; max-width: 900px; background: #000;
                                   border-radius: 10px; }
  #callActions { padding: 14px; }
  #replyActions { display: inline-flex; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>
<div id="soundBand"></div>
<div id="offlineBand" data-semantic-id="status.offline"></div>
<div id="pushBar"><button id="pushBtn" type="button"></button>
  <span id="pushStatus"></span></div>
<h1 id="title" data-semantic-id="ring.title"></h1>
<div id="snapGrid"></div>
<div id="evCard"><table>
  <thead><tr><th id="eventTime"></th><th id="eventType"></th><th id="eventDoor"></th></tr></thead>
  <tbody id="evBody"></tbody>
</table></div>
<div id="callView">
  <div class="msg" id="callMsg" data-semantic-id="ring.title"></div>
  <img id="callImg" alt="">

  <video id="callVideo" style="display:none" muted playsinline autoplay></video>
  <div id="callActions">
    <button id="answerBtn" data-semantic-id="ring.action" type="button"></button>
    <span id="replyActions"></span>
    <button id="monitorClose" data-semantic-id="monitor.close" type="button"></button>
  </div>
</div>

<script src="/panel/playback.js"></script>
<script src="/panel/runtime.js"></script>
<script>
(function () {
  "use strict";
  var POLL_MS = 2000;
  var SNAP_MS = 5000;
  var OFFLINE_AFTER = 5;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    var d = document.createElement("div");
    d.appendChild(document.createTextNode(s == null ? "" : String(s)));
    return d.innerHTML;
  }
  function qs(name) {
    var m = window.location.search.match(new RegExp("[?&]" + name + "=([^&]*)"));
    return m ? decodeURIComponent(m[1].replace(/\+/g, "%20")) : "";
  }
  function fmtTime(ms) {
    if (!ms) return "-";
    var d = new Date(ms);
    function p(n) { return n < 10 ? "0" + n : n; }
    return p(d.getMonth() + 1) + "/" + p(d.getDate()) + " " +
           p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  var TOKEN = qs("k");
  var MOCK = qs("mock") === "1";
  var QUERY_LANG = normalizeLang(qs("lang"));
  var emergencyOverlay = null;

  var LIVE = document.body.getAttribute("data-live") === "1";

  var gridStreams = {};  // door id → {stop}
  var callStream = null;
  var I18N = {};
  var LANG = "";
  var LOADING_LANG = "";
  var LOCALE_WAITERS = [];
  var LOCALE_SERIAL = 0;
  var pushSubscribed = false;
  var pushAction = "";
  var pushPaintState = null;

  function normalizeLang(value) {
    value = String(value || "").toLowerCase().split("-")[0];
    return value === "ja" || value === "en" || value === "zh" ? value : "";
  }
  function t(key, values) {
    var value = typeof I18N[key] === "string" ? I18N[key] : key;
    values = values || {};
    for (var name in values) if (Object.prototype.hasOwnProperty.call(values, name))
      value = value.split("{" + name + "}").join(String(values[name]));
    return value;
  }
  function finishLanguage(lang, catalog) {
    LANG = lang;
    I18N = catalog || {};
    LOADING_LANG = "";
    document.documentElement.setAttribute("lang", lang);
    var waiters = LOCALE_WAITERS;
    LOCALE_WAITERS = [];
    for (var i = 0; i < waiters.length; i++) waiters[i]();
  }
  function loadLanguage(requested, cb) {
    var lang = normalizeLang(requested) || "ja";
    if (cb) LOCALE_WAITERS.push(cb);
    if (LANG === lang && !LOADING_LANG) {
      var ready = LOCALE_WAITERS;
      LOCALE_WAITERS = [];
      for (var i = 0; i < ready.length; i++) ready[i]();
      return;
    }
    if (LOADING_LANG === lang) return;
    LOADING_LANG = lang;
    var serial = ++LOCALE_SERIAL;
    xhr("GET", "/locale/" + lang + ".json", null, function (st, j) {
      if (serial !== LOCALE_SERIAL) return;
      if (st === 200 && j) { finishLanguage(lang, j); return; }
      LOADING_LANG = "";
      if (lang !== "en") { loadLanguage("en"); return; }
      finishLanguage("en", {});
    });
  }
  function languageForState(state) {
    if (QUERY_LANG) return QUERY_LANG;
    var doors = (state && state.doors) || [], i, lang;
    for (i = 0; i < doors.length; i++) if (doors[i].calling) {
      lang = normalizeLang(doors[i].visitor_lang);
      if (lang) return lang;
    }
    for (i = 0; i < doors.length; i++) {
      lang = normalizeLang(doors[i].visitor_lang);
      if (lang) return lang;
    }
    return "ja";
  }
  function applyEmergencyI18n() {
    var overlays = document.getElementsByClassName("dbEmergencyOverlay");
    if (overlays.length) {
      var headings = overlays[0].getElementsByTagName("h2");
      var paragraphs = overlays[0].getElementsByTagName("p");
      if (headings.length) headings[0].innerHTML = esc(t("emergency.title"));
      if (paragraphs.length) paragraphs[0].innerHTML = esc(t("emergency.active_detail"));
      if (paragraphs.length > 1)
        paragraphs[1].innerHTML = esc(t("emergency.clear_instruction"));
    }
    var triggers = document.getElementsByClassName("dbSosTrigger");
    if (triggers.length) {
      var spans = triggers[0].getElementsByTagName("span");
      triggers[0].setAttribute("aria-label", t("emergency.button"));
      if (spans.length) spans[0].innerHTML = esc(t("emergency.button"));
      if (spans.length > 1)
        spans[1].innerHTML = esc(t("emergency.hold_hint", { sec: "2" }));
    }
  }
  function installEmergency() {
    emergencyOverlay = DoorbellPanelRuntime.installEmergencyOverlay({
      title: t("emergency.title"),
      detail: t("emergency.active_detail"),
      clearInstruction: t("emergency.clear_instruction"),
      triggerLabel: t("emergency.button"),
      triggerHint: t("emergency.hold_hint", { sec: "2" })
    });
    applyEmergencyI18n();
  }
  function applyI18n() {
    document.title = t("panel.monitor_title");
    $("title").innerHTML = esc(t("panel.monitor_title"));
    $("soundBand").innerHTML = esc(t("panel.tap_sound"));
    $("offlineBand").innerHTML = esc(t("panel.offline"));
    $("answerBtn").innerHTML = esc(t("ring.answer"));
    $("monitorClose").innerHTML = esc(t("monitor.close"));
    $("eventTime").innerHTML = esc(t("panel.event_time"));
    $("eventType").innerHTML = esc(t("panel.event_type"));
    $("eventDoor").innerHTML = esc(t("panel.event_door"));
    $("pushBtn").innerHTML = esc(pushSubscribed ? t("panel.push_disable") :
      t("panel.push_enable"));
    if (pushPaintState) paintPush(pushPaintState);
    lastDoorsKey = "";
    applyEmergencyI18n();
  }

  function makeVideo() {
    var v = document.createElement("video");
    v.muted = true;
    v.autoplay = true;
    v.setAttribute("muted", "");
    v.setAttribute("playsinline", "");
    v.setAttribute("autoplay", "");
    return v;
  }

  function stopGridStreams() {
    for (var id in gridStreams) { try { gridStreams[id].stop(); } catch (e) {} }
    gridStreams = {};
  }
  function stopCallStream() {
    if (callStream) { try { callStream.stop(); } catch (e) {} callStream = null; }
  }

  function xhr(method, path, formBody, cb) {
    var x = new XMLHttpRequest();
    x.open(method, path, true);
    if (formBody) x.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var j = null;
      try { j = JSON.parse(x.responseText); } catch (e) {}
      cb(x.status, j);
    };
    try { x.send(formBody || null); } catch (e2) { cb(0, null); }
  }


  var mockTick = 0;
  function mockState() {
    mockTick++;
    var calling = mockTick > 8 && mockTick < 20;
    return {
      doors: [
        { id: "d_front", label: "Front door", calling: calling },
        { id: "d_back", label: "Back door", calling: false }
      ],
      events: [
        { type: "press", door: "Front door", wall_ms: 1756300000000 },
        { type: "motion", door: "Back door", wall_ms: 1756290000000 }
      ],
      reply: null,
      quick_replies: [
        { id: "soon", label: "Coming now" },
        { id: "leave", label: "Please leave it at the door" }
      ],
      server_ts: mockTick
    };
  }

  var GRAY = "data:image/gif;base64,R0lGODlhAQABAIAAADg4OAAAACwAAAAAAQABAAACAkQBADs=";
  function snapshotUrl(doorId, ts) {
    if (MOCK) return GRAY;
    return "/snapshot-proxy?door=" + encodeURIComponent(doorId) +
           (LIVE ? "&live=1" : "&t=" + ts);
  }
  function fetchState(cb) {
    if (MOCK) { cb(200, mockState()); return; }
    xhr("GET", DoorbellPanelRuntime.panelStateUrl(), null, cb);
  }

  function unlockAudio() {
    if (!audio || audioUnlocked) return;
    try { audio.play(); audio.pause(); audioUnlocked = true; } catch (e) {}
    $("soundBand").style.display = "none";
  }
  document.addEventListener("touchstart", unlockAudio, false);
  document.addEventListener("click", unlockAudio, false);
  function ring() {
    if (!audio || !audioUnlocked) return;
    try { audio.currentTime = 0; audio.play(); } catch (e) {}
  }



  var lastDoorsKey = "";
  function renderSnapGrid(doors) {
    var key = "";
    for (var i = 0; i < doors.length; i++)
      key += doors[i].id + "|" + doors[i].label + "|" + doors[i].stream_mp4 + "|" +
             doors[i].stream_mjpeg + "|" + JSON.stringify(doors[i].playback_profile || {}) + ";";
    if (key === lastDoorsKey) return;
    lastDoorsKey = key;
    stopGridStreams();
    var grid = $("snapGrid");
    grid.innerHTML = "";
    for (var k = 0; k < doors.length; k++) {
      var d = doors[k];
      var card = document.createElement("div");
      card.className = "snapCard";
      card.innerHTML = "<div class='lbl'>" + esc(d.label) + "</div>";
      var v = makeVideo();
      var img = document.createElement("img");
      img.alt = "";
      if (!LIVE && !d.stream_mjpeg) img.setAttribute("data-snapshot-door", d.id);
      card.appendChild(img);
      card.appendChild(v);
      var fallback = d.stream_mjpeg || snapshotUrl(d.id, +new Date());
      gridStreams[d.id] = DoorbellPlayback.start({ profile: d.playback_profile,
        mp4: DoorbellPlayback.proxyMp4Url(d.id, TOKEN, d.stream_mp4, window.location),
        mjpeg: fallback, mjpegMode: "image", video: v, img: img });
      grid.appendChild(card);
    }
  }
  setInterval(function () {
    if (LIVE || $("callView").style.display === "block") return;
    var imgs = $("snapGrid").getElementsByTagName("img");
    for (var i = 0; i < imgs.length; i++) {
      var did = imgs[i].getAttribute("data-snapshot-door");
      if (did) imgs[i].src = snapshotUrl(did, +new Date());
    }
  }, SNAP_MS);

  function renderEvents(events) {
    var eventKeys = {
      press: "panel.event_press",
      motion: "panel.event_motion",
      call_answered: "panel.event_call_answered",
      call_cancelled: "panel.event_call_cancelled",
      call_ended: "panel.event_call_ended",
      delivery_result: "panel.event_delivery_result",
      dtmf_action: "panel.event_dtmf_action",
      purpose_selected: "panel.event_purpose_selected",
      reply: "panel.event_reply",
      auto_reply: "panel.event_auto_reply",
      chime: "panel.event_chime",
      device_alert: "panel.event_device_alert",
      emergency: "panel.event_emergency",
      emergency_cancel: "panel.event_emergency_cancel",
      ha_command: "panel.event_ha_command",
      ha_event: "panel.event_ha_event",
      hangup: "panel.event_hangup",
      sip_call: "panel.event_sip_call",
      telegram: "panel.event_telegram",
      visitor_lang: "panel.event_visitor_lang",
      quick_reply: "panel.event_quick_reply"
    };
    var rows = "";
    for (var i = 0; i < events.length && i < 10; i++) {
      var e = events[i];
      var type = eventKeys[e.type] ? t(eventKeys[e.type]) : e.type;
      rows += "<tr><td class='dim'>" + fmtTime(e.wall_ms) + "</td><td>" + esc(type) +
              "</td><td>" + esc(e.door || e.device || "") + "</td></tr>";
    }
    $("evBody").innerHTML = rows;
  }



  var callingDoorId = null;
  var callingDoorKey = "";
  var activeCalling = null, dismissedCallKey = "";
  var cancelledKey = "", cancelledUntil = 0, cancelledDoor = "";
  function callIdentity(calling) {
    return String(calling.call_id || (calling.id + "|" +
      (calling.stage_revision || 0) + "|" + (calling.expires_at_ms || 0)));
  }
  function renderQuickReplies(calling, replies) {
    var host = $("replyActions");
    host.innerHTML = "";
    for (var ri = 0; ri < (replies || []).length; ri++) {
      var reply = replies[ri] || {};
      var visitorLang = normalizeLang(calling.visitor_lang);
      var visitorLabel = reply.labels &&
        (reply.labels[visitorLang] || reply.labels[LANG] || reply.labels.ja ||
         reply.labels.en || reply.labels.zh);
      visitorLabel = visitorLabel || reply.label;
      if (!reply.id || !visitorLabel) continue;
      var chosenReply = { id: reply.id, label: visitorLabel };
      var button = document.createElement("button");
      button.type = "button";
      button.setAttribute("data-semantic-id", "reply.button");
      button.appendChild(document.createTextNode(visitorLabel));
      button.onclick = (function (chosen, el) {
        return function () {
          if (!activeCalling || callIdentity(activeCalling) !== callIdentity(calling)) return;
          el.disabled = true;
          var body = "reply_id=" + encodeURIComponent(chosen.id) +
            "&door=" + encodeURIComponent(calling.id) +
            "&call_id=" + encodeURIComponent(calling.call_id || "") +
            "&stage_revision=" + encodeURIComponent(calling.stage_revision || 0);
          xhr("POST", "/api/panel/reply", body, function (status) {
            if (status >= 200 && status < 300) {
              $("callMsg").innerHTML = esc(t("reply.sent", { text: chosen.label }));
            } else {
              el.disabled = false;
              $("callMsg").innerHTML = esc(t("reply.failed"));
            }
          });
        };
      })(chosenReply, button);
      host.appendChild(button);
    }
  }
  function renderCall(doors, events, quickReplies) {
    var calling = null;
    for (var i = 0; i < doors.length; i++) if (doors[i].calling) { calling = doors[i]; break; }
    var img = $("callImg");
    var vid = $("callVideo");
    if (calling) {
      var callKey = callIdentity(calling);
      if (dismissedCallKey === callKey) {
        activeCalling = calling;
        callingDoorId = null;
        callingDoorKey = "";
        stopCallStream();
        $("callView").style.display = "none";
        return;
      }
      activeCalling = calling;
      var msg = t("ring.incoming", { door: calling.label });
      $("callMsg").innerHTML = esc(msg);
      if (callingDoorId !== calling.id) ring();
      var streamKey = calling.id + "|" + calling.stream_mp4 + "|" + calling.stream_mjpeg + "|" +
                      JSON.stringify(calling.playback_profile || {});
      if (callingDoorKey !== streamKey || !callStream) {
        stopCallStream();
        callStream = DoorbellPlayback.start({ profile: calling.playback_profile,
          mp4: DoorbellPlayback.proxyMp4Url(calling.id, TOKEN, calling.stream_mp4, window.location),
          mjpeg: calling.stream_mjpeg || snapshotUrl(calling.id, +new Date()),
          mjpegMode: "image", video: vid, img: img });
        callingDoorKey = streamKey;
      }
      callingDoorId = calling.id;
      cancelledUntil = 0;
      $("answerBtn").style.display = "";
      $("answerBtn").onclick = function () {
        var url = DoorbellPanelRuntime.panelUrl("call", TOKEN, MOCK, calling.id);
        var hashAt = url.indexOf("#"), hash = hashAt >= 0 ? url.substring(hashAt) : "";
        var base = hashAt >= 0 ? url.substring(0, hashAt) : url;
        window.location.href = base + (base.indexOf("?") >= 0 ? "&" : "?") +
          "lang=" + encodeURIComponent(LANG) + hash;
      };
      renderQuickReplies(calling, quickReplies);
      $("monitorClose").onclick = function () {
        dismissedCallKey = callKey;
        callingDoorId = null;
        callingDoorKey = "";
        stopCallStream();
        $("callView").style.display = "none";
      };
      $("callView").style.display = "block";
    } else {
      activeCalling = null;
      $("replyActions").innerHTML = "";
      var wasCalling = callingDoorId;
      var newest = null;
      for (var ei = 0; ei < (events || []).length; ei++) {
        var ev = events[ei] || {};
        if (ev.type === "call_cancelled" && (!newest || Number(ev.wall_ms) > Number(newest.wall_ms)))
          newest = ev;
      }
      if (newest) {
        var nk = (newest.call_id || "") + "|" + (newest.door || "") + "|" + (newest.wall_ms || 0);
        if (nk !== cancelledKey) {
          cancelledKey = nk;
          // Do not replay an old cancellation merely because it is in the initial 10-event page.
          if (wasCalling || (new Date().getTime() - Number(newest.wall_ms || 0) < 5000)) {
            cancelledUntil = new Date().getTime() + 30000;
            cancelledDoor = newest.door || wasCalling || "";
          }
        }
      }
      callingDoorId = null;
      callingDoorKey = "";
      stopCallStream();
      vid.style.display = "none";
      img.style.display = "";
      if (cancelledUntil > new Date().getTime()) {
        $("callMsg").innerHTML = esc(t("ring.cancelled") +
          (cancelledDoor ? " (" + cancelledDoor + ")" : ""));
        $("answerBtn").style.display = "none";
        $("callView").style.display = "block";
      } else $("callView").style.display = "none";
    }
  }


  var failCount = 0;
  function render(state) {
    var desiredLang = languageForState(state);
    if (desiredLang !== LANG) {
      loadLanguage(desiredLang, function () { applyI18n(); render(state); });
      return;
    }
    emergencyOverlay.update(state);
    renderSnapGrid(state.doors || []);
    renderEvents(state.events || []);
    renderCall(state.doors || [], state.events || [], state.quick_replies || []);
    DoorbellPanelRuntime.applySemanticUi(state, { page: "monitor" });
  }
  function poll() {
    fetchState(function (st, j) {
      if (st === 200 && j) {
        failCount = 0;
        $("offlineBand").style.display = "none";
        render(j);
      } else {
        failCount++;
        if (failCount >= OFFLINE_AFTER) $("offlineBand").style.display = "block";
      }
      setTimeout(poll, POLL_MS);
    });
  }
  function paintPush(state) {
    state = state || {};
    pushPaintState = state;
    if (state.subscribed !== undefined) pushSubscribed = !!state.subscribed;
    var message = "";
    if (state.message_key && typeof I18N[state.message_key] === "string")
      message = t(state.message_key);
    else if (state.unavailable) message = t("panel.push_unavailable");
    else if (state.pending) message = t(pushAction === "disable" ?
      "panel.push_disabling" : "panel.push_enabling");
    else if (state.ok === false) message = t("panel.push_failed");
    else message = t(pushSubscribed ? "panel.push_enabled" : "panel.push_disabled");
    $("pushStatus").innerHTML = esc(message);
    $("pushBtn").innerHTML = esc(pushSubscribed ? t("panel.push_disable") :
      t("panel.push_enable"));
    $("pushBtn").disabled = !!state.pending || !!state.unavailable;
    if (!state.pending) pushAction = "";
  }
  function setupPushButton() {
    var cap = DoorbellPanelRuntime.pushCapability();
    if (!cap.available) {
      paintPush({ unavailable: true }); return;
    }
    $("pushBtn").onclick = function () {
      pushAction = pushSubscribed ? "disable" : "enable";
      if (pushSubscribed) DoorbellPanelRuntime.unsubscribePush(TOKEN, paintPush);
      else DoorbellPanelRuntime.subscribePush(TOKEN, "/panel/monitor", paintPush);
    };
    DoorbellPanelRuntime.pushSubscriptionState(paintPush);
  }
  loadLanguage(QUERY_LANG || "ja", function () {
    applyI18n();
    installEmergency();
    setupPushButton();
    if (MOCK) { poll(); return; }
    DoorbellPanelRuntime.establishSession(function (result) {
      TOKEN = result.credential || "";
      if (result.ok) poll();
      else $("offlineBand").style.display = "block";
    });
  });
})();
</script>
</body>
</html>
