<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title></title>
<link rel="stylesheet" href="/panel/panel.css">
</head>
<body class="monitorPage">
<div id="soundBand" class="band warning"></div>
<div id="offlineBand" class="band" data-semantic-id="status.offline" role="status"></div>
<header id="dashHeader">
  <div class="dashClock"><span id="clock"></span>
    <h1 id="title" data-semantic-id="ring.title"><span id="titleText"></span></h1></div>
  <div id="statusChips" role="status">
    <span id="offlineChip" class="chip warning"></span>
  </div>
  <div id="pushBar"><button id="pushBtn" type="button"></button>
    <span id="pushStatus"></span></div>
</header>
<nav id="dashTabs" role="tablist">
  <button type="button" role="tab" id="tabDoors" data-pane="doors" aria-controls="doorsPane" aria-selected="true"></button>
  <button type="button" role="tab" id="tabHistory" data-pane="history" aria-controls="historyPane" aria-selected="false" tabindex="-1"></button>
</nav>
<div id="dashBody" data-pane="doors">
  <section id="doorsPane" role="tabpanel" aria-labelledby="tabDoors">
    <button id="missedNotice" class="notice" type="button" hidden></button>
    <div id="snapGrid"></div>
    <p class="paneEmpty" id="doorsEmpty"></p></section>
  <section id="historyPane" role="tabpanel" aria-labelledby="tabHistory">
    <div id="evCard">
      <div id="evHead"><h2 id="historyTitle"></h2>
        <button id="markSeen" type="button"></button></div>
      <div id="evBody"></div>
      <p class="paneEmpty" id="evEmpty"></p>
    </div>
  </section>
</div>
<div id="callView" role="dialog" aria-modal="true" aria-labelledby="callMsg">
  <div class="callFrame">
    <div class="callMedia"><div class="ratio" id="callPicture">
      <img id="callImg" alt="">
      <video id="callVideo" style="display:none" muted playsinline autoplay></video>
      <div id="callPh" class="videoPh connecting" role="status"><span class="phSpin" aria-hidden="true"></span>
        <span class="phDoor" id="callPhDoor"></span><span class="phText"></span></div>
    </div></div>
    <div class="callSide">
      <div class="msg" id="callMsg" data-semantic-id="ring.title"></div>
      <div id="callBadges"></div>
      <div id="callActions">
        <button id="answerBtn" class="positive" data-semantic-id="ring.action" type="button"></button>
        <button id="replyBtn" type="button" aria-expanded="false" aria-controls="replySheet"></button>
        <button id="monitorClose" class="quiet" data-semantic-id="monitor.close" type="button"></button>
      </div>
    </div>
  </div>
  <div id="sheetScrim" hidden></div>
  <div id="replySheet" role="dialog" aria-modal="true" aria-labelledby="replyTitle" hidden>
    <div class="sheetHead"><h2 id="replyTitle"></h2>
      <button id="replySheetClose" type="button"></button></div>
    <div id="replyActions"></div>
  </div>
</div>

<script src="/panel/playback.js"></script>
<script src="/panel/runtime.js"></script>
<script src="/panel/panel-common.js"></script>
<script>
(function () {
  "use strict";
  var POLL_MS = 2000;
  var SNAP_MS = 5000;
  var OFFLINE_AFTER = 5;

  var C = DoorbellPanelCommon, R = DoorbellPanelRuntime;
  function $(id) { return document.getElementById(id); }
  var esc = C.esc, qs = C.qs, normalizeLang = C.normalizeLang;
  function fmtTime(ms) {
    if (!ms) return "-";
    var d = new Date(ms);
    function p(n) { return n < 10 ? "0" + n : n; }
    return p(d.getMonth() + 1) + "/" + p(d.getDate()) + " " +
           p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  var TOKEN = qs("k");
  var QUERY_LANG = normalizeLang(qs("lang"));
  var emergencyOverlay = null;

  var LIVE = document.body.getAttribute("data-live") === "1";

  var gridStreams = {};  // door id → {stop}
  var callStream = null;
  var LANG = "";
  var catalog = C.createCatalog(R.panelRequest, function (lang) { LANG = lang; });
  var pushSubscribed = false;
  var pushAction = "";
  var pushPaintState = null;

  function t(key, values) { return catalog.t(key, values); }
  function loadLanguage(requested, cb) { catalog.load(requested, cb); }
  function languageForState(state) {
    if (QUERY_LANG) return QUERY_LANG;
    var doors = (state && state.doors) || [], i, lang;
    for (i = 0; i < doors.length; i++) if (doors[i].calling) {
      lang = normalizeLang(doors[i].visitor_lang);
      if (lang) return lang;
    }
    for (i = 0; i < doors.length; i++) {
      lang = normalizeLang(doors[i].visitor_lang);
      if (lang) return lang;
    }
    return "ja";
  }
  function applyEmergencyI18n() { C.applyEmergencyText(emergencyOverlay, t); }
  function installEmergency() {
    emergencyOverlay = DoorbellPanelRuntime.installEmergencyOverlay({
      translate: t,
      title: t("emergency.title"),
      detail: t("emergency.active_detail"),
      clearInstruction: t("emergency.clear_instruction"),
      triggerLabel: t("emergency.button"),
      triggerIcon: C.icon("alert-triangle")
    });
    if (typeof dockSos === "function") dockSos();
    applyEmergencyI18n();
  }
  // SOS sits at the leading edge of the current fixed action zone: the incoming-call actions,
  // the bottom tab bar (compact and medium), or the header (expanded). It never floats over content.
  function dockSos() {
    var trigger = emergencyOverlay && emergencyOverlay.trigger && emergencyOverlay.trigger();
    if (!trigger || !document.getElementById) return;
    var callOpen = $("callView") && $("callView").style.display === "block";
    var zone = callOpen ? $("callActions") :
      $(C.sizeClass(window.innerWidth) === "expanded" ? "dashHeader" : "dashTabs");
    if (zone && (trigger.parentNode !== zone || zone.firstChild !== trigger))
      zone.insertBefore(trigger, zone.firstChild);
  }
  function applyI18n() {
    document.title = t("panel.monitor_title");
    $("titleText").innerHTML = esc(t("panel.monitor_title"));
    $("soundBand").innerHTML = esc(t("panel.tap_sound"));
    $("offlineBand").innerHTML = esc(t("panel.offline"));
    C.setLabel($("answerBtn"), t("ring.answer"), "phone");
    $("historyTitle").innerHTML = esc(t("history.title"));
    $("markSeen").innerHTML = esc(t("history.mark_seen"));
    C.setLabel($("tabDoors"), t("dash.doors"), "door");
    C.setLabel($("tabHistory"), t("history.title"), "history");
    C.setLabel($("replyBtn"), t("ring.quick_replies"), "message-reply");
    C.setText($("replyTitle"), t("reply.choose"));
    C.setText($("replySheetClose"), t("monitor.close"));
    C.setLabel($("monitorClose"), t("ring.ignore"), "bell-off");
    C.setText($("doorsEmpty"), t("dash.no_doors"));
    renderCallLog();
    C.setLabel($("pushBtn"), pushSubscribed ? t("panel.push_disable") : t("panel.push_enable"), "bell");
    if (pushPaintState) paintPush(pushPaintState);
    lastDoorsKey = "";
    applyEmergencyI18n();
  }

  function makeVideo() {
    var v = document.createElement("video");
    v.muted = true;
    v.autoplay = true;
    v.setAttribute("muted", "");
    v.setAttribute("playsinline", "");
    v.setAttribute("autoplay", "");
    return v;
  }

  function stopGridStreams() {
    for (var id in gridStreams) { try { gridStreams[id].stop(); } catch (e) {} }
    gridStreams = {};
  }
  function stopCallStream() {
    if (callStream) { try { callStream.stop(); } catch (e) {} callStream = null; }
  }

  function snapshotUrl(doorId, ts) {
    return "/snapshot-proxy?door=" + encodeURIComponent(doorId) +
           (LIVE ? "&live=1" : "&t=" + ts);
  }
  function fetchState(cb) { R.panelRequest("GET", R.panelStateUrl(), null, cb); }
  // Browsers only fetch same-origin, session-authenticated media (protocol v3). A peer's own
  // origin is never used directly: it would be cross-origin and, under HTTPS, mixed content.
  function liveMjpegUrl(d) {
    return DoorbellPlayback.peerMediaUrl(d, "mjpeg", window.location) || snapshotUrl(d.id, +new Date());
  }

  } catch (e) { audio = null; }
  function unlockAudio() {
    if (!audio || audioUnlocked) return;
    try { audio.play(); audio.pause(); audioUnlocked = true; } catch (e) {}
    $("soundBand").style.display = "none";
  }
  document.addEventListener("touchstart", unlockAudio, false);
  document.addEventListener("click", unlockAudio, false);
  function ring() {
    if (!audio || !audioUnlocked) return;
    try { audio.currentTime = 0; audio.play(); } catch (e) {}
  }



  var lastDoorsKey = "";
  function renderSnapGrid(doors) {
    var key = "";
    for (var i = 0; i < doors.length; i++)
      key += doors[i].id + "|" + doors[i].label + "|" + doors[i].stream_mp4 + "|" +
             doors[i].stream_mjpeg + "|" + JSON.stringify(doors[i].playback_profile || {}) + ";";
    if (key === lastDoorsKey) return;
    lastDoorsKey = key;
    stopGridStreams();
    var grid = $("snapGrid");
    grid.innerHTML = "";
    for (var k = 0; k < doors.length; k++) {
      var d = doors[k];
      // A door tile: preview, name, state chip and last activity. Tapping it opens live view.
      var card = document.createElement("div");
      card.className = "snapCard";
      card.setAttribute("data-door", d.id);
      card.setAttribute("role", "button");
      card.setAttribute("tabindex", "0");
      card.onclick = (function (doorId) {
        return function () { openLive(doorId); };
      })(d.id);
      card.onkeydown = (function (doorId) {
        return function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLive(doorId); } };
      })(d.id);
      var media = document.createElement("div");
      media.className = "tileMedia ratio";
      var v = makeVideo();
      var img = document.createElement("img");
      img.alt = "";
      var live = DoorbellPlayback.peerMediaUrl(d, "mjpeg", window.location);
      if (!LIVE && !live) img.setAttribute("data-snapshot-door", d.id);
      media.appendChild(img);
      media.appendChild(v);
      media.appendChild(makePlaceholder(d.label));
      var repaint = function () { if (lastDoors) updateTiles(lastDoors); };
      if (img.addEventListener) img.addEventListener("load", repaint);
      if (v.addEventListener) { v.addEventListener("playing", repaint); v.addEventListener("loadeddata", repaint); }
      card.appendChild(media);
      var foot = document.createElement("div");
      foot.className = "tileFoot";
      var labelEl = document.createElement("div");
      labelEl.className = "lbl";
      C.setText(labelEl, d.label);
      var chip = document.createElement("span");
      chip.className = "chip state";
      var last = document.createElement("div");
      last.className = "tileLast";
      foot.appendChild(labelEl); foot.appendChild(chip); foot.appendChild(last);
      card.appendChild(foot);
      var fallback = live || snapshotUrl(d.id, +new Date());
      tilePlayback[d.id] = "loading";
      gridStreams[d.id] = DoorbellPlayback.start({ profile: d.playback_profile,
        mp4: DoorbellPlayback.proxyMp4Url(d.id, TOKEN, d.stream_mp4, window.location),
        mjpeg: fallback, mjpegMode: "image", video: v, img: img,
        onState: (function (doorId) {
          return function (state) { tilePlayback[doorId] = state; if (lastDoors) updateTiles(lastDoors); };
        })(d.id) });
      grid.appendChild(card);
    }
  }
  // A video area never shows an empty black box: it names the door and says what is happening.
  var tilePlayback = {}, lastDoors = null;
  function makePlaceholder(label) {
    var ph = document.createElement("div");
    ph.className = "videoPh connecting";
    ph.setAttribute("role", "status");
    var spin = document.createElement("span");

    installEmergency();
    setupPushButton();
    DoorbellPanelRuntime.establishSession(function (result) {
      TOKEN = result.credential || "";
      if (result.ok) poll();
      else $("offlineBand").style.display = "block";
    });
  });
})();
</script>
