<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta http-equiv="refresh" content="300">
<title></title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; }
  body { background: #101418; color: #e8edf2; overflow: hidden;
         font-family: "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  button, select { font-family: inherit; }
  button { cursor: pointer; overflow-wrap: break-word; word-wrap: break-word; }
  button:focus, select:focus { outline: 3px solid #ffd166; outline-offset: 2px; }
  #layout { display: -webkit-box; display: -webkit-flex; display: flex;
            -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
            width: 100%; height: 100%; }
  #offlineBand { display: none; background: #26313c; color: #fff; text-align: center;
                 font-size: 1.125rem; line-height: 1.4; padding: 10px 16px; max-height: 30%; overflow: auto; }
  #replyBanner { display: none; background: #5dd39e; color: #06281a; text-align: center;
                 padding: 14px 16px; max-height: 35%; overflow: auto; }
  #replyBanner .cap { font-size: 1rem; }
  #replyBanner .txt { font-size: 1.75rem; font-weight: bold; line-height: 1.3; overflow-wrap: break-word; }
  #main { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-height: 0; width: 100%;
          text-align: center; padding: 16px; overflow: auto; -webkit-overflow-scrolling: touch; }
  .visitorHeading { display: -webkit-box; display: -webkit-flex; display: flex;
                    -webkit-box-align: center; align-items: center; -webkit-box-pack: justify;
                    justify-content: space-between; margin-bottom: 12px; }
  h1 { font-size: 1.125rem; color: #b9c5d1; font-weight: normal; text-align: left; padding-right: 10px; }
  .languageChoice { text-align: right; font-size: .75rem; color: #b9c5d1; }
  .languageChoice span { display: block; }
  #visitorLanguage { min-height: 44px; max-width: 130px; padding: 6px 8px; font-size: 1rem;
                     background: #1a2027; color: #e8edf2; border: 1px solid #63758a; border-radius: 8px; }
  #hint { font-size: 1rem; color: #b9c5d1; line-height: 1.35; padding-bottom: 8px; }
  .doorBtn { display: block; background: #1a2027; border: 3px solid #4da3ff; border-radius: 18px;
             color: #e8edf2; font-size: 2rem; font-weight: bold; line-height: 1.15;
             width: 100%; max-width: 720px; min-height: 88px; margin: 8px auto 14px; padding: 16px 14px; }
  .doorName { display: block; font-size: .5em; font-weight: normal; line-height: 1.4; margin-top: 8px; }
  .doorBtn:active { background: #4da3ff; color: #04121f; }
  .doorBtn:disabled { opacity: .55; }
  #callingView { display: none; }
  #callingView .big { font-size: 2rem; font-weight: bold; color: #4da3ff; line-height: 1.25;
                      padding: 16px 6px; overflow-wrap: break-word; }
  #callingView .door { font-size: 1.125rem; color: #b9c5d1; line-height: 1.4; }
  #callStatus { min-height: 34px; color: #ffb454; font-size: 1.125rem; line-height: 1.4; padding: 8px 4px 16px; }
  #purposeStep { display: none; padding: 0 0 16px; }
  .purposeBtn { display: block; background: #1a2027; border: 2px solid #ffb454; border-radius: 12px;
                color: #fff; font-size: 1.25rem; line-height: 1.35; width: 100%; min-height: 52px;
                max-width: 720px; margin: 8px auto; padding: 14px 12px; }
  #note { color: #aebbc9; text-align: center; font-size: .875rem; line-height: 1.4; padding: 14px 0; }
  #visitorActions { display: -webkit-box; display: -webkit-flex; display: flex;
                    -webkit-box-align: stretch; align-items: stretch; -webkit-flex-shrink: 0; flex-shrink: 0;
                    padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom));
                    background: #101418; border-top: 1px solid #334253; }
  #visitorActions.idle { -webkit-box-pack: end; justify-content: flex-end; }
  #cancelCall { display: none; -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; min-width: 0; min-height: 88px;
                background: #8d2932; border: 2px solid #fff; border-radius: 14px; color: #fff;
                font-size: 1.5rem; font-weight: bold; line-height: 1.2; padding: 14px 10px; }
  #cancelCall:disabled { opacity: .45; }
  #visitorActions .dbSosTrigger { position: static; -webkit-flex: 0 0 88px; flex: 0 0 88px;
                                width: 88px; min-width: 88px; margin-left: 12px; border-radius: 22px; }
  .dbEmergencyOverlay { overflow: auto; }
  body .dbEmergencyOverlay .dbEmergencyInner { position: relative; top: auto; left: auto; right: auto; margin: 8% 5%; }
  body .dbEmergencyOverlay h2 { font-size: 2rem; overflow-wrap: break-word; }
  body .dbEmergencyOverlay p { font-size: 1.125rem; }
  @media (min-width: 700px) { #main { padding: 24px 32px; } #visitorActions { padding-left: 32px; padding-right: 32px; } }
  @media (max-height: 500px) { #main { padding: 12px 16px; } .visitorHeading { margin-bottom: 8px; } .languageChoice span { display: none; } }
</style>
</head>
<body>
<div id="layout">
  <div id="offlineBand" data-semantic-id="status.offline" role="status" style="display:none"></div>
  <div id="replyBanner" role="status" style="display:none">
    <div class="cap" id="replyCaption"></div>
    <div class="txt" id="replyText"></div>
  </div>
  <main id="main">
    <div class="visitorHeading">
      <h1 id="title"></h1>
      <label class="languageChoice"><span id="languageLabel"></span>
        <select id="visitorLanguage"><option value="ja"></option><option value="en"></option><option value="zh"></option></select>
      </label>
    </div>
    <div id="hint"></div>
    <div id="doorList"></div>
    <div id="callingView">
      <div class="door" id="callingDoor"></div>
      <div class="big" id="callingMsg" data-semantic-id="ring.title" role="status"></div>
      <div id="callStatus" role="status"></div>
      <div id="purposeStep"></div>
    </div>
    <div id="note"></div>
  </main>
  <div id="visitorActions" class="idle">
    <button id="cancelCall" data-semantic-id="cancel.call" type="button"></button>
  </div>
</div>

<script src="/panel/runtime.js"></script>
<script src="/panel/call-flow.js"></script>
<script>
(function () {
  "use strict";
  var POLL_MS = 2000;
  var REPLY_MS = 30000;
  var OFFLINE_AFTER = 5;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    var d = document.createElement("div");
    d.appendChild(document.createTextNode(s == null ? "" : String(s)));
    return d.innerHTML;
  }
  function qs(name) {
    var m = window.location.search.match(new RegExp("[?&]" + name + "=([^&]*)"));
    return m ? decodeURIComponent(m[1].replace(/\+/g, "%20")) : "";
  }

  var TOKEN = qs("k");
  var MOCK = qs("mock") === "1";
  var I18N = {};
  var LANG = "";
  var LOADING_LANG = "";
  var LOCALE_WAITERS = [];
  var LOCALE_SERIAL = 0;
  var QUERY_LANG = normalizeLang(qs("lang"));
  var emergencyOverlay = null;

  function normalizeLang(value) {
    value = String(value || "").toLowerCase().split("-")[0];
    return value === "ja" || value === "en" || value === "zh" ? value : "";
  }
  function t(key, values) {
    var value = typeof I18N[key] === "string" ? I18N[key] : key;
    values = values || {};
    for (var name in values) if (Object.prototype.hasOwnProperty.call(values, name))
      value = value.split("{" + name + "}").join(String(values[name]));
    return value;
  }
  function finishLanguage(lang, catalog) {
    LANG = lang;
    I18N = catalog || {};
    LOADING_LANG = "";
    document.documentElement.setAttribute("lang", lang);
    var waiters = LOCALE_WAITERS;
    LOCALE_WAITERS = [];
    for (var i = 0; i < waiters.length; i++) waiters[i]();
  }
  function loadLanguage(requested, cb) {
    var lang = normalizeLang(requested) || "ja";
    if (cb) LOCALE_WAITERS.push(cb);
    if (LANG === lang && !LOADING_LANG) {
      var ready = LOCALE_WAITERS;
      LOCALE_WAITERS = [];
      for (var i = 0; i < ready.length; i++) ready[i]();
      return;
    }
    if (LOADING_LANG === lang) return;
    LOADING_LANG = lang;
    var serial = ++LOCALE_SERIAL;
    xhr("GET", "/locale/" + lang + ".json", null, function (st, j) {
      if (serial !== LOCALE_SERIAL) return;
      if (st === 200 && j) { finishLanguage(lang, j); return; }
      LOADING_LANG = "";
      if (lang !== "en") { loadLanguage("en"); return; }
      finishLanguage("en", {});
    });
  }
  function languageForState(state, doorId) {
    if (QUERY_LANG) return QUERY_LANG;
    var doors = (state && state.doors) || [], i, lang;
    for (i = 0; doorId && i < doors.length; i++) if (doors[i].id === doorId) {
      lang = normalizeLang(doors[i].visitor_lang);
      if (lang) return lang;
    }
    for (i = 0; i < doors.length; i++) if (doors[i].calling) {
      lang = normalizeLang(doors[i].visitor_lang);
      if (lang) return lang;
    }
    for (i = 0; i < doors.length; i++) {
      lang = normalizeLang(doors[i].visitor_lang);
      if (lang) return lang;
    }
    return "ja";
  }
  function applyEmergencyI18n() {
    if (emergencyOverlay && emergencyOverlay.refreshText) emergencyOverlay.refreshText();
    var overlays = document.getElementsByClassName("dbEmergencyOverlay");
    if (overlays.length) {
      var headings = overlays[0].getElementsByTagName("h2");
      var paragraphs = overlays[0].getElementsByTagName("p");
      if (headings.length) headings[0].innerHTML = esc(t("emergency.title"));
      if (paragraphs.length) paragraphs[0].innerHTML = esc(t("emergency.active_detail"));
      if (paragraphs.length > 1)
        paragraphs[1].innerHTML = esc(t("emergency.clear_instruction"));
    }
    var triggers = document.getElementsByClassName("dbSosTrigger");
    if (triggers.length) {
      var spans = triggers[0].getElementsByTagName("span");
      triggers[0].setAttribute("aria-label", t("emergency.button"));
      if (spans.length) spans[0].innerHTML = esc(t("emergency.button"));
      if (spans.length > 1)
        spans[1].innerHTML = esc(t("emergency.hold_hint", { sec: "2" }));
    }
  }
  function installEmergency() {
    emergencyOverlay = DoorbellPanelRuntime.installEmergencyOverlay({
      translate: t,
      title: t("emergency.title"),
      detail: t("emergency.active_detail"),
      clearInstruction: t("emergency.clear_instruction"),
      triggerLabel: t("emergency.button"),
      triggerHint: t("emergency.hold_hint", { sec: "2" })
    });
    var actions = document.getElementById && document.getElementById("visitorActions");
    if (actions && emergencyOverlay.trigger()) actions.appendChild(emergencyOverlay.trigger());
    applyEmergencyI18n();
  }
  function applyI18n() {
    document.title = t("panel.title");
    $("title").innerHTML = esc(t("panel.title"));
    $("hint").innerHTML = esc(t("panel.press_hint"));
    $("languageLabel").innerHTML = esc(t("idle.language"));
    var languageNames = { ja: t("language.name_ja"), en: t("language.name_en"), zh: t("language.name_zh") };
    var languageOptions = $("visitorLanguage").getElementsByTagName("option");
    for (var i = 0; i < languageOptions.length; i++)
      languageOptions[i].innerHTML = esc(languageNames[languageOptions[i].value]);
    $("visitorLanguage").value = LANG;
    $("visitorLanguage").setAttribute("aria-label", t("idle.language"));
    $("note").innerHTML = esc(t("panel.no_audio_note"));
    $("offlineBand").innerHTML = esc(t("panel.offline"));
    $("replyCaption").innerHTML = esc(t("reply.banner"));
    if (!currentCall) {
      $("callingMsg").innerHTML = esc(t("panel.calling"));
      $("cancelCall").innerHTML = esc(t("calling.cancel"));
    }
    lastDoorsJson = "";
    applyEmergencyI18n();
  }

  function xhr(method, path, formBody, cb) {
    var x = new XMLHttpRequest();
    x.open(method, path, true);
    if (formBody) x.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var j = null;
      try { j = JSON.parse(x.responseText); } catch (e) {}
      cb(x.status, j);
    };
    try { x.send(formBody || null); } catch (e2) { cb(0, null); }
  }


  var mockTick = 0;
  var mockState = {
    doors: [
      { id: "d_front", label: "Front door", calling: false },
      { id: "d_back", label: "Back door", calling: false },
      { id: "d_garage", label: "Garage", calling: false }
    ],
    events: [], reply: null, server_ts: 0
  };
  function fetchState(cb) {
    if (MOCK) {
      mockTick++;

      if (mockTick === Math.round(15000 / POLL_MS)) {
        mockState.reply = { text: "Coming now", ts: mockTick };
      }
      mockState.server_ts = mockTick;
      cb(200, mockState);
      return;
    }
    xhr("GET", DoorbellPanelRuntime.panelStateUrl(), null, cb);
  }
  function sendPress(doorId, purpose, cb) {
    if (MOCK) {
      var callId = "mock-call-" + (++mockTick);
      for (var i = 0; i < mockState.doors.length; i++) if (mockState.doors[i].id === doorId) {
        mockState.doors[i].calling = true; mockState.doors[i].call_id = callId;
        mockState.doors[i].call_state = "ringing"; mockState.doors[i].stage_revision = 0;
        mockState.doors[i].expires_at_ms = new Date().getTime() + 60000;
      }
      cb(200, { ok: true, call_id: callId, call_state: "ringing", stage_revision: 0,
                expires_at_ms: new Date().getTime() + 60000 }); return;
    }
    xhr("POST", "/api/panel/press",
        DoorbellCallFlow.pressForm(doorId, TOKEN, purpose), cb);
  }
  function sendPurpose(doorId, callId, purpose, cb) {
    if (MOCK) { cb(200, { ok: true, call_id: callId, stage_revision: 2 }); return; }
    xhr("POST", "/api/panel/purpose",
        DoorbellCallFlow.purposeForm(doorId, callId, purpose, TOKEN), cb);
  }
  function sendCancel(doorId, callId, cb) {
    if (!callId) { cb(409, { ok: false, err: "call_id unavailable" }); return; }
    if (MOCK) {
      for (var i = 0; i < mockState.doors.length; i++) if (mockState.doors[i].id === doorId) {
        mockState.doors[i].calling = false; mockState.doors[i].call_state = "cancelled";
      }
      mockState.events.unshift({ type: "call_cancelled", door: doorId, call_id: callId,
                                 wall_ms: new Date().getTime() });
      cb(200, { ok: true, call_id: callId }); return;
    }
    xhr("POST", "/api/panel/cancel",
        DoorbellCallFlow.cancelForm(doorId, callId, TOKEN), cb);
  }
  function sendHangup(doorId, callId, cb) {
    if (!callId) { cb(409, { ok: false, err: "call_id unavailable" }); return; }
    if (MOCK) {
      for (var i = 0; i < mockState.doors.length; i++) if (mockState.doors[i].id === doorId) {
        mockState.doors[i].calling = false; mockState.doors[i].call_state = "ended";
      }
      cb(200, { ok: true, call_id: callId }); return;
    }
    xhr("POST", "/api/panel/hangup",
        DoorbellCallFlow.cancelForm(doorId, callId, TOKEN), cb);
  }


  var lastDoorsJson = "";
  function renderDoors(doors) {
    var jsonNow = "";
    for (var i = 0; i < doors.length; i++) jsonNow += doors[i].id + "|" + doors[i].label + ";";
    if (jsonNow === lastDoorsJson) return;
    lastDoorsJson = jsonNow;
    var list = $("doorList");
    list.innerHTML = "";
    var half = doors.length > 4;
    for (var k = 0; k < doors.length; k++) {
      var b = document.createElement("button");
      b.className = "doorBtn" + (half ? " half" : "");
      b.setAttribute("data-door", doors[k].id);
      b.setAttribute("data-label", doors[k].label);
      b.setAttribute("data-semantic-id", "call.primary");
      b.innerHTML = "<span>" + esc(t("idle.call_button_verb")) + "</span><span class='doorName'>" + esc(doors[k].label) + "</span>";
      b.onclick = onPress;
      list.appendChild(b);
    }
  }

  // purpose_first selects before ringing; ring_then_purpose selects after call_id creation.
  var callingTimer = null, deadlineTimer = null;
  var currentCall = null, lastCallFlow = "purpose_first", lastPurposes = [];
  var recoveryPendingCall = "", recoveryReportedCall = "", lastState = null, purposeMarkup = "";

  function reportRecovery(door, callId, state) {
    if (!callId || recoveryPendingCall === callId || recoveryReportedCall === callId) return;
    recoveryPendingCall = callId;
    // A pending visitor call is recoverable once this page has rebuilt its waiting UI. An
    // established SIP dialog is owned by the answering client and cannot be restored here.
    var restored = state === "ringing" || state === "purpose_pending";
    xhr("POST", "/api/panel/recovery",
      DoorbellCallFlow.recoveryForm(door, callId, restored, TOKEN), function (st) {
        recoveryPendingCall = "";
        if (st >= 200 && st < 300) recoveryReportedCall = callId;
      });
  }
  function setDoorButtonsDisabled(disabled) {
    var bs = $("doorList").getElementsByTagName("button");
    for (var i = 0; i < bs.length; i++) bs[i].disabled = !!disabled;
  }
  function labelIn(value) {
    if (!value || typeof value !== "object") return value || "";
    return value[LANG] || value.ja || value.en || value.zh || "";
  }
  function purposeButtons(afterRing) {
    var box = $("purposeStep"), h = "";
    for (var i = 0; i < lastPurposes.length; i++) {
      var p = lastPurposes[i] || {}, label = labelIn(p.label) || p.id;
      h += "<button class='purposeBtn' data-semantic-id='purpose.button' data-purpose='" + esc(p.id) + "'>" +
           esc((p.icon || "") + " " + label) + "</button>";
    }
    h += "<button class='purposeBtn' data-semantic-id='purpose.button' data-purpose=''>" +
      esc(t("purpose.skip")) + "</button>";
    box.style.display = "block";
    var signature = String(afterRing) + ":" + h;
    if (purposeMarkup === signature) return;
    purposeMarkup = signature; box.innerHTML = h;
    var bs = box.getElementsByTagName("button");
    for (var k = 0; k < bs.length; k++) bs[k].onclick = (function (b) {
      return function () { choosePurpose(b.getAttribute("data-purpose"), afterRing); };
    })(bs[k]);
  }
  function showCall(id, label, preflight) {
    currentCall = { door: id, label: label, call_id: "", observed: false,
                    preflight: !!preflight, cancelPending: false, purposeDismissed: false, terminal: false, stage_revision: 0,
                    started: new Date().getTime() };
    $("callingDoor").innerHTML = esc(label);
    $("callingMsg").innerHTML = esc(preflight ? t("idle.choose_purpose") :
      t("panel.calling"));
    $("callStatus").innerHTML = esc(preflight ? t("panel.not_sent") : t("panel.sending"));
    $("purposeStep").style.display = "none";
    $("cancelCall").disabled = !preflight;
    $("cancelCall").setAttribute("data-semantic-id", "cancel.call");
    $("cancelCall").innerHTML = esc(preflight ? t("panel.back") : t("calling.cancel"));
    $("doorList").style.display = "none"; $("hint").style.display = "none";
    $("callingView").style.display = "block"; $("cancelCall").style.display = "block";
    $("visitorActions").className = ""; $("main").scrollTop = 0; setDoorButtonsDisabled(true);
  }
  function resetCall() {
    cancelCallAction();
    currentCall = null;
    if (callingTimer) { clearTimeout(callingTimer); callingTimer = null; }
    if (deadlineTimer) { clearTimeout(deadlineTimer); deadlineTimer = null; }
    $("callingView").style.display = "none"; $("purposeStep").style.display = "none";
    $("cancelCall").style.display = "none"; $("visitorActions").className = "idle";
    $("cancelCall").setAttribute("data-semantic-id", "cancel.call");
    $("doorList").style.display = "block"; $("hint").style.display = "block";
    setDoorButtonsDisabled(false);
  }
  function scheduleReset(c, delayMs) {
    if (callingTimer) return;
    callingTimer = setTimeout(function () {
      if (currentCall === c) resetCall();
    }, delayMs);
  }
  function armDeadlineNotice(c) {
    if (deadlineTimer) { clearTimeout(deadlineTimer); deadlineTimer = null; }
    var delay = DoorbellCallFlow.deadlineDelay(c && c.expires_at_ms, new Date().getTime());
    if (!delay) return;
    deadlineTimer = setTimeout(function () {
      deadlineTimer = null;
      if (currentCall !== c || c.inCall || c.cancelPending) return;
      $("callStatus").innerHTML = esc(t("panel.deadline_reached"));
      // Keep call_id and the cancel control until Core reports a terminal state. A lost poll must
      // never make the visitor lose control while the durable call may still be ringing.
    }, delay);
  }
  function beginPress(purpose) {
    var c = currentCall;
    if (!c) return;
    c.preflight = false; $("purposeStep").style.display = "none";
    $("callingMsg").innerHTML = esc(t("panel.calling"));
    $("callStatus").innerHTML = esc(t("panel.sending")); $("cancelCall").disabled = true;
    $("cancelCall").innerHTML = esc(t("calling.cancel"));
    sendPress(c.door, purpose, function (st, j) {
      if (!currentCall || currentCall !== c) return;
      if (st !== 200 || !j || j.ok !== true) {
        $("callStatus").innerHTML = esc(t("panel.press_failed", {
          reason: j && j.err ? ": " + j.err : ""
        }));
        scheduleReset(c, 3500); return;
      }
      c.call_id = j.call_id || "";
      c.stage_revision = Math.max(c.stage_revision, Number(j.stage_revision) || 0);
      c.expires_at_ms = Number(j.expires_at_ms) || 0;
      armDeadlineNotice(c);
      $("cancelCall").disabled = !c.call_id;
      $("callStatus").innerHTML = esc(c.call_id ? t("panel.resident_notified") :
        t("panel.resident_notified_no_cancel"));
      if (lastCallFlow === "ring_then_purpose" && lastPurposes.length) purposeButtons(true);
    });
  }
  function onPress() {
    var id = this.getAttribute("data-door");
    var label = this.getAttribute("data-label");
    if (currentCall) return;
    var purposeFirst = lastCallFlow === "purpose_first" && lastPurposes.length;
    showCall(id, label, purposeFirst);
    if (purposeFirst) purposeButtons(false); else beginPress("");
  }

  function choosePurpose(purpose, afterRing) {
    var c = currentCall;
    if (!c || c.inCall || c.terminal || c.cancelPending) return;
    c.purposeDismissed = true; $("purposeStep").style.display = "none";
    if (!afterRing) { beginPress(purpose); return; }
    if (!purpose) { $("callStatus").innerHTML = esc(t("panel.resident_notified")); return; }
    if (!c.call_id) {
      $("callStatus").innerHTML = esc(t("panel.purpose_call_missing")); return;
    }
    $("callStatus").innerHTML = esc(t("panel.purpose_sending"));
    sendPurpose(c.door, c.call_id, purpose, function (st, j) {
      if (!currentCall || currentCall !== c) return;
      if (st === 200 && j && j.ok === true) {
        c.stage_revision = Math.max(c.stage_revision, Number(j.stage_revision) || 0);
        $("callStatus").innerHTML = esc(t("panel.purpose_delivered"));
      } else $("callStatus").innerHTML = esc(t("panel.purpose_failed", {
        reason: j && j.err ? ": " + j.err : ""
      }));
    });
  }

  var actionGesture = null, cancelledActionKey = 0, blockedKeyboardRelease = false;
  function callActionKey(event) {
    var key = event && (event.key || event.keyCode);
    if (key === "Enter" || key === 13) return 13;
    if (key === " " || key === "Spacebar" || key === 32) return 32;
    if (key === "Escape" || key === 27) return 27;
    return 0;
  }
  function callActionIntent() {
    var c = currentCall;
    return c && { call: c, call_id: c.call_id, preflight: !!c.preflight,
                  inCall: !!c.inCall, terminal: !!c.terminal };
  }
  function beginCallAction(kind, event) {
    if (event && event.repeat) return;
    if (actionGesture && (actionGesture.held ||
        (kind === "mouse" && actionGesture.kind === "touch"))) return;
    var intent = callActionIntent();
    if (!intent || $("cancelCall").disabled) return;
    intent.kind = kind; intent.key = callActionKey(event); intent.held = true; actionGesture = intent;
  }
  function cancelCallAction() {
    if (actionGesture && actionGesture.kind === "keyboard" && actionGesture.held)
      cancelledActionKey = actionGesture.key;
    actionGesture = null;
  }
  function blockCallActionKeyRelease(event) {
    if (event.preventDefault) event.preventDefault();
    blockedKeyboardRelease = true;
    setTimeout(function () { blockedKeyboardRelease = false; }, 0);
  }
  function finishCallAction(event) {
    if (event && event.type === "keyup" && cancelledActionKey && cancelledActionKey === callActionKey(event)) {
      cancelledActionKey = 0; blockCallActionKeyRelease(event);
      return;
    }
    if (!actionGesture) return;
    if (event && event.type === "keyup" && actionGesture.key !== callActionKey(event)) return;
    var target = event && event.target;
    while (target && target !== $("cancelCall")) target = target.parentNode;
    actionGesture.held = false;
    if (!target || $("cancelCall").disabled) {
      if (event && event.type === "keyup") blockCallActionKeyRelease(event);
      cancelCallAction(); return;
    }
    if (actionGesture.consumed) actionGesture = null;
  }
  var callAction = $("cancelCall");
  callAction.onmousedown = function (event) {
    if (!event || event.button === undefined || event.button === 0) beginCallAction("mouse", event);
  };
  callAction.onpointerdown = function (event) {
    if (!event || event.button === undefined || event.button === 0) beginCallAction(event && event.pointerType === "touch" ? "touch" : "pointer", event);
  };
  function bindCallTouch(name, handler) {
    if (callAction.addEventListener) callAction.addEventListener(name, handler, false);
    else callAction["on" + name] = handler;
  }
  bindCallTouch("touchstart", function (event) { beginCallAction("touch", event); });
  callAction.onkeydown = function (event) {
    var key = callActionKey(event);
    if (key === 13 || key === 32) beginCallAction("keyboard", event);
    else if (key === 27) cancelCallAction();
  };
  bindCallTouch("touchmove", function (event) {
    var touch = event.touches && event.touches[0];
    if (!touch) return;
    var bounds = callAction.getBoundingClientRect();
    if (touch.clientX < bounds.left || touch.clientX > bounds.right ||
        touch.clientY < bounds.top || touch.clientY > bounds.bottom) cancelCallAction();
  });
  callAction.onkeyup = finishCallAction;
  callAction.onmouseup = callAction.onpointerup = finishCallAction;
  bindCallTouch("touchend", finishCallAction);
  bindCallTouch("touchcancel", cancelCallAction);
  callAction.onmouseleave = callAction.onpointerleave = callAction.onpointercancel =
    callAction.onblur = cancelCallAction;
  if (document.addEventListener) {
    document.addEventListener("mouseup", finishCallAction, false);
    document.addEventListener("pointerup", finishCallAction, false);
    document.addEventListener("touchend", finishCallAction, false);
    document.addEventListener("keyup", finishCallAction, false);
  }
  callAction.onclick = function (event) {
    if ((!event || !event.detail) && (cancelledActionKey || blockedKeyboardRelease)) return;
    var intent = actionGesture, c = currentCall, consumed = intent && intent.consumed;
    if (intent && intent.held && intent.kind === "keyboard") intent.consumed = true;
    else actionGesture = null;
    // A physical gesture retains its original call and verb across polling updates.
    // Zero-detail activation without a held gesture is the assistive-technology path.
    if (!intent && (!event || !event.detail)) intent = callActionIntent();
    if (!intent || consumed || !c || c !== intent.call ||
        c.call_id !== intent.call_id || !!c.preflight !== intent.preflight ||
        !!c.inCall !== intent.inCall || !!c.terminal !== intent.terminal ||
        c.terminal || c.cancelPending) return;
    if (intent.preflight) { resetCall(); return; }
    if (!intent.call_id) {
      $("callStatus").innerHTML = esc(t("panel.cancel_missing_id")); return;
    }
    c.cancelPending = true; $("cancelCall").disabled = true;
    var ending = intent.inCall;
    $("callStatus").innerHTML = esc(ending ? t("panel.call_ending") :
      t("panel.cancel_sending"));
    (ending ? sendHangup : sendCancel)(c.door, c.call_id, function (st, j) {
      if (!currentCall || currentCall !== c) return;
      if (st === 200 && j && j.ok === true) {
        $("callStatus").innerHTML = esc(ending ? t("panel.call_end_accepted") :
          t("panel.cancel_accepted"));
      } else {
        c.cancelPending = false; $("cancelCall").disabled = false;
        $("callStatus").innerHTML = esc((st === 404 || st === 501) ?
          (ending ? t("panel.call_end_unavailable") : t("panel.cancel_unavailable")) :
          t(ending ? "panel.call_end_failed" : "panel.cancel_failed", {
            reason: j && j.err ? ": " + j.err : ""
          }));
      }
    });
  };


  var lastReplyTs = -1;
  var replyTimer = null;
  function renderReply(reply) {
    if (lastReplyTs === -1) { lastReplyTs = (reply && reply.ts) || 0; return; }
    if (!reply || !reply.ts || reply.ts <= lastReplyTs) return;
    lastReplyTs = reply.ts;
    $("replyText").innerHTML = esc(reply.text);
    $("replyBanner").style.display = "block";
    if (replyTimer) clearTimeout(replyTimer);
    replyTimer = setTimeout(function () {
      $("replyBanner").style.display = "none";
    }, REPLY_MS);
  }


  var failCount = 0;
  function render(state) {
    lastState = state;
    var desiredLang = languageForState(state, currentCall && currentCall.door);
    if (desiredLang !== LANG) {
      loadLanguage(desiredLang, function () { applyI18n(); render(state); });
      return;
    }
    emergencyOverlay.update(state);
    lastCallFlow = DoorbellCallFlow.flowMode(state.call_flow);
    lastPurposes = state.purposes || [];
    renderDoors(state.doors || []);
    renderReply(state.reply);
    var match = null, i;
    if (currentCall) {
      for (i = 0; i < (state.doors || []).length; i++)
        if (state.doors[i].id === currentCall.door) { match = state.doors[i]; break; }
    } else {
      for (i = 0; i < (state.doors || []).length; i++) if (state.doors[i].calling) {
        match = state.doors[i]; showCall(match.id, match.label, false); break;
      }
    }
    if (currentCall && currentCall.preflight) {
      $("callingMsg").innerHTML = esc(t("idle.choose_purpose"));
      $("cancelCall").innerHTML = esc(t("panel.back"));
      $("callStatus").innerHTML = esc(t("panel.not_sent"));
      purposeButtons(false);
    }
    if (currentCall && match && !currentCall.preflight) {
      var merged = DoorbellCallFlow.mergeState(currentCall, match);
      if (merged.accepted) {
        currentCall.stage_revision = merged.stage_revision;
        currentCall.call_id = merged.call_id;
        if (merged.expires_at_ms && merged.expires_at_ms !== currentCall.expires_at_ms) {
          currentCall.expires_at_ms = merged.expires_at_ms;
          armDeadlineNotice(currentCall);
        }
        currentCall.observed = currentCall.observed || !!match.calling;
        currentCall.inCall = match.call_state === "answered" || match.call_state === "in_call";
        currentCall.terminal = match.call_state === "cancelled" || match.call_state === "expired" || match.call_state === "ended";
        if (currentCall.terminal) $("purposeStep").style.display = "none";
        if (currentCall.inCall && deadlineTimer) {
          clearTimeout(deadlineTimer); deadlineTimer = null;
        }
        $("cancelCall").setAttribute("data-semantic-id", currentCall.inCall ?
          "call.end" : "cancel.call");
        $("cancelCall").disabled = currentCall.cancelPending || !currentCall.call_id;
        $("cancelCall").innerHTML = esc(currentCall.inCall ? t("incall.end") :
          t("calling.cancel"));
        if (match.recovery_required)
          reportRecovery(match.id, currentCall.call_id, match.call_state);
        $("callingMsg").innerHTML = esc(t(match.recovery_required ? "visitor.restoring" :
          currentCall.inCall ? "incall.title" : match.call_state === "expired" ? "calling.no_answer" :
          match.call_state === "ended" || match.call_state === "cancelled" ? "panel.call_finished" : "panel.calling"));
        if (currentCall.inCall) {
          $("purposeStep").style.display = "none";
          $("callStatus").innerHTML = esc(t("panel.resident_answered"));
        } else if (match.call_state === "purpose_pending" && lastCallFlow === "ring_then_purpose") {
          if (!currentCall.purposeDismissed) purposeButtons(true);
        }
        else if (match.call_state === "cancelled") {
          $("callStatus").innerHTML = esc(t("panel.call_cancelled"));
          $("cancelCall").disabled = true; scheduleReset(currentCall, 3500);
        } else if (match.call_state === "expired" || match.call_state === "ended") {
          $("callStatus").innerHTML = esc(t("panel.call_finished"));
          $("cancelCall").disabled = true; scheduleReset(currentCall, 3500);
        } else if (match.calling)
          $("callStatus").innerHTML = esc(t("panel.resident_notified"));
        else if (currentCall.observed) scheduleReset(currentCall, 1200);
      } else if (merged.reason === "call_id") {
        // Keep the stale cancel action disabled until the next call is rendered.
        currentCall.cancelPending = true;
        $("cancelCall").disabled = true;
        $("callStatus").innerHTML = esc(t("panel.new_call_detected"));
        scheduleReset(currentCall, 800);
      }
    }
    DoorbellPanelRuntime.applySemanticUi(state, { page: "door" });
  }
  function poll() {
    fetchState(function (st, j) {
      if (st === 200 && j) {
        failCount = 0;
        $("offlineBand").style.display = "none";
        render(j);
        if (!currentCall) setDoorButtonsDisabled(false);
      } else {
        failCount++;
        if (failCount >= OFFLINE_AFTER) {
          $("offlineBand").style.display = "block";
          if (currentCall && !currentCall.preflight) $("callingMsg").innerHTML = esc(t("visitor.restoring"));
          else if (!currentCall) setDoorButtonsDisabled(true);
        }
      }
      setTimeout(poll, POLL_MS);
    });
  }
  $("visitorLanguage").onchange = function () {
    QUERY_LANG = normalizeLang(this.value) || LANG;
    loadLanguage(QUERY_LANG, function () { applyI18n(); if (lastState) render(lastState); });
  };
  loadLanguage(QUERY_LANG || "ja", function () {
    applyI18n();
    installEmergency();
    if (MOCK) { poll(); return; }
    DoorbellPanelRuntime.establishSession(function (result) {
      TOKEN = result.credential || "";
      if (result.ok) poll();
      else $("offlineBand").style.display = "block";
    });
  });
})();
</script>
