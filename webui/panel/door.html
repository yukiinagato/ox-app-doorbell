<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="color-scheme" content="light dark">
<meta http-equiv="refresh" content="300">
<title></title>
<link rel="stylesheet" href="/panel/panel.css">
</head>
<body class="doorPage">
<div id="layout">
  <div id="offlineBand" class="band" data-semantic-id="status.offline" role="status" style="display:none"></div>
  <header class="visitorHeading">
    <h1 id="title"></h1>
    <div id="visitorLanguage" class="langSwitch" role="group">
      <button type="button" data-lang="ja" lang="ja" aria-pressed="false"></button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false"></button>
      <button type="button" data-lang="zh" lang="zh" aria-pressed="false"></button>
    </div>
  </header>
  <div id="replyBanner" role="button" tabindex="0" style="display:none">
    <div id="replyBox"><div class="txt" id="replyText"></div></div>
    <div id="replyFoot"><span id="replyHint"></span><span id="replyCount"></span></div>
    <div class="txt" id="replyMeasure" aria-hidden="true"></div>
  </div>
  <main id="main">
    <div id="hint"></div>
    <div id="flowView" data-semantic-id="flow.text" style="display:none">
      <h2 id="flowTitle" tabindex="-1"></h2>
      <div id="flowImgAbove" class="flowImgs"></div>
      <div id="flowBody"></div>
      <div id="flowImgBelow" class="flowImgs"></div>
      <div id="flowNotice" role="status"></div>
    </div>
    <div id="doorList"></div>
    <div id="callingView" style="display:none">
      <div class="door" id="callingDoor"></div>
      <div class="big" id="callingMsg" data-semantic-id="ring.title" role="status"></div>
      <div id="callStatus" role="status"></div>
      <div id="purposeStep" style="display:none"><div id="purposeGrid"></div></div>
    </div>
    <div id="note"></div>
  </main>
  <div id="flowOptions" style="display:none"></div>
  <div id="visitorActions" class="idle">
    <button id="flowBack" class="flowNav" data-semantic-id="flow.back" type="button"></button>
    <button id="flowDone" class="flowNav" data-semantic-id="flow.done" type="button"></button>
    <button id="cancelCall" data-semantic-id="cancel.call" type="button"></button>
  </div>
</div>

<script src="/panel/runtime.js"></script>
<script src="/panel/panel-common.js"></script>
<script src="/panel/call-flow.js"></script>
<script src="/panel/visitor-flow.js"></script>
<script>
(function () {
  "use strict";
  var POLL_MS = 2000;
  var OFFLINE_AFTER = 5;

  var C = DoorbellPanelCommon, R = DoorbellPanelRuntime;
  function $(id) { return document.getElementById(id); }
  var esc = C.esc, qs = C.qs, normalizeLang = C.normalizeLang;

  var TOKEN = qs("k");
  var LANG = "";
  var catalog = C.createCatalog(R.panelRequest, function (lang) { LANG = lang; });
  var QUERY_LANG = normalizeLang(qs("lang"));
  var emergencyOverlay = null;

  function t(key, values) { return catalog.t(key, values); }
  function loadLanguage(requested, cb) { catalog.load(requested, cb); }
  function languageForState(state, doorId) {
    if (QUERY_LANG) return QUERY_LANG;
    var doors = (state && state.doors) || [], i, lang;
    for (i = 0; doorId && i < doors.length; i++) if (doors[i].id === doorId) {
      lang = normalizeLang(doors[i].visitor_lang);
      if (lang) return lang;
    }
    for (i = 0; i < doors.length; i++) if (doors[i].calling) {
      lang = normalizeLang(doors[i].visitor_lang);
      if (lang) return lang;
    }
    for (i = 0; i < doors.length; i++) {
      lang = normalizeLang(doors[i].visitor_lang);
      if (lang) return lang;
    }
    return "ja";
  }
  function applyEmergencyI18n() { C.applyEmergencyText(emergencyOverlay, t); }
  function installEmergency() {
    emergencyOverlay = DoorbellPanelRuntime.installEmergencyOverlay({
      translate: t,
      title: t("emergency.title"),
      detail: t("emergency.active_detail"),
      clearInstruction: t("emergency.clear_instruction"),
      triggerLabel: t("emergency.button"),
      triggerIcon: C.icon("alert-triangle")
    });
    // SOS sits at the leading edge of the fixed action zone and never floats over content.
    var actions = document.getElementById && document.getElementById("visitorActions");
    if (actions && emergencyOverlay.trigger()) actions.insertBefore(emergencyOverlay.trigger(), actions.firstChild);
    applyEmergencyI18n();
  }
  function applyI18n() {
    document.title = t("panel.title");
    $("title").innerHTML = esc(t("panel.title"));
    $("hint").innerHTML = esc(t("panel.press_hint"));
    var languageNames = { ja: t("language.name_ja"), en: t("language.name_en"), zh: t("language.name_zh") };
    var languageButtons = $("visitorLanguage").getElementsByTagName("button");
    for (var i = 0; i < languageButtons.length; i++) {
      var code = languageButtons[i].getAttribute("data-lang");
      C.setText(languageButtons[i], languageNames[code]);
      languageButtons[i].setAttribute("aria-pressed", code === LANG ? "true" : "false");
    }
    $("visitorLanguage").setAttribute("aria-label", t("idle.language"));
    $("note").innerHTML = esc(t("panel.no_audio_note"));
    $("offlineBand").innerHTML = esc(t("panel.offline"));
    C.setText($("flowBack"), t("flow.back"));
    C.setText($("flowDone"), t("flow.done"));
    flowKey = "";
    $("replyBanner").setAttribute("aria-label", t("ui.close"));
    if (!currentCall) {
      $("callingMsg").innerHTML = esc(t("panel.calling"));
      $("cancelCall").innerHTML = esc(t("calling.cancel"));
    }
    lastDoorsJson = "";
    applyEmergencyI18n();
  }

  function fetchState(cb) { R.panelRequest("GET", R.panelStateUrl(), null, cb); }
  function sendPress(doorId, purpose, cb) {
    R.panelRequest("POST", "/api/panel/press", DoorbellCallFlow.pressForm(doorId, TOKEN, purpose), cb);
  }
  function sendPurpose(doorId, callId, purpose, cb) {
    R.panelRequest("POST", "/api/panel/purpose",
      DoorbellCallFlow.purposeForm(doorId, callId, purpose, TOKEN), cb);
  }
  function sendCancel(doorId, callId, cb) {
    if (!callId) { cb(409, { ok: false, err: "call_id unavailable" }); return; }
    R.panelRequest("POST", "/api/panel/cancel", DoorbellCallFlow.cancelForm(doorId, callId, TOKEN), cb);
  }
  function sendHangup(doorId, callId, cb) {
    if (!callId) { cb(409, { ok: false, err: "call_id unavailable" }); return; }
    R.panelRequest("POST", "/api/panel/hangup", DoorbellCallFlow.cancelForm(doorId, callId, TOKEN), cb);
  }
  // Only the visitor's explicit choice in the language selector is replicated, so indoor panels
  // and quick replies use it. A ?lang= default configured on the kiosk is not a visitor choice.
  var reportedVisitorLang = "", visitorChoseLang = false;
  function reportVisitorLang(doorId) {
    if (!visitorChoseLang || !QUERY_LANG) return;
    var key = (doorId || "") + "|" + QUERY_LANG;
    if (reportedVisitorLang === key) return;
    reportedVisitorLang = key;
    R.panelRequest("POST", "/api/panel/visitor-lang",
      "door=" + encodeURIComponent(doorId || "") + "&lang=" + encodeURIComponent(QUERY_LANG),
      function (status) { if (status < 200 || status >= 300) reportedVisitorLang = ""; });
  }
  function visitorLangDoor() {
    if (currentCall) return currentCall.door;
    var doors = (lastState && lastState.doors) || [];
    return doors.length === 1 ? doors[0].id : "";
  }


  var lastDoorsJson = "";
  function renderDoors(doors) {
    var jsonNow = "";
    for (var i = 0; i < doors.length; i++) jsonNow += doors[i].id + "|" + doors[i].label + ";";
    if (jsonNow === lastDoorsJson) return;
    lastDoorsJson = jsonNow;
    var list = $("doorList");
    while (list.firstChild) list.removeChild(list.firstChild);
    var half = doors.length > 4;
    list.className = half ? "many" : "";
    for (var k = 0; k < doors.length; k++) {
      var b = document.createElement("button");
      b.className = "doorBtn" + (half ? " half" : "");
      b.type = "button";
      b.setAttribute("data-door", doors[k].id);
      b.setAttribute("data-label", doors[k].label);
      b.setAttribute("data-semantic-id", "call.primary");
      var verb = document.createElement("span"), name = document.createElement("span");
      C.setText(verb, t("idle.call_button_verb"));
      name.className = "doorName";
      C.setText(name, doors[k].label);
      b.appendChild(verb); b.appendChild(name);
      b.onclick = onPress;
      list.appendChild(b);
    }
    // One door: its Call button is the primary action in the fixed bottom zone. Several doors:
    // they are listed in the content area and the zone keeps only Cancel and SOS.
    var zone = $("visitorActions"), main = $("main");
    if (doors.length === 1) {
      if (list.parentNode !== zone) zone.insertBefore(list, $("cancelCall"));
    } else if (list.parentNode !== main) main.insertBefore(list, $("callingView"));
  }

  // purpose_first selects before ringing; ring_then_purpose selects after call_id creation.
  var callingTimer = null, deadlineTimer = null;
  var currentCall = null, lastCallFlow = "purpose_first", lastPurposes = [];
  var recoveryPendingCall = "", recoveryReportedCall = "", lastState = null, purposeMarkup = "";

  function reportRecovery(door, callId, state) {
    if (!callId || recoveryPendingCall === callId || recoveryReportedCall === callId) return;
    recoveryPendingCall = callId;
    // A pending visitor call is recoverable once this page has rebuilt its waiting UI. An
    // established SIP dialog is owned by the answering client and cannot be restored here.
    var restored = state === "ringing" || state === "purpose_pending";
    R.panelRequest("POST", "/api/panel/recovery",
      DoorbellCallFlow.recoveryForm(door, callId, restored, TOKEN), function (st) {
        recoveryPendingCall = "";
        if (st >= 200 && st < 300) recoveryReportedCall = callId;
      });
  }
  function setDoorButtonsDisabled(disabled) {
    var bs = $("doorList").getElementsByTagName("button");
    for (var i = 0; i < bs.length; i++) bs[i].disabled = !!disabled;
  }
  function labelIn(value) {
    if (!value || typeof value !== "object") return value || "";
    return value[LANG] || value.ja || value.en || value.zh || "";
  }
  // Purpose ids and labels are configuration data: they are only ever assigned as text or
  // attribute values through DOM APIs, never concatenated into markup.
  function purposeButtons(afterRing) {
    var step = $("purposeStep"), box = $("purposeGrid"), items = [], i;
    for (i = 0; i < lastPurposes.length; i++) {
      var p = lastPurposes[i] || {}, label = labelIn(p.label) || p.id;
      items.push({ id: String(p.id || ""), icon: String(p.icon || ""), text: label });
    }
    items.push({ id: "", icon: "", text: t("purpose.skip"), skip: true });
    step.style.display = "block";
    var signature = String(afterRing) + ":" + JSON.stringify(items);
    if (purposeMarkup === signature) return;
    purposeMarkup = signature;
    while (box.firstChild) box.removeChild(box.firstChild);
    for (i = 0; i < items.length; i++) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "purposeBtn" + (items[i].skip ? " skip" : "");
      b.setAttribute("data-semantic-id", "purpose.button");
      b.setAttribute("data-purpose", items[i].id);
      if (items[i].icon) {
        var icon = document.createElement("span");
        icon.className = "pIcon";
        icon.setAttribute("aria-hidden", "true");
        C.setText(icon, items[i].icon);
        b.appendChild(icon);
      }
      var text = document.createElement("span");
      text.className = "pLabel";
      C.setText(text, items[i].text);
      b.appendChild(text);
      b.onclick = (function (purpose) {
        return function () { choosePurpose(purpose, afterRing); };
      })(items[i].id);
      box.appendChild(b);
    }
  }
  function showCall(id, label, preflight) {
    currentCall = { door: id, label: label, call_id: "", observed: false,
                    preflight: !!preflight, cancelPending: false, purposeDismissed: false, terminal: false, stage_revision: 0,
                    started: new Date().getTime() };
    $("callingDoor").innerHTML = esc(label);
    $("callingMsg").innerHTML = esc(preflight ? t("idle.choose_purpose") :
      t("panel.calling"));
    $("callStatus").innerHTML = esc(preflight ? t("panel.not_sent") : t("panel.sending"));
    $("purposeStep").style.display = "none";
    $("cancelCall").disabled = !preflight;
    $("cancelCall").setAttribute("data-semantic-id", "cancel.call");
    $("cancelCall").innerHTML = esc(preflight ? t("panel.back") : t("calling.cancel"));
    $("cancelCall").className = preflight ? "back" : "";
    $("doorList").style.display = "none"; $("hint").style.display = "none";
    $("callingView").style.display = "block"; $("cancelCall").style.display = "block";
    $("visitorActions").className = ""; $("main").scrollTop = 0; setDoorButtonsDisabled(true);
    renderFlow();
  }
  function resetCall() {
    cancelCallAction();
    var endReason = (currentCall && currentCall.endReason) || "ended";
    currentCall = null;
    if (flowWalker) flowWalker.callEnded(endReason);
    if (callingTimer) { clearTimeout(callingTimer); callingTimer = null; }
    if (deadlineTimer) { clearTimeout(deadlineTimer); deadlineTimer = null; }
    $("callingView").style.display = "none"; $("purposeStep").style.display = "none";
    $("cancelCall").style.display = "none"; $("visitorActions").className = "idle";
    $("cancelCall").setAttribute("data-semantic-id", "cancel.call");
    $("doorList").style.display = ""; $("hint").style.display = "";
    setDoorButtonsDisabled(false);
    renderFlow();
  }
  function scheduleReset(c, delayMs) {
    if (callingTimer) return;
    callingTimer = setTimeout(function () {
      if (currentCall === c) resetCall();
    }, delayMs);
  }
  function armDeadlineNotice(c) {
    if (deadlineTimer) { clearTimeout(deadlineTimer); deadlineTimer = null; }
    var delay = DoorbellCallFlow.deadlineDelay(c && c.expires_at_ms, new Date().getTime());
    if (!delay) return;
    deadlineTimer = setTimeout(function () {
      deadlineTimer = null;
      if (currentCall !== c || c.inCall || c.cancelPending) return;
      $("callStatus").innerHTML = esc(t("panel.deadline_reached"));
      // Keep call_id and the cancel control until Core reports a terminal state. A lost poll must
      // never make the visitor lose control while the durable call may still be ringing.
    }, delay);
  }
  function beginPress(purpose) {
    var c = currentCall;
    if (!c) return;
    c.preflight = false; $("purposeStep").style.display = "none";
    $("callingMsg").innerHTML = esc(t("panel.calling"));
    $("callStatus").innerHTML = esc(t("panel.sending")); $("cancelCall").disabled = true;
    $("cancelCall").innerHTML = esc(t("calling.cancel"));
    $("cancelCall").className = "";
    sendPress(c.door, purpose, function (st, j) {
      if (!currentCall || currentCall !== c) return;
      if (st !== 200 || !j || j.ok !== true) {
        $("callStatus").innerHTML = esc(t("panel.press_failed", {
          reason: j && j.err ? ": " + j.err : ""
        }));
        if (flowWalker) flowWalker.pressResult(false);
        scheduleReset(c, 3500); return;
      }
      if (flowWalker) flowWalker.pressResult(true);
      c.call_id = j.call_id || "";
      c.stage_revision = Math.max(c.stage_revision, Number(j.stage_revision) || 0);
      c.expires_at_ms = Number(j.expires_at_ms) || 0;
      armDeadlineNotice(c);
      $("cancelCall").disabled = !c.call_id;
      $("callStatus").innerHTML = esc(c.call_id ? t("panel.resident_notified") :
        t("panel.resident_notified_no_cancel"));
      if (lastCallFlow === "ring_then_purpose" && lastPurposes.length) purposeButtons(true);
    });
  }
  function onPress() {
    var id = this.getAttribute("data-door");
    var label = this.getAttribute("data-label");
    if (currentCall) return;
    var purposeFirst = lastCallFlow === "purpose_first" && lastPurposes.length;
    showCall(id, label, purposeFirst);
    reportVisitorLang(id);
    if (purposeFirst) purposeButtons(false); else beginPress("");
  }

  function choosePurpose(purpose, afterRing) {
    var c = currentCall;
    if (!c || c.inCall || c.terminal || c.cancelPending) return;
    c.purposeDismissed = true; $("purposeStep").style.display = "none";
    if (!afterRing) { beginPress(purpose); return; }
    if (!purpose) { $("callStatus").innerHTML = esc(t("panel.resident_notified")); return; }
    if (!c.call_id) {
      $("callStatus").innerHTML = esc(t("panel.purpose_call_missing")); return;
    }
    $("callStatus").innerHTML = esc(t("panel.purpose_sending"));
    sendPurpose(c.door, c.call_id, purpose, function (st, j) {
      if (!currentCall || currentCall !== c) return;
      if (st === 200 && j && j.ok === true) {
        c.stage_revision = Math.max(c.stage_revision, Number(j.stage_revision) || 0);
        $("callStatus").innerHTML = esc(t("panel.purpose_delivered"));
      } else $("callStatus").innerHTML = esc(t("panel.purpose_failed", {
        reason: j && j.err ? ": " + j.err : ""
      }));
    });
  }

  var actionGesture = null, cancelledActionKey = 0, blockedKeyboardRelease = false;
  function callActionKey(event) {
    var key = event && (event.key || event.keyCode);
    if (key === "Enter" || key === 13) return 13;
    if (key === " " || key === "Spacebar" || key === 32) return 32;
    if (key === "Escape" || key === 27) return 27;
    return 0;
  }
  function callActionIntent() {
    var c = currentCall;
    return c && { call: c, call_id: c.call_id, preflight: !!c.preflight,
                  inCall: !!c.inCall, terminal: !!c.terminal };
  }
  function beginCallAction(kind, event) {
    if (event && event.repeat) return;
    if (actionGesture && (actionGesture.held ||
        (kind === "mouse" && actionGesture.kind === "touch"))) return;
    var intent = callActionIntent();
    if (!intent || $("cancelCall").disabled) return;
    intent.kind = kind; intent.key = callActionKey(event); intent.held = true; actionGesture = intent;
  }
  function cancelCallAction() {
    if (actionGesture && actionGesture.kind === "keyboard" && actionGesture.held)
      cancelledActionKey = actionGesture.key;
    actionGesture = null;
  }
  function blockCallActionKeyRelease(event) {
    if (event.preventDefault) event.preventDefault();
    blockedKeyboardRelease = true;
    setTimeout(function () { blockedKeyboardRelease = false; }, 0);
  }
  function finishCallAction(event) {
    if (event && event.type === "keyup" && cancelledActionKey && cancelledActionKey === callActionKey(event)) {
      cancelledActionKey = 0; blockCallActionKeyRelease(event);
      return;
    }
    if (!actionGesture) return;
    if (event && event.type === "keyup" && actionGesture.key !== callActionKey(event)) return;
    var target = event && event.target;
    while (target && target !== $("cancelCall")) target = target.parentNode;
    actionGesture.held = false;
    if (!target || $("cancelCall").disabled) {
      if (event && event.type === "keyup") blockCallActionKeyRelease(event);
      cancelCallAction(); return;
    }
    if (actionGesture.consumed) actionGesture = null;
  }
  var callAction = $("cancelCall");
  callAction.onmousedown = function (event) {
    if (!event || event.button === undefined || event.button === 0) beginCallAction("mouse", event);
  };
  callAction.onpointerdown = function (event) {
    if (!event || event.button === undefined || event.button === 0) beginCallAction(event && event.pointerType === "touch" ? "touch" : "pointer", event);
  };
  function bindCallTouch(name, handler) {
    if (callAction.addEventListener) callAction.addEventListener(name, handler, false);
    else callAction["on" + name] = handler;
  }
  bindCallTouch("touchstart", function (event) { beginCallAction("touch", event); });
  callAction.onkeydown = function (event) {
    var key = callActionKey(event);
    if (key === 13 || key === 32) beginCallAction("keyboard", event);
    else if (key === 27) cancelCallAction();
  };
  bindCallTouch("touchmove", function (event) {
    var touch = event.touches && event.touches[0];
    if (!touch) return;
    var bounds = callAction.getBoundingClientRect();
    if (touch.clientX < bounds.left || touch.clientX > bounds.right ||
        touch.clientY < bounds.top || touch.clientY > bounds.bottom) cancelCallAction();
  });
  callAction.onkeyup = finishCallAction;
  callAction.onmouseup = callAction.onpointerup = finishCallAction;
  bindCallTouch("touchend", finishCallAction);
  bindCallTouch("touchcancel", cancelCallAction);
  callAction.onmouseleave = callAction.onpointerleave = callAction.onpointercancel =
    callAction.onblur = cancelCallAction;
  if (document.addEventListener) {
    document.addEventListener("mouseup", finishCallAction, false);
    document.addEventListener("pointerup", finishCallAction, false);
    document.addEventListener("touchend", finishCallAction, false);
    document.addEventListener("keyup", finishCallAction, false);
  }
  callAction.onclick = function (event) {
    if ((!event || !event.detail) && (cancelledActionKey || blockedKeyboardRelease)) return;
    var intent = actionGesture, c = currentCall, consumed = intent && intent.consumed;
    if (intent && intent.held && intent.kind === "keyboard") intent.consumed = true;
    else actionGesture = null;
    // A physical gesture retains its original call and verb across polling updates.
    // Zero-detail activation without a held gesture is the assistive-technology path.
    if (!intent && (!event || !event.detail)) intent = callActionIntent();
    if (!intent || consumed || !c || c !== intent.call ||
        c.call_id !== intent.call_id || !!c.preflight !== intent.preflight ||
        !!c.inCall !== intent.inCall || !!c.terminal !== intent.terminal ||
        c.terminal || c.cancelPending) return;
    if (intent.preflight) { resetCall(); return; }
    if (!intent.call_id) {
      $("callStatus").innerHTML = esc(t("panel.cancel_missing_id")); return;
    }
    c.cancelPending = true; $("cancelCall").disabled = true;
    var ending = intent.inCall;
    $("callStatus").innerHTML = esc(ending ? t("panel.call_ending") :
      t("panel.cancel_sending"));
    (ending ? sendHangup : sendCancel)(c.door, c.call_id, function (st, j) {
      if (!currentCall || currentCall !== c) return;
      if (st === 200 && j && j.ok === true) {
        $("callStatus").innerHTML = esc(ending ? t("panel.call_end_accepted") :
          t("panel.cancel_accepted"));
      } else {
        c.cancelPending = false; $("cancelCall").disabled = false;
        $("callStatus").innerHTML = esc((st === 404 || st === 501) ?
          (ending ? t("panel.call_end_unavailable") : t("panel.cancel_unavailable")) :
          t(ending ? "panel.call_end_failed" : "panel.cancel_failed", {
            reason: j && j.err ? ": " + j.err : ""
          }));
      }
    });
  };


  var lastReplyTs = -1;
  var REPLY_FLOOR = 28;
  var replyTimer = null, replyGuard = null, replyShownAt = 0, replyTtlMs = 30000;
  function nowMs() { return new Date().getTime(); }
  function showingReply() { return $("replyBanner").style.display !== "none"; }
  function fitReply() {
    if (!showingReply()) return;
    var box = $("replyBox"), txt = $("replyText"), meas = $("replyMeasure");
    var w = box.clientWidth, h = box.clientHeight;
    if (w <= 0 || h <= 0) return;
    meas.innerHTML = txt.innerHTML;
    meas.style.width = w + "px";
    var r = DoorbellPanelCommon.fitFontSize(w, h, function (size) {
      meas.style.fontSize = size + "px";
      return { width: meas.scrollWidth, height: meas.offsetHeight };
    }, REPLY_FLOOR, h);
    txt.style.fontSize = r.size + "px";
    box.className = r.fits ? "" : "overflowing";
  }
  function replyTick() {
    if (!showingReply()) return;
    var now = nowMs(), left = replyTtlMs - (now - replyShownAt);
    if (left <= 0) { hideReply(); return; }
    $("replyCount").innerHTML = String(Math.ceil(left / 1000));
    var hint = replyGuard.hint(now), el = $("replyHint");
    el.innerHTML = hint === "none" ? "" : esc(t(hint === "confirm" ? "reply.exit_confirm" : "reply.exit_hint"));
    el.className = hint === "confirm" ? "confirm" : "";
  }
  function hideReply() {
    if (replyTimer) { clearInterval(replyTimer); replyTimer = null; }
    $("replyBanner").style.display = "none";
    document.body.className = document.body.className.replace(/ ?replyActive/, "");
  }
  function replyTap() {
    if (!showingReply()) return;
    var action = replyGuard.tap(nowMs());
    if (action === "close") hideReply(); else replyTick();
  }
  $("replyBanner").onclick = replyTap;
  $("replyBanner").onkeydown = function (e) {
    var key = e.keyCode;
    if (key === 13 || key === 32) { replyTap(); if (e.preventDefault) e.preventDefault(); }
  };
  window.addEventListener("resize", fitReply, false);
  window.addEventListener("orientationchange", fitReply, false);
  function renderReply(reply) {
    if (lastReplyTs === -1) { lastReplyTs = (reply && reply.ts) || 0; return; }
    if (!reply || !reply.ts || reply.ts <= lastReplyTs) return;
    lastReplyTs = reply.ts;
    var ttl = Number(reply.ttl_s);
    replyTtlMs = (ttl > 0 ? ttl : 30) * 1000;
    replyShownAt = nowMs();
    replyGuard = DoorbellPanelCommon.createReplyGuard(replyShownAt);
    $("replyText").innerHTML = esc(reply.text);
    $("replyBanner").style.display = "block";
    if (document.body.className.indexOf("replyActive") < 0) document.body.className += " replyActive";
    fitReply();
    replyTick();
    if (replyTimer) clearInterval(replyTimer);
    replyTimer = setInterval(replyTick, 250);
  }


  // ---- Visitor flow (docs/en/visitor-flow-contract.md). The start page is the idle screen; the
  // classic Call and purpose buttons remain only when Core publishes no flow. ----
  var VF = window.DoorbellVisitorFlow;
  var flowWalker = null, flowRevision = "", flowBrokenRevision = "", flowKey = "", flowBusy = false;
  var idleTimer = null, endTimer = null, flowPageSeen = "";

  function flowClear() {
    if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
    if (endTimer) { clearTimeout(endTimer); endTimer = null; }
  }
  function flowDrop() {
    flowWalker = null; flowRevision = ""; flowKey = ""; flowClear();
  }
  // Core's document for this door replaces the walker's (keeping the visitor's place when the
  // contract allows). Several doors on one panel, no flow, or any failure: the classic screen.
  function syncFlow(state) {
    var doc = state && state.visitor_flow, doors = (state && state.doors) || [];
    if (!VF || !doc || doc.enabled !== true || doors.length !== 1 ||
        (flowBrokenRevision && flowBrokenRevision === doc.revision)) { flowDrop(); return; }
    try {
      if (!flowWalker) flowWalker = VF.create(doc, LANG);
      else if (doc.revision !== flowRevision) flowWalker.replace(doc);
      if (flowWalker.snapshot().mode === "legacy") { flowDrop(); return; }
      flowRevision = doc.revision;
    } catch (e) { flowBrokenRevision = doc.revision; flowDrop(); }
  }
  function armIdle() {
    if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
    if (!flowWalker || flowWalker.mode !== "page") return;
    idleTimer = setTimeout(function () {
      idleTimer = null;
      if (!flowWalker || currentCall) return;
      flowWalker.idleTimeout(); flowKey = ""; renderFlow();
    }, flowWalker.idleSeconds() * 1000);
  }
  function armEnd() {
    if (endTimer) { clearTimeout(endTimer); endTimer = null; }
    if (!flowWalker || flowWalker.mode !== "end") return;
    endTimer = setTimeout(function () {
      endTimer = null;
      if (flowWalker) { flowWalker.done(); flowKey = ""; renderFlow(); }
    }, flowWalker.returnSeconds() * 1000);
  }
  function flowImageLimit() {
    var h = window.innerHeight || document.documentElement.clientHeight || 600;
    return Math.floor(h * 0.4);
  }
  function fillImages(box, images, place) {
    while (box.firstChild) box.removeChild(box.firstChild);
    var any = false, limit = flowImageLimit();
    for (var i = 0; i < images.length; i++) {
      var im = images[i] || {};
      if ((im.place === "below" ? "below" : "above") !== place || typeof im.url !== "string" ||
          im.url.indexOf("/asset/") !== 0) continue;
      var alt = VF.textIn(im.alt, LANG) || "";
      var wrap = document.createElement("div"), img = document.createElement("img");
      wrap.className = "flowImg";
      img.alt = alt; img.setAttribute("src", im.url);
      img.style.maxHeight = limit + "px";
      img.onerror = (function (w, text) {
        return function () {
          while (w.firstChild) w.removeChild(w.firstChild);
          var cap = document.createElement("div"); cap.className = "flowAlt"; C.setText(cap, text);
          w.appendChild(cap);
        };
      })(wrap, alt);
      wrap.appendChild(img); box.appendChild(wrap); any = true;
    }
    box.style.display = any ? "" : "none";
  }
  function fillBody(box, text) {
    while (box.firstChild) box.removeChild(box.firstChild);
    var paras = VF.paragraphs(text), i, j;
    for (i = 0; i < paras.length; i++) {
      var p = document.createElement("p");
      for (j = 0; j < paras[i].length; j++) {
        if (j) p.appendChild(document.createElement("br"));
        p.appendChild(document.createTextNode(paras[i][j]));
      }
      box.appendChild(p);
    }
    box.style.display = paras.length ? "" : "none";
  }
  function fitFlow() {
    var zone = $("flowOptions");
    zone.style.maxHeight = Math.floor((window.innerHeight || 600) * 0.5) + "px";
    zone.className = zone.scrollHeight > zone.clientHeight + 1 ? "scrollable" : "";
    var imgs = $("flowView").getElementsByTagName("img"), limit = flowImageLimit();
    for (var i = 0; i < imgs.length; i++) imgs[i].style.maxHeight = limit + "px";
  }
  function setFlowOptionsDisabled(disabled) {
    var bs = $("flowOptions").getElementsByTagName("button");
    for (var i = 0; i < bs.length; i++) bs[i].disabled = !!disabled;
  }
  function optionButton(option) {
    var primary = option.semantic_id === "call.primary";
    var b = document.createElement("button");
    b.type = "button";
    b.className = (primary ? "doorBtn" : "purposeBtn") + " flowOpt";
    b.setAttribute("data-semantic-id", primary ? "call.primary" : "purpose.button");
    b.setAttribute("data-option", String(option.id || ""));
    if (typeof option.icon === "string" && option.icon) {
      var icon = document.createElement("span");
      icon.className = "pIcon"; icon.setAttribute("aria-hidden", "true");
      C.setText(icon, option.icon); b.appendChild(icon);
    }
    var label = document.createElement("span");
    label.className = "pLabel"; C.setText(label, VF.textIn(option.label, LANG) || "");
    b.appendChild(label);
    b.onclick = function () { onFlowOption(String(option.id || "")); };
    return b;
  }
  function renderFlow() {
    var on = !!flowWalker, shown = on && !currentCall && !!lastState;
    var cls = document.body.className.replace(/ ?flowOn/, "");
    if (on) cls += " flowOn";
    if (cls !== document.body.className) document.body.className = cls;
    var mode = shown ? flowWalker.mode : "";
    if (mode !== "page" && mode !== "end") {
      $("flowView").style.display = "none"; $("flowOptions").style.display = "none";
      $("flowBack").style.display = "none"; $("flowDone").style.display = "none";
      if (!shown) { flowKey = ""; flowClear(); }
      return;
    }
    try {
      flowWalker.setLang(LANG);
      var snap = flowWalker.snapshot(), step = flowWalker.step(snap.page);
      var key = [LANG, snap.mode, snap.page, flowRevision, snap.notice || "", snap.back ? 1 : 0].join("|");
      if (key !== flowKey) {
        flowKey = key;
        var changedPage = flowPageSeen !== snap.page;
        flowPageSeen = snap.page;
        C.setText($("flowTitle"), VF.textIn(step.title, LANG) || "");
        $("flowTitle").style.display = $("flowTitle").firstChild ? "" : "none";
        var images = step.images instanceof Array ? step.images : [];
        fillImages($("flowImgAbove"), images, "above");
        fillBody($("flowBody"), VF.textIn(step.body, LANG));
        fillImages($("flowImgBelow"), images, "below");
        C.setText($("flowNotice"), snap.notice ? t(snap.notice) : "");
        var zone = $("flowOptions");
        while (zone.firstChild) zone.removeChild(zone.firstChild);
        var options = flowWalker.options(), i;
        for (i = 0; i < options.length; i++) zone.appendChild(optionButton(options[i]));
        $("main").scrollTop = 0;
        if (changedPage && $("flowTitle").focus && $("flowTitle").firstChild) {
          try { $("flowTitle").focus(); } catch (e0) {}
        }
        if (snap.mode === "page") armIdle(); else armEnd();
      }
      $("flowView").style.display = "block";
      $("flowOptions").style.display = snap.mode === "page" ? "" : "none";
      $("flowBack").style.display = snap.back ? "block" : "none";
      $("flowDone").style.display = snap.done ? "block" : "none";
      $("visitorActions").className = "";
      fitFlow();
      DoorbellPanelRuntime.applySemanticUi(lastState, { page: "door" });
    } catch (e) {
      // A visitor is never stranded: any failure here leaves the classic call screen.
      flowBrokenRevision = flowRevision; flowDrop();
      $("flowView").style.display = "none"; $("flowOptions").style.display = "none";
      $("flowBack").style.display = "none"; $("flowDone").style.display = "none";
      document.body.className = document.body.className.replace(/ ?flowOn/, "");
    }
  }
  function flowPress(purpose) {
    var door = lastState && lastState.doors && lastState.doors[0];
    if (!door || currentCall) return;
    showCall(door.id, door.label, false);
    reportVisitorLang(door.id);
    beginPress(purpose);
  }
  function flowAct(act) {
    if (act.act === "page" || act.act === "end") { flowKey = ""; renderFlow(); return; }
    if (act.act === "press") { flowPress(act.purpose); return; }
    if (act.act !== "notify") return;
    flowBusy = true; setFlowOptionsDisabled(true);
    var doorId = lastState && lastState.doors && lastState.doors[0] && lastState.doors[0].id;
    R.panelRequest("POST", "/api/panel/visitor-notify", DoorbellCallFlow.notifyForm(doorId, act.step),
      function (st, j) {
        flowBusy = false; setFlowOptionsDisabled(false);
        if (!flowWalker || currentCall) return;
        // A throttled result is shown as sent; a failure rings instead.
        flowAct(flowWalker.notifyResult(st >= 200 && st < 300 && !!j && j.ok === true, act.step));
      });
  }
  function onFlowOption(id) {
    if (!flowWalker || flowBusy || currentCall) return;
    try { flowAct(flowWalker.tap(id)); }
    catch (e) { flowBusy = false; flowBrokenRevision = flowRevision; flowDrop(); renderFlow(); }
  }
  $("flowBack").onclick = function () {
    if (flowWalker) { flowWalker.back(); flowKey = ""; renderFlow(); }
  };
  $("flowDone").onclick = function () {
    if (flowWalker) { flowWalker.done(); flowKey = ""; renderFlow(); }
  };
  (function () {
    function touched() { if (flowWalker && flowWalker.mode === "page") armIdle(); }
    var names = ["touchstart", "mousedown", "keydown", "scroll"], i;
    if (document.addEventListener)
      for (i = 0; i < names.length; i++) document.addEventListener(names[i], touched, true);
    window.addEventListener("resize", fitFlow, false);
    window.addEventListener("orientationchange", fitFlow, false);
  })();

  var failCount = 0;
  function render(state) {
    lastState = state;
    var desiredLang = languageForState(state, currentCall && currentCall.door);
    if (desiredLang !== LANG) {
      loadLanguage(desiredLang, function () { applyI18n(); render(state); });
      return;
    }
    emergencyOverlay.update(state);
    lastCallFlow = DoorbellCallFlow.flowMode(state.call_flow);
    lastPurposes = state.purposes || [];
    renderDoors(state.doors || []);
    syncFlow(state);
    renderReply(state.reply);
    if (showingReply()) {
      var rd = state.doors || [], k;
      if (state.emergency && state.emergency.active) hideReply();
      for (k = 0; k < rd.length; k++)
        if (rd[k].call_state === "answered" || rd[k].call_state === "in_call") hideReply();
    }
    var match = null, i;
    if (currentCall) {
      for (i = 0; i < (state.doors || []).length; i++)
        if (state.doors[i].id === currentCall.door) { match = state.doors[i]; break; }
    } else {
      for (i = 0; i < (state.doors || []).length; i++) if (state.doors[i].calling) {
        match = state.doors[i]; showCall(match.id, match.label, false);
        if (flowWalker) flowWalker.adoptCall();
        break;
      }
    }
    if (currentCall && currentCall.preflight) {
      $("callingMsg").innerHTML = esc(t("idle.choose_purpose"));
      $("cancelCall").innerHTML = esc(t("panel.back"));
      $("callStatus").innerHTML = esc(t("panel.not_sent"));
      purposeButtons(false);
    }
    if (currentCall && match && !currentCall.preflight) {
      var merged = DoorbellCallFlow.mergeState(currentCall, match);
      if (merged.accepted) {
        currentCall.stage_revision = merged.stage_revision;
        currentCall.call_id = merged.call_id;
        if (merged.expires_at_ms && merged.expires_at_ms !== currentCall.expires_at_ms) {
          currentCall.expires_at_ms = merged.expires_at_ms;
          armDeadlineNotice(currentCall);
        }
        currentCall.observed = currentCall.observed || !!match.calling;
        currentCall.inCall = match.call_state === "answered" || match.call_state === "in_call";
        currentCall.terminal = match.call_state === "cancelled" || match.call_state === "expired" || match.call_state === "ended";
        if (currentCall.terminal) $("purposeStep").style.display = "none";
        if (currentCall.inCall && deadlineTimer) {
          clearTimeout(deadlineTimer); deadlineTimer = null;
        }
        $("cancelCall").setAttribute("data-semantic-id", currentCall.inCall ?
          "call.end" : "cancel.call");
        $("cancelCall").disabled = currentCall.cancelPending || !currentCall.call_id;
        $("cancelCall").innerHTML = esc(currentCall.inCall ? t("incall.end") :
          t("calling.cancel"));
        if (match.recovery_required)
          reportRecovery(match.id, currentCall.call_id, match.call_state);
        $("callingMsg").innerHTML = esc(t(match.recovery_required ? "visitor.restoring" :
          currentCall.inCall ? "incall.title" : match.call_state === "expired" ? "calling.no_answer" :
          match.call_state === "ended" || match.call_state === "cancelled" ? "panel.call_finished" : "panel.calling"));
        if (currentCall.inCall) {
          $("purposeStep").style.display = "none";
          $("callStatus").innerHTML = esc(t("panel.resident_answered"));
        } else if (match.call_state === "purpose_pending" && lastCallFlow === "ring_then_purpose") {
          if (!currentCall.purposeDismissed) purposeButtons(true);
        }
        else if (match.call_state === "cancelled") {
          $("callStatus").innerHTML = esc(t("panel.call_cancelled"));
          currentCall.endReason = "cancelled";
          $("cancelCall").disabled = true; scheduleReset(currentCall, 3500);
        } else if (match.call_state === "expired" || match.call_state === "ended") {
          $("callStatus").innerHTML = esc(t("panel.call_finished"));
          currentCall.endReason = match.call_state === "expired" ? "timeout" : "ended";
          $("cancelCall").disabled = true; scheduleReset(currentCall, 3500);
        } else if (match.calling)
          $("callStatus").innerHTML = esc(t("panel.resident_notified"));
        else if (currentCall.observed) scheduleReset(currentCall, 1200);
      } else if (merged.reason === "call_id") {
        // Keep the stale cancel action disabled until the next call is rendered.
        currentCall.cancelPending = true;
        $("cancelCall").disabled = true;
        $("callStatus").innerHTML = esc(t("panel.new_call_detected"));
        scheduleReset(currentCall, 800);
      }
    }
    if (state.display) C.applyAppearance(state.display);
    if (state.display && state.display.theme) C.applyHomeTheme(state.display.theme);
    var pending = currentCall && !currentCall.preflight && !currentCall.inCall && !currentCall.terminal;
    $("callingView").className = pending ? "pending" : "";
    renderFlow();
    DoorbellPanelRuntime.applySemanticUi(state, { page: "door" });
  }
  function poll() {
    fetchState(function (st, j) {
      if (st === 200 && j) {
        failCount = 0;
        $("offlineBand").style.display = "none";
        render(j);
        if (!currentCall) setDoorButtonsDisabled(false);
      } else {
        failCount++;
        if (failCount >= OFFLINE_AFTER) {
          $("offlineBand").style.display = "block";
          if (currentCall && !currentCall.preflight) $("callingMsg").innerHTML = esc(t("visitor.restoring"));
          else if (!currentCall) setDoorButtonsDisabled(true);
        }
      }
      setTimeout(poll, POLL_MS);
    });
  }
  function chooseLanguage() {
    QUERY_LANG = normalizeLang(this.getAttribute("data-lang")) || LANG;
    visitorChoseLang = true;
    reportVisitorLang(visitorLangDoor());
    loadLanguage(QUERY_LANG, function () { applyI18n(); if (lastState) render(lastState); });
  }
  (function () {
    var buttons = $("visitorLanguage").getElementsByTagName("button");
    for (var i = 0; i < buttons.length; i++) buttons[i].onclick = chooseLanguage;
  })();
  loadLanguage(QUERY_LANG || "ja", function () {
    applyI18n();
    installEmergency();
    DoorbellPanelRuntime.establishSession(function (result) {
      TOKEN = result.credential || "";
      if (result.ok) poll();
      else $("offlineBand").style.display = "block";
    });
  });
})();
</script>
