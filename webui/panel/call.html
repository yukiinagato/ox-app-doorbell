<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #101418; color: #e8edf2; display: flex; flex-direction: column;
         font-family: "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 12px 16px 4px; }
  h1 { font-size: 24px; color: #8a97a5; font-weight: normal; }
  #regState { font-size: 14px; color: #5d6b79; }
  #offlineBand { display: none; background: #ff6b6b; color: #2a0505; text-align: center;
                 font-size: 22px; font-weight: bold; padding: 10px; }
  #doorTabs { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 16px; }
  #doorTabs button { font-size: 20px; padding: 10px 22px; border-radius: 10px;
                     border: 1px solid #2a333d; background: #1a2027; color: #e8edf2;
                     cursor: pointer; }
  #doorTabs button.sel { background: #274261; border-color: #4da3ff; }
  #doorTabs button .st { font-size: 13px; color: #8a97a5; display: block; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center;
         padding: 8px 16px 16px; min-height: 0; }
  #videoBox { position: relative; width: 100%; max-width: 960px; flex: 1; min-height: 240px;
              background: #000; border-radius: 12px; overflow: hidden;
              display: flex; align-items: center; justify-content: center; }
  #liveImg, #liveVideo { width: 100%; height: 100%; object-fit: contain; }
  #liveVideo { display: none; }
  #noVideo { position: absolute; color: #5d6b79; font-size: 20px; }
  #selfPreview { position: absolute; right: 10px; bottom: 10px; width: 160px;
                 border-radius: 8px; border: 1px solid #2a333d; display: none; }
  #controls { display: flex; align-items: center; gap: 18px; padding: 14px 0 4px;
              flex-wrap: wrap; justify-content: center; }
  #callBtn { font-size: 26px; font-weight: bold; padding: 14px 56px; border-radius: 14px;
             border: 0; background: #1e8e4e; color: #fff; cursor: pointer; }
  #callBtn.hang { background: #c0392b; }
  #callBtn:disabled { background: #2a333d; color: #5d6b79; cursor: default; }
  #videoToggle { font-size: 18px; color: #aab6c2; display: flex; align-items: center;
                 gap: 8px; cursor: pointer; }
  #status { font-size: 18px; color: #8a97a5; min-height: 24px; padding-bottom: 10px;
            text-align: center; }
  #status.err { color: #ff8f85; }
  #status a { color: #4da3ff; }
</style>
</head>
<body>
<div id="offlineBand" data-semantic-id="status.offline"></div>
<header><h1 id="title" data-semantic-id="ring.title"></h1><span id="regState"></span></header>
<div id="doorTabs"></div>
<main>
  <div id="videoBox">
    <img id="liveImg" alt="">
    <video id="liveVideo" muted autoplay playsinline></video>
    <div id="noVideo"></div>
    <video id="selfPreview" muted autoplay playsinline></video>
  </div>
  <div id="controls">
    <button id="callBtn" data-semantic-id="ring.action" disabled></button>
    <label id="videoToggle"><input type="checkbox" id="sendVideo"> <span id="videoToggleText"></span></label>
  </div>
  <div id="status"></div>
</main>
<audio id="remoteAudio" autoplay></audio>

<script src="vendor/jssip.min.js"></script>
<script src="/panel/playback.js"></script>
<script src="/panel/call-flow.js"></script>
<script src="/panel/runtime.js"></script>
<script>
"use strict";
const qs = new URLSearchParams(location.search);
let K = qs.get("k") || "";
const MOCK = qs.get("mock") === "1";
const INITIAL_DOOR = qs.get("door") || "";
const QUERY_LANG = normalizeLang(qs.get("lang"));
let I18N = {};
let LANG = "";
let emergencyOverlay = null;

function normalizeLang(value) {
  value = String(value || "").toLowerCase().split("-")[0];
  return value === "ja" || value === "en" || value === "zh" ? value : "";
}

function t(key, values) {
  let value = typeof I18N[key] === "string" ? I18N[key] : key;
  for (const [name, replacement] of Object.entries(values || {}))
    value = value.split("{" + name + "}").join(String(replacement));
  return value;
}

async function ensureLanguage(requested) {
  const lang = normalizeLang(requested) || "ja";
  if (LANG === lang) return;
  try {
    const response = await fetch("/locale/" + lang + ".json", { cache: "no-store" });
    if (!response.ok) throw new Error("locale HTTP " + response.status);
    I18N = await response.json();
    LANG = lang;
  } catch (error) {
    if (lang !== "en") { await ensureLanguage("en"); return; }
    I18N = {};
    LANG = "en";
  }
  document.documentElement.setAttribute("lang", LANG);
}

function languageForState(state, doorId) {
  if (QUERY_LANG) return QUERY_LANG;
  const stateDoors = (state && state.doors) || [];
  let match = doorId && stateDoors.find(door => door.id === doorId);
  let lang = normalizeLang(match && match.visitor_lang);
  if (lang) return lang;
  match = stateDoors.find(door => door.calling && normalizeLang(door.visitor_lang));
  lang = normalizeLang(match && match.visitor_lang);
  if (lang) return lang;
  match = stateDoors.find(door => normalizeLang(door.visitor_lang));
  return normalizeLang(match && match.visitor_lang) || "ja";
}

function applyEmergencyI18n() {
  const overlay = document.getElementsByClassName("dbEmergencyOverlay")[0];
  if (overlay) {
    const heading = overlay.getElementsByTagName("h2")[0];
    const paragraphs = overlay.getElementsByTagName("p");
    if (heading) heading.textContent = t("emergency.title");
    if (paragraphs[0]) paragraphs[0].textContent = t("emergency.active_detail");
    if (paragraphs[1]) paragraphs[1].textContent = t("emergency.clear_instruction");
  }
  const trigger = document.getElementsByClassName("dbSosTrigger")[0];
  if (trigger) {
    const spans = trigger.getElementsByTagName("span");
    trigger.setAttribute("aria-label", t("emergency.button"));
    if (spans[0]) spans[0].textContent = t("emergency.button");
    if (spans[1]) spans[1].textContent = t("emergency.hold_hint", { sec: "2" });
  }
}

function installEmergency() {
  emergencyOverlay = DoorbellPanelRuntime.installEmergencyOverlay({
    title: t("emergency.title"),
    detail: t("emergency.active_detail"),
    clearInstruction: t("emergency.clear_instruction"),
    triggerLabel: t("emergency.button"),
    triggerHint: t("emergency.hold_hint", { sec: "2" }),
  });
  applyEmergencyI18n();
}

const els = {
  title: document.getElementById("title"),
  tabs: document.getElementById("doorTabs"),
  live: document.getElementById("liveImg"),
  liveVideo: document.getElementById("liveVideo"),
  noVideo: document.getElementById("noVideo"),
  self: document.getElementById("selfPreview"),
  call: document.getElementById("callBtn"),
  sendVideo: document.getElementById("sendVideo"),
  sendVideoText: document.getElementById("videoToggleText"),
  status: document.getElementById("status"),
  reg: document.getElementById("regState"),
  offline: document.getElementById("offlineBand"),
  audio: document.getElementById("remoteAudio"),
};
let doors = [];        // [{id,label,extension,station,online}]
let selected = null;
let webrtc = null;     // {ws_url,sip_user,sip_pass,server}
let ua = null;         // JsSIP.UA
let session = null;
let sessionConfirmed = false;
let activeLifecycle = null;
let registered = false;
let frameTimer = null;
let camStream = null;
let playback = null;
let latestPanelState = null;
let sessionRefreshPending = false;
let registrationState = { state: "", reason: "" };
let mockSessionActive = false;

function renderRegistration() {
  if (registrationState.state === "registered") {
    els.reg.textContent = t(registrationState.mock ? "panel.mock_registered" :
      "panel.registered", { extension: webrtc && webrtc.sip_user || "" });
  } else if (registrationState.state === "unregistered") {
    els.reg.textContent = t("panel.unregistered");
  } else if (registrationState.state === "failed") {
    els.reg.textContent = t("panel.registration_failed", {
      reason: registrationState.reason || "?",
    });
  } else {
    els.reg.textContent = "";
  }
}

function applyI18n() {
  document.title = t("panel.call_title");
  els.title.textContent = t("panel.call_title");
  els.noVideo.textContent = t("panel.no_video");
  els.sendVideoText.textContent = t("panel.send_video");
  els.offline.textContent = t("panel.offline");
  if (session || mockSessionActive) els.call.textContent = t("incall.end");
  else els.call.textContent = selected && (selected.calling ||
    selected.call_state === "ringing" || selected.call_state === "purpose_pending") ?
    t("ring.answer") : t("panel.call");
  renderRegistration();
  renderTabs();
  applyEmergencyI18n();
}

function newDialogId() {
  if (!window.crypto || !window.crypto.getRandomValues) return "";
  const bytes = new Uint8Array(16);
  window.crypto.getRandomValues(bytes);
  return Array.prototype.map.call(bytes, b => ("0" + b.toString(16)).slice(-2)).join("");
}

function setStatus(msg, isErr) {
  els.status.textContent = msg || "";
  els.status.className = isErr ? "err" : "";
}


function renderTabs() {
  els.tabs.innerHTML = "";
  for (const d of doors) {
    const b = document.createElement("button");
    b.textContent = d.label;
    const st = document.createElement("span");
    st.className = "st";
    st.textContent = (d.calling || d.call_state === "ringing" || d.call_state === "purpose_pending") ?
      t("panel.visitor_calling") : (d.extension ?
        t("panel.extension", { extension: d.extension }) : t("panel.no_extension"));
    b.appendChild(st);
    if (selected && selected.id === d.id) b.classList.add("sel");
    b.onclick = () => selectDoor(d);
    els.tabs.appendChild(b);
  }
}

function playbackKey(d) {
  return [d && d.id, d && d.stream_mjpeg, d && d.stream_mp4,
          JSON.stringify((d && d.playback_profile) || {})].join("|");
}

function selectDoor(d, forcePlaybackRefresh) {
  if (session && !forcePlaybackRefresh) return;  // Do not switch doors during an active call.
  selected = d;
  renderTabs();
  if (playback) { playback.stop(); playback = null; }
  if (MOCK) {
    els.live.style.display = "none";
    els.liveVideo.style.display = "none";
    els.noVideo.style.display = "";
  } else {
    const mp4 = DoorbellPlayback.proxyMp4Url(d.id, K, d.stream_mp4, window.location);
    const mjpeg = "/snapshot-proxy?door=" + encodeURIComponent(d.id) + "&live=1";
    playback = DoorbellPlayback.start({ profile: d.playback_profile,
      mp4, mjpeg, mjpegMode: "image", video: els.liveVideo, img: els.live,
      onState: (state) => { els.noVideo.style.display = state === "failed" ? "" : "none"; } });
  }
  updateCallButton();
}

function updateCallButton() {
  if (session) {
    els.call.setAttribute("data-semantic-id", "call.end");
    els.call.textContent = t("incall.end");
    els.call.disabled = false;
    if (latestPanelState) DoorbellPanelRuntime.applySemanticUi(latestPanelState, { page: "call" });
    return;
  }
  els.call.setAttribute("data-semantic-id", "ring.action");
  els.call.textContent = selected && (selected.calling || selected.call_state === "ringing" ||
    selected.call_state === "purpose_pending") ? t("ring.answer") : t("panel.call");
  if (!webrtc || !webrtc.ws_url) {
    els.call.disabled = true;
    setStatus(t("panel.webrtc_required"));
    return;
  }
  if (!selected || !selected.extension) {
    els.call.disabled = true;
    if (selected) setStatus(t("panel.extension_unconfigured"));
    return;
  }
  const answering = selected.calling || selected.call_state === "ringing" ||
    selected.call_state === "purpose_pending";
  if (answering && !selected.call_id) {
    els.call.disabled = true;
    setStatus(t("panel.lifecycle_identity_missing"), true);
    return;
  }
  els.call.disabled = !registered && !MOCK;
}

// ---------- JsSIP ----------
function initUa() {
  if (MOCK || !webrtc || !webrtc.ws_url || !webrtc.sip_user) return;
  try {
    const socket = new JsSIP.WebSocketInterface(webrtc.ws_url);
    ua = new JsSIP.UA({
      sockets: [socket],
      uri: "sip:" + webrtc.sip_user + "@" + (webrtc.server || location.hostname),
      password: webrtc.sip_pass || "",
      register: true,
    });
    ua.on("registered", () => { registered = true;
        registrationState = { state: "registered", reason: "" };
        renderRegistration(); updateCallButton(); });
    ua.on("unregistered", () => { registered = false;
        registrationState = { state: "unregistered", reason: "" };
        renderRegistration(); updateCallButton(); });
    ua.on("registrationFailed", (e) => { registered = false;
        registrationState = { state: "failed", reason: e.cause || "?" };
        renderRegistration(); updateCallButton(); });
    ua.start();
  } catch (e) {
    setStatus(t("panel.jssip_init_failed", { reason: e }), true);
  }
}

function startCall() {
  if (!ua || !selected || !selected.extension) return;
  const answering = selected.calling || selected.call_state === "ringing" ||
    selected.call_state === "purpose_pending";
  if (answering && !selected.call_id) {
    setStatus(t("panel.lifecycle_identity_missing"), true);
    return;
  }
  const binding = answering ? {
    door: selected.id,
    callId: selected.call_id,
    stageRevision: Number(selected.stage_revision) || 0,
    dialogId: newDialogId(),
    owner: "",
    answered: false,
    answerPromise: null,
    ended: false,
  } : null;
  if (binding && !binding.dialogId) {
    setStatus(t("panel.dialog_identity_missing"), true);
    return;
  }
  activeLifecycle = binding;
  setStatus(answering ? t("panel.answering") : t("calling.title"));
  els.call.textContent = t("incall.end");
  els.call.classList.add("hang");
  const newSession = ua.call("sip:" + selected.extension + "@" + (webrtc.server || location.hostname), {
    mediaConstraints: { audio: true, video: false },
  });
  session = newSession;
  els.call.setAttribute("data-semantic-id", "call.end");
  if (latestPanelState) DoorbellPanelRuntime.applySemanticUi(latestPanelState, { page: "call" });
  newSession.on("confirmed", () => {
    sessionConfirmed = true;
    setStatus(t("incall.title"));
    if (els.sendVideo.checked) startSendingVideo();
    if (binding) {
      binding.answerPromise = postLifecycle(binding, "answered").then(result => {
        binding.answered = result.ok;
        binding.owner = result.dialog_owner || "";
        if (!result.ok && session === newSession) {
          setStatus(t("panel.lifecycle_connected_sync_failed"), true);
          endCall("lifecycle_rejected");
        }
        return result.ok;
      });
    }
  });
  newSession.on("ended", () => endCall("sip_ended"));
  newSession.on("failed", (e) => {
    setStatus(t("panel.call_failed", { reason: e.cause || "?" }), true);
    endCall("transport_error");
  });
  newSession.connection.addEventListener("track", (ev) => {
    if (ev.streams && ev.streams[0]) els.audio.srcObject = ev.streams[0];
  });
}

async function postLifecycle(binding, state, reason) {
  if (MOCK || !binding) return { ok: true, dialog_owner: "mock" };
  try {
    const response = await fetch("/api/panel/call-lifecycle", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: DoorbellCallFlow.lifecycleForm(binding.door, binding.callId,
        binding.stageRevision, state, binding.dialogId, reason),
    });
    if (!response.ok) return { ok: false, dialog_owner: "" };
    const body = await response.json();
    return { ok: body.ok === true, dialog_owner: body.dialog_owner || binding.owner || "" };
  } catch (e) {
    return { ok: false, dialog_owner: "" };
  }
}

function reportLifecycleEnd(binding, reason) {
  if (!binding || binding.ended) return;
  binding.ended = true;
  Promise.resolve(binding.answerPromise || binding.answered).then(answered => {
    if (answered) return postLifecycle(binding, "ended", reason || "sip_ended");
    return { ok: false };
  }).then(result => {
    if (binding.answered && !result.ok)
      setStatus(t("panel.lifecycle_end_sync_failed"), true);
  });
}

function heartbeatLifecycle(binding) {
  if (!binding || !binding.answered || binding.heartbeatPending) return;
  binding.heartbeatPending = true;
  postLifecycle(binding, "heartbeat").then(result => {
    binding.heartbeatPending = false;
    if (!result.ok && activeLifecycle === binding && session) {
      setStatus(t("panel.lifecycle_heartbeat_failed"), true);
      endCall("lifecycle_lease_lost");
    }
  });
}

async function reportRecovery(binding, restored) {
  if (!binding) return false;
  try {
    const response = await fetch("/api/panel/recovery", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: DoorbellCallFlow.recoveryForm(binding.door, binding.callId, restored, "",
        binding.dialogId),
    });
    return response.ok;
  } catch (e) {
    return false;
  }
}

function endCall(reason) {
  const binding = activeLifecycle;
  if (session) { try { if (!session.isEnded()) session.terminate(); } catch (e) { } }
  session = null;
  sessionConfirmed = false;
  activeLifecycle = null;
  reportLifecycleEnd(binding, reason || "local_hangup");
  stopSendingVideo();
  els.call.classList.remove("hang");
  updateCallButton();
}

els.call.onclick = () => {
  if (MOCK) {
    if (!mockSessionActive) {
      mockSessionActive = true;
      els.call.textContent = t("incall.end");
      els.call.classList.add("hang"); setStatus(t("panel.mock_incall"));
    } else {
      mockSessionActive = false;
      els.call.textContent = t("panel.call");
      els.call.classList.remove("hang"); setStatus("");
    }
    return;
  }
  if (session) endCall("local_hangup");
  else startCall();
};

window.addEventListener("pagehide", () => {
  const binding = activeLifecycle;
  if (!binding || !binding.answered || binding.ended || MOCK) return;
  binding.ended = true;
  try {
    fetch("/api/panel/call-lifecycle", {
      method: "POST",
      keepalive: true,
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: DoorbellCallFlow.lifecycleForm(binding.door, binding.callId,
        binding.stageRevision, "ended", binding.dialogId, "page_closed"),
    });
  } catch (e) { }
});


async function startSendingVideo() {
  if (frameTimer || !selected) return;
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 320 }, height: { ideal: 240 } }, audio: false });
  } catch (e) {
    setStatus(t("panel.camera_failed", { reason: e.name }), true);
    els.sendVideo.checked = false;
    return;
  }
  els.self.srcObject = camStream;
  els.self.style.display = "block";
  const canvas = document.createElement("canvas");
  const target = (selected.station || "") + "/call-frame?door=" +
      encodeURIComponent(selected.id);
  let busy = false;
  frameTimer = setInterval(() => {
    if (busy || !session) return;
    const v = els.self;
    if (!v.videoWidth) return;
    canvas.width = 320;
    canvas.height = Math.round(320 * v.videoHeight / v.videoWidth) || 240;
    canvas.getContext("2d").drawImage(v, 0, 0, canvas.width, canvas.height);
    canvas.toBlob((blob) => {
      if (!blob) return;
      busy = true;
      fetch(target, { method: "POST", body: blob,
                      headers: { "Content-Type": "image/jpeg",
                                 "Authorization": "Bearer " + K } })
        .catch(() => { })
        .finally(() => { busy = false; });
    }, "image/jpeg", 0.7);
  }, 500);
}

function stopSendingVideo() {
  if (frameTimer) { clearInterval(frameTimer); frameTimer = null; }
  if (camStream) { for (const t of camStream.getTracks()) t.stop(); camStream = null; }
  els.self.style.display = "none";
  els.self.srcObject = null;
}

els.sendVideo.onchange = () => {
  if (els.sendVideo.checked) { if (session || MOCK) startSendingVideo(); }
  else stopSendingVideo();
};


async function load() {
  if (MOCK) {
    doors = [
      { id: "d_front", label: "Front door", extension: "8001", station: "", online: true },
      { id: "d_back", label: "Back door", extension: "", station: "", online: false },
    ];
    webrtc = { ws_url: "ws://mock:8088/ws", sip_user: "260", server: "mock" };
    registered = true;
    registrationState = { state: "registered", reason: "", mock: true };
    renderRegistration();
    selectDoor(doors[0]);
    return;
  }
  try {
    const oldSelected = selected;
    const [st, ci] = await Promise.all([
      fetch(DoorbellPanelRuntime.panelStateUrl()).then(r => {
        if (!r.ok) { const e = new Error("state HTTP " + r.status); e.status = r.status; throw e; }
        return r.json();
      }),
      fetch("/api/panel/call-info").then(r => {
        if (!r.ok) { const e = new Error("call-info HTTP " + r.status); e.status = r.status; throw e; }
        return r.json();
      }),
    ]);
    const languageDoor = oldSelected && oldSelected.id || INITIAL_DOOR ||
      ((st.doors || []).find(door => door.calling) || {}).id || "";
    const desiredLanguage = languageForState(st, languageDoor);
    if (desiredLanguage !== LANG) {
      await ensureLanguage(desiredLanguage);
      applyI18n();
    }
    emergencyOverlay.update(st);
    latestPanelState = st;
    els.offline.style.display = "none";
    webrtc = ci.webrtc || null;
    doors = (st.doors || []).map(d => {
      const info = (ci.doors || {})[d.id] || {};
      return { id: d.id, label: d.label, extension: info.extension || "",
               station: info.station || "", online: info.online !== false,
               source_node_id: info.source_node_id || d.source_node_id || "",
               stream_mjpeg: info.stream_mjpeg || d.stream_mjpeg || "",
               stream_mp4: info.stream_mp4 || d.stream_mp4 || "",
               playback_profile: info.playback_profile || d.playback_profile || null,
               calling: !!d.calling, call_id: d.call_id || "",
               call_state: d.call_state || "", stage_revision: Number(d.stage_revision) || 0,
               visitor_lang: d.visitor_lang || "",
               dialog_owner: d.dialog_owner || "",
               expires_at_ms: Number(d.expires_at_ms) || 0 };
    });
    renderTabs();
    const refreshed = oldSelected ? doors.find(d => d.id === oldSelected.id) : null;
    if (!oldSelected && doors.length)
      selectDoor(doors.find(d => d.id === INITIAL_DOOR) || doors[0]);
    else if (oldSelected && !refreshed && doors.length) selectDoor(doors[0], true);
    else if (refreshed && playbackKey(refreshed) !== playbackKey(oldSelected))
      selectDoor(refreshed, true);
    else { selected = refreshed; renderTabs(); updateCallButton(); }
    if (refreshed && sessionConfirmed && activeLifecycle && refreshed.dialog_owner &&
        activeLifecycle.owner && refreshed.dialog_owner !== activeLifecycle.owner) {
      activeLifecycle.ended = true;
      activeLifecycle = null;
      setStatus(t("panel.other_answered"));
      if (session) endCall("answered_elsewhere");
    }
    if (refreshed && refreshed.recovery_required && activeLifecycle && sessionConfirmed &&
        refreshed.call_id === activeLifecycle.callId && !activeLifecycle.recoveryPending) {
      activeLifecycle.recoveryPending = true;
      reportRecovery(activeLifecycle, true).then(ok => {
        if (activeLifecycle) activeLifecycle.recoveryPending = false;
        if (!ok && session) {
          setStatus(t("panel.recovery_failed"), true);
          endCall("recovery_failed");
        }
      });
    }

      setStatus(t("panel.call_ended"));
