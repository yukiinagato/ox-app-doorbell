<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title></title>
<link rel="stylesheet" href="/panel/panel.css">
</head>
<body class="callPage">
<div id="callShell">
  <header id="callHeader">
    <a id="backLink" href="/panel/monitor"><svg class="ic" aria-hidden="true" focusable="false"><use href="/panel/icons/tabler-sprite.svg#i-chevron-right"></use></svg><span id="backText"></span></a>
    <h1 id="title" tabindex="-1" data-semantic-id="ring.title"></h1>
  </header>
  <div id="notices">
    <div id="offlineBand" class="band" data-semantic-id="status.offline" role="status"></div>
    <div id="configBand" class="band" role="status"></div>
    <div id="connectionBand" class="band" role="status"></div>
  </div>
  <div id="doorTabs" role="tablist" aria-labelledby="title"></div>
  <main>
    <div id="videoBox" class="stage" role="tabpanel" aria-labelledby="title">
      <img id="liveImg" alt="">
      <video id="liveVideo" style="display:none" muted autoplay playsinline></video>
      <div id="noVideo" class="videoPh" role="status"><span class="phSpin" aria-hidden="true"></span>
        <span class="phDoor" id="phDoor"></span><span class="phText" id="phText"></span></div>
      <video id="selfPreview" muted autoplay playsinline></video>
    </div>
    <div id="conversationSummary" role="status"></div>
    <div id="conversationActions"></div>
  </main>
  <div id="controls">
    <div id="primaryRow">
      <button id="callBtn" data-semantic-id="ring.action" disabled></button>
      <button id="replyBtn" type="button" aria-controls="replySheet" aria-expanded="false" hidden></button>
      <button id="ignoreBtn" class="quiet" type="button" hidden></button>
    </div>
    <div id="secondaryRow">
      <button id="micBtn" type="button" aria-pressed="false" hidden></button>
      <button id="unlockBtn" type="button" hidden></button>
      <label id="videoToggle"><input type="checkbox" id="sendVideo"> <span id="videoToggleText"></span></label>
    </div>
    <div id="status" role="status"></div>
    <div id="adminNote"><span id="setupNote"></span><span id="regState"></span><span id="extensionNote"></span></div>
  </div>
</div>
<div id="sheetScrim" hidden></div>
<div id="replySheet" role="dialog" aria-modal="true" aria-labelledby="replyTitle" hidden>
  <div class="sheetHead"><h2 id="replyTitle"></h2><button id="replySheetClose" type="button"></button></div>
  <div id="replyActions"></div>
</div>
<audio id="remoteAudio" autoplay></audio>

<script src="vendor/jssip.min.js"></script>
<script src="/panel/playback.js"></script>
<script src="/panel/panel-common.js"></script>
<script src="/panel/call-flow.js"></script>
<script src="/panel/conversations.js"></script>
<script src="/panel/runtime.js"></script>
<script src="/panel/video-session.js"></script>
<script>
"use strict";
const qs = new URLSearchParams(location.search);
let K = qs.get("k") || "";
const INITIAL_DOOR = qs.get("door") || "";
const QUERY_LANG = normalizeLang(qs.get("lang"));
let I18N = {};
let LANG = "";
let emergencyOverlay = null;
let panelCsrf = "";
let panelCsrfRequest = null;

function normalizeLang(value) {
  value = String(value || "").toLowerCase().split("-")[0];
  return value === "ja" || value === "en" || value === "zh" ? value : "";
}

function t(key, values) {
  let value = typeof I18N[key] === "string" ? I18N[key] : key;
  for (const [name, replacement] of Object.entries(values || {}))
    value = value.split("{" + name + "}").join(String(replacement));
  return value;
}

function ensureLanguage(requested) {
  const lang = normalizeLang(requested) || "ja";
  if (!readsAllowed()) return;
  if (LANG === lang) {
    if (localePoll.pending) retirePoll(localePoll);
    return;
  }
  if (localeAttempt && localeAttempt.lang === lang && contextCurrent(localeAttempt.context)) return;
  retirePoll(localePoll);
  const attempt = { lang: lang, context: captureContext() };
  localeAttempt = attempt;
  readPoll(localePoll, "/locale/" + lang + ".json", dictionary => {
    if (localeAttempt !== attempt || !contextCurrent(attempt.context)) return false;
    if (!dictionary || typeof dictionary !== "object" || Array.isArray(dictionary) ||
        Object.keys(dictionary).some(key => typeof dictionary[key] !== "string"))
      throw new Error("invalid locale dictionary");
    I18N = dictionary;
    LANG = lang;
    document.documentElement.setAttribute("lang", LANG);
    applyI18n();
    return true;
  });
}

function languageForState(state, doorId) {
  if (QUERY_LANG) return QUERY_LANG;
  const stateDoors = (state && state.doors) || [];
  let match = doorId && stateDoors.find(door => door.id === doorId);
  let lang = normalizeLang(match && match.visitor_lang);
  if (lang) return lang;
  match = stateDoors.find(door => door.calling && normalizeLang(door.visitor_lang));
  lang = normalizeLang(match && match.visitor_lang);
  if (lang) return lang;
  match = stateDoors.find(door => normalizeLang(door.visitor_lang));
  return normalizeLang(match && match.visitor_lang) || "ja";
}

function applyEmergencyI18n() {
  if (emergencyOverlay && emergencyOverlay.refreshText) emergencyOverlay.refreshText();
  const overlay = document.getElementsByClassName("dbEmergencyOverlay")[0];
  if (overlay) {
    const heading = overlay.getElementsByTagName("h2")[0];
    const paragraphs = overlay.getElementsByTagName("p");
    if (heading) heading.textContent = t("emergency.title");
    if (paragraphs[0]) paragraphs[0].textContent = t("emergency.active_detail");
    if (paragraphs[1]) paragraphs[1].textContent = t("emergency.clear_instruction");
  }
  const trigger = document.getElementsByClassName("dbSosTrigger")[0];
  if (trigger) {
    const spans = trigger.getElementsByTagName("span");
    trigger.setAttribute("aria-label", t("sos.accessibility_start"));
    if (spans[0]) spans[0].textContent = t("emergency.button");
  }
}

function installEmergency() {
  if (!emergencyOverlay) emergencyOverlay = DoorbellPanelRuntime.installEmergencyOverlay({
    translate: t,
    title: t("emergency.title"),
    detail: t("emergency.active_detail"),
    clearInstruction: t("emergency.clear_instruction"),
    triggerLabel: t("emergency.button"),
    triggerIcon: DoorbellPanelCommon.icon("alert-triangle"),
  });
  // SOS lives at the leading edge of the fixed action zone, so it never covers content.
  const zone = document.getElementById && document.getElementById("controls");
  const trigger = emergencyOverlay.trigger && emergencyOverlay.trigger();
  if (zone && trigger && trigger.parentNode !== zone) zone.insertBefore(trigger, zone.firstChild);
  applyEmergencyI18n();
}

const els = {
  title: document.getElementById("title"),
  tabs: document.getElementById("doorTabs"),
  live: document.getElementById("liveImg"),
  liveVideo: document.getElementById("liveVideo"),
  noVideo: document.getElementById("noVideo"),
  phDoor: document.getElementById("phDoor"),
  phText: document.getElementById("phText"),
  reply: document.getElementById("replyBtn"),
  ignore: document.getElementById("ignoreBtn"),
  mic: document.getElementById("micBtn"),
  unlock: document.getElementById("unlockBtn"),
  replySheet: document.getElementById("replySheet"),
  replyActions: document.getElementById("replyActions"),
  self: document.getElementById("selfPreview"),
  call: document.getElementById("callBtn"),
  sendVideo: document.getElementById("sendVideo"),
  sendVideoText: document.getElementById("videoToggleText"),
  status: document.getElementById("status"),
  reg: document.getElementById("regState"),
  offline: document.getElementById("offlineBand"),
  config: document.getElementById("configBand"),
  connection: document.getElementById("connectionBand"),
  audio: document.getElementById("remoteAudio"),
  scrim: document.getElementById("sheetScrim"),
  setupNote: document.getElementById("setupNote"),
  extensionNote: document.getElementById("extensionNote"),
  back: document.getElementById("backLink"),
  backText: document.getElementById("backText"),
};
// The live picture can be pinched, dragged and double-tapped; it returns to 1x when the door or
// the call changes.
const liveZoom = DoorbellPanelCommon.attachZoom(document.getElementById("videoBox"), [els.live, els.liveVideo]);
let doors = [];        // [{id,label,extension,station,online}]
const doorTabNodes = new Map();
let selected = null;
let webrtc = null;     // {ws_url,sip_user,sip_pass,server}
let desiredWebrtc = null;
let appliedWebrtc = null;
let desiredConfigIdentity = "";
let desired_config_generation = "";
let applied_generation = "";
let ua_generation = 0;
let localConfigGeneration = 0;
let uaBinding = null;
let uaRetirement = null;
let attemptedConfig = null;
let failedConfig = null;
let configurationReceived = false;
let configurationRevoked = false;
let ua = null;         // JsSIP.UA
let session = null;
let sessionConfirmed = false;
let activeLifecycle = null;
let registered = false;
let frameTimer = null;
let videoBinding = null;
let videoState = "OFF";
let playback = null;
let latestPanelState = null;
let sessionRefreshPending = false;
let registrationState = { state: "", reason: "" };
let selectionRevision = 0;
let pageRevision = 0;
let pageActive = true;
let callRevision = 0;
const statePoll = makePoll(1000, 3000);
const callInfoPoll = makePoll(5000, 4000);
const localePoll = makePoll(0, 4000);
let localeAttempt = null;
let latestCallInfo = null;
let latestStateContext = null;
let monotonicHighWater = 0;

function makePoll(period, deadline) {
  return { period: period, deadline: deadline, lane: DoorbellPanelRuntime.createRequestLane(),
    timer: null, pending: null, lastSuccess: null, failed: false };
}

function monotonicNow() {
  const value = performance.now();
  if (Number.isFinite(value)) monotonicHighWater = Math.max(monotonicHighWater, value);
  return monotonicHighWater;
}

function readsAllowed() { return pageActive && !document.hidden; }

function captureContext() {
  return { page: pageRevision, selection: selectionRevision,
    binding: activeLifecycle, session: session };
}

function contextCurrent(request) {
  return readsAllowed() && pageRevision === request.page &&
    selectionRevision === request.selection && activeLifecycle === request.binding &&
    session === request.session;
}

function retirePoll(poll) {
  clearTimeout(poll.timer);
  poll.timer = null;
  poll.pending = null;
  poll.lane.cancel();
}

function retireReads() {
  const csrfRequest = panelCsrfRequest;
  panelCsrfRequest = null;
  if (csrfRequest && csrfRequest.handle) csrfRequest.handle.cancel();
  [statePoll, callInfoPoll, localePoll].forEach(retirePoll);
  localeAttempt = null;
  statePoll.failed = true;
}

function renderFreshness() {
  const now = monotonicNow();
  const age = statePoll.lastSuccess === null ? null : Math.max(0, now - statePoll.lastSuccess);
  const stale = statePoll.failed || age === null || age > statePoll.deadline;
  els.offline.style.display = stale ? "block" : "none";
  els.offline.textContent = age === null ? t("panel.state_waiting") :
    t("panel.state_stale", { sec: Math.floor(age / 1000) });
  els.config.style.display = callInfoPoll.failed || callInfoPoll.lastSuccess !== null &&
    now - callInfoPoll.lastSuccess > callInfoPoll.period + callInfoPoll.deadline ? "block" : "none";
  els.config.textContent = t("panel.config_stale");
}

function readPoll(poll, url, apply, onFailure) {
  if (!readsAllowed() || poll.pending) return;
  clearTimeout(poll.timer);
  poll.timer = null;
  const request = captureContext();
  poll.pending = request;
  renderFreshness();
  const finish = result => {
    if (poll.pending !== request) return;
    try {
      if (!readsAllowed() || request.page !== pageRevision) return;
      if (result.ok) {
        if (apply(result.data, request) !== false) {
          poll.lastSuccess = monotonicNow();
          poll.failed = false;
        }
      } else {
        poll.failed = true;
        if (onFailure && contextCurrent(request)) onFailure(result);
        if (result.status === 403 && K && !sessionRefreshPending) {
          sessionRefreshPending = true;
          DoorbellPanelRuntime.establishSession(response => {
            sessionRefreshPending = false;
            if (readsAllowed() && request.page === pageRevision && response.ok) {
              panelCsrf = ""; loadPanelSession(); load();
            }
          }, K);
        }
      }
    } catch (error) {
      poll.failed = true;
    } finally {
      if (poll.pending === request) poll.pending = null;
      if (readsAllowed() && request.page === pageRevision) {
        renderFreshness();
        if (poll.period) poll.timer = setTimeout(poll === statePoll ? loadState : loadCallInfo, poll.period);
      }
    }
  };
  try {
    request.handle = poll.lane.start({ url: url, deadline_ms: poll.deadline }, finish);
    if (!request.handle) finish({ ok: false, kind: "busy" });
  } catch (error) { finish({ ok: false, kind: "network" }); }
}

function renderRegistration() {
  if (registrationState.state === "registered") {
    els.reg.textContent = t("panel.registered", { extension: registrationState.extension || webrtc && webrtc.sip_user || "" });
  } else if (registrationState.state === "unregistered") {
    els.reg.textContent = t("panel.unregistered");
  } else if (registrationState.state === "failed") {
    els.reg.textContent = t("panel.registration_failed", {
      reason: registrationState.reason || "?",
    });
  } else {
    els.reg.textContent = "";
  }
}

function renderConnection() {
  let message = "";
  if (configurationRevoked) message = t("panel.config_revoked");
  else if (session && desiredWebrtc && (!uaBinding || uaBinding.config !== desiredWebrtc))
    message = t("panel.config_pending");
  else if (failedConfig && failedConfig === desiredWebrtc)
    message = t("panel.config_apply_failed", { target: desiredWebrtc.sip_user || "—",
      current: appliedWebrtc && appliedWebrtc.sip_user || "—" });
  else if (desiredWebrtc && desiredWebrtc.ws_url && desiredWebrtc.sip_user &&
      desiredWebrtc !== appliedWebrtc)
    message = t("panel.config_applying", { target: desiredWebrtc.sip_user });
  if (els.connection.textContent !== message) els.connection.textContent = message;
  els.connection.style.display = message ? "block" : "none";
}

function applyI18n() {
  document.title = t("panel.call_title");
  els.title.textContent = t("panel.call_title");
  els.backText.textContent = t("panel.monitor_title");
  if (DoorbellPanelRuntime.panelUrl && LANG)
    els.back.setAttribute("href", DoorbellPanelRuntime.panelUrl("monitor", "", false) + "?lang=" + encodeURIComponent(LANG));
  DoorbellPanelCommon.setLabel(els.reply, t("ring.quick_replies"), "message-reply");
  DoorbellPanelCommon.setLabel(els.ignore, t("ring.ignore"), "bell-off");
  DoorbellPanelCommon.setLabel(els.unlock, t("ring.unlock"), "lock-open");
  micLabel = "";
  document.getElementById("replyTitle").textContent = t("reply.choose");
  document.getElementById("replySheetClose").textContent = t("monitor.close");
  renderPlaceholder();
  els.sendVideoText.textContent = t("panel.send_video");
  renderFreshness();
  if (session) els.call.textContent = t("incall.end");
  else els.call.textContent = selected && (selected.calling ||
    selected.call_state === "ringing" || selected.call_state === "purpose_pending") ?
    t("ring.answer") : t("panel.call");
  renderRegistration();
  renderConnection();
  renderTabs();
  applyEmergencyI18n();
}

function newDialogId() {
  if (!window.crypto || !window.crypto.getRandomValues) return "";
  const bytes = new Uint8Array(16);
  window.crypto.getRandomValues(bytes);
  return Array.prototype.map.call(bytes, b => ("0" + b.toString(16)).slice(-2)).join("");
}

function setStatus(msg, isErr) {
  els.status.textContent = msg || "";
  els.status.className = isErr ? "err" : "";
}


function renderTabs() {
  const previous = Array.from(els.tabs.children);
  const focused = document.activeElement;
  const focusIndex = previous.indexOf(focused);
  const scrollLeft = els.tabs.scrollLeft, scrollTop = els.tabs.scrollTop;
  const present = new Set();
  for (const d of doors) {
    if (present.has(d.id)) continue;
    present.add(d.id);
    let entry = doorTabNodes.get(d.id);
    if (!entry) {
      const button = document.createElement("button");
      button.type = "button";
      button.setAttribute("role", "tab");
      const label = document.createElement("span"), status = document.createElement("span");
      status.className = "st";
      button.appendChild(label); button.appendChild(status);
      entry = { button, label, status, door: d };
      button.onclick = () => selectDoor(entry.door);
      doorTabNodes.set(d.id, entry);
    }
    entry.door = d;
    // The tab says what a resident needs: who is at which door. Extensions are setup detail and
    // live in the administrator note of the action zone.
    const tileState = DoorbellPanelCommon.doorTileState(d);
    const status = tileState === "ringing" ? t("panel.visitor_calling") :
      tileState === "in_call" ? t("dash.state_in_call") :
      tileState === "offline" ? t("dash.tile_offline") : "";
    if (entry.label.textContent !== d.label) entry.label.textContent = d.label;
    if (entry.status.textContent !== status) entry.status.textContent = status;
    const chosen = !!selected && selected.id === d.id;
    const className = (chosen ? "sel " : "") + "is-" + tileState;
    if (entry.button.className !== className) entry.button.className = className;
    const pressed = chosen ? "true" : "false";
    if (entry.button.getAttribute("aria-selected") !== pressed) entry.button.setAttribute("aria-selected", pressed);
    const disabled = !!session && !chosen;
    if (entry.button.disabled !== disabled) entry.button.disabled = disabled;
    const index = present.size - 1;
    if (els.tabs.children[index] !== entry.button)
      els.tabs.insertBefore(entry.button, els.tabs.children[index] || null);
  }
  doorTabNodes.forEach((entry, id) => {
    if (present.has(id)) return;
    els.tabs.removeChild(entry.button);
    doorTabNodes.delete(id);
  });
  if (focusIndex >= 0) {
    const available = button => button.parentNode === els.tabs && !button.disabled;
    let target = available(focused) ? focused : previous.slice(focusIndex + 1).find(available);
    if (!target) target = previous.slice(0, focusIndex).reverse().find(available);
    if (!target) target = Array.from(els.tabs.children).find(available) || els.title;
    if (document.activeElement !== target) {
      try { target.focus({ preventScroll: true }); } catch (_) { target.focus(); }
    }
  }
  els.tabs.scrollLeft = scrollLeft; els.tabs.scrollTop = scrollTop;
}

// Arrow keys move between door tabs, as in any tab list.
els.tabs.onkeydown = event => {
  const step = event.key === "ArrowRight" || event.key === "ArrowDown" ? 1 :
    event.key === "ArrowLeft" || event.key === "ArrowUp" ? -1 : 0;
  if (!step) return;
  const tabs = Array.from(els.tabs.children).filter(button => !button.disabled);
  const at = tabs.indexOf(document.activeElement);
  if (at < 0 || tabs.length < 2) return;
  event.preventDefault();
  tabs[(at + step + tabs.length) % tabs.length].focus();
};

// The live picture is the raw sensor frame: turn it as the door's station reports.
function loadDoorRotation(d) {
  if (!DoorbellPanelRuntime.panelRequest) return;
  const revision = selectionRevision;
  DoorbellPanelCommon.loadRotation(DoorbellPlayback.peerMediaUrl ? DoorbellPlayback.peerMediaUrl(d, "meta", window.location) : "",
    DoorbellPanelRuntime.panelRequest, rotation => {
      if (revision === selectionRevision && selected && selected.id === d.id) liveZoom.setRotation(rotation);
    });
}

function playbackKey(d) {
  return [d && d.id, d && d.stream_mjpeg, d && d.stream_mp4,
          JSON.stringify((d && d.playback_profile) || {})].join("|");
}

function selectDoor(d, forcePlaybackRefresh) {
  if (conference && !forcePlaybackRefresh) conference.select(d);
  if (session && !forcePlaybackRefresh) return;  // Do not switch doors during an active call.
  selectionRevision++;
  if (!selected || selected.id !== d.id) { liveZoom.reset(); liveZoom.setRotation(0); }
  selected = d;
  loadDoorRotation(d);
  renderTabs();
  if (playback) { playback.stop(); playback = null; }
  const mp4 = DoorbellPlayback.proxyMp4Url(d.id, K, d.stream_mp4, window.location);
  const mjpeg = "/snapshot-proxy?door=" + encodeURIComponent(d.id) + "&live=1";
  playback = DoorbellPlayback.start({ profile: d.playback_profile,
    mp4, mjpeg, mjpegMode: "poll", video: els.liveVideo, img: els.live,
    onState: (state) => { playbackState = state; renderPlaceholder(); } });
  playbackState = "loading";
  renderPlaceholder();
  updateCallButton();
  if (latestPanelState) ensureLanguage(languageForState(latestPanelState, d.id));
}

// ---- Action zone: Answer | Reply | Ignore, and End | Mic | Unlock in a call ----
let playbackState = "loading";
let ignoredRing = "";
let micMuted = false;
let micLabel = "";

function ringKey(d) {
  return d ? d.id + "|" + (d.call_id || "") : "";
}

function selectedRinging() {
  return !!selected && !!(selected.calling || selected.call_state === "ringing" ||
    selected.call_state === "purpose_pending") && ignoredRing !== ringKey(selected);
}

// A video area never shows an empty black box: it names the door and says what is happening.
function renderPlaceholder() {
  const doorState = selected ? DoorbellPanelCommon.doorTileState(selected) : "idle";
  const key = selected ? DoorbellPanelCommon.videoPlaceholder(doorState, playbackState,
    DoorbellPanelCommon.mediaHasFrame(els.live, els.liveVideo)) : "";
  els.noVideo.style.display = key ? "" : "none";
  els.noVideo.className = "videoPh" + (key === "video.connecting" ? " connecting" : "");
  els.phDoor.textContent = selected ? selected.label || selected.id : "";
  els.phText.textContent = key ? t(key) : "";
}

function quickReplies() {
  return (latestPanelState && latestPanelState.quick_replies) || [];
}

function renderReplySheet() {
  const host = els.replyActions;
  while (host.firstChild) host.removeChild(host.firstChild);
  const lang = DoorbellPanelCommon.normalizeLang(selected && selected.visitor_lang);
  for (const reply of quickReplies()) {
    const label = (reply.labels && (reply.labels[lang] || reply.labels[LANG] || reply.labels.ja ||
      reply.labels.en || reply.labels.zh)) || reply.label;
    if (!reply.id || !label) continue;
    const button = document.createElement("button");
    button.type = "button";
    button.setAttribute("data-semantic-id", "reply.button");
    button.textContent = label;
    button.onclick = () => sendQuickReply(reply.id, label, button);
    host.appendChild(button);
  }
}

function setReplySheet(open) {
  if (open) renderReplySheet();
  els.replySheet.hidden = !open;
  els.scrim.hidden = !open;
  els.reply.setAttribute("aria-expanded", open ? "true" : "false");
  if (open && els.replyActions.querySelector) {
    const first = els.replyActions.querySelector("button");
    if (first) first.focus();
  }
}

// Quick replies need no WebRTC: they go through the panel reply API.
function sendQuickReply(id, label, button) {
  const door = selected;
  if (!door) return;
  button.disabled = true;
  const body = "reply_id=" + encodeURIComponent(id) + "&door=" + encodeURIComponent(door.id) +
    "&call_id=" + encodeURIComponent(door.call_id || "") +
    "&stage_revision=" + encodeURIComponent(door.stage_revision || 0);
  DoorbellPanelRuntime.panelRequest("POST", "/api/panel/reply", body, (status) => {
    button.disabled = false;
    if (status >= 200 && status < 300) { setStatus(t("reply.sent", { text: label })); setReplySheet(false); }
    else setStatus(t("reply.failed"), true);
  });
}

function sendUnlock() {
  if (!selected) return;
  els.unlock.disabled = true;
  DoorbellPanelRuntime.panelRequest("POST", "/api/doors/" + encodeURIComponent(selected.id) + "/open", {},
    (status, body) => {
      els.unlock.disabled = false;
      if (status >= 200 && status < 300) setStatus(t("ring.open_sent"));
      else if (body && body.err === "unlock_not_configured") setStatus(t("ring.open_unconfigured"), true);
      else setStatus(t("ring.open_failed"), true);
    });
}

function toggleMic() {
  if (!session) return;
  try {
    if (micMuted) session.unmute({ audio: true }); else session.mute({ audio: true });
    micMuted = !micMuted;
  } catch (e) { setStatus(t("ring.mic_unavailable"), true); }
  renderSecondaryActions();
}

function renderSecondaryActions() {
  const ringing = selectedRinging();
  els.reply.hidden = !(ringing && !session && quickReplies().length);
  els.ignore.hidden = !(ringing && !session);
  if (els.reply.hidden && !els.replySheet.hidden) setReplySheet(false);
  els.mic.hidden = !session;
  if (!session) micMuted = false;
  const micText = t(micMuted ? "ring.mic_off" : "ring.mic_on");
  if (micLabel !== micText) {
    micLabel = micText;
    DoorbellPanelCommon.setLabel(els.mic, micText, micMuted ? "microphone-off" : "microphone");
  }
  els.mic.setAttribute("aria-pressed", micMuted ? "true" : "false");
  const unlock = selected && selected.unlock;
  els.unlock.hidden = !((ringing || session) && unlock && unlock.show_button === true &&
    unlock.permitted !== false);
  renderPlaceholder();
}

if (els.live && els.live.addEventListener) els.live.addEventListener("load", renderPlaceholder);
if (els.liveVideo && els.liveVideo.addEventListener) {
  els.liveVideo.addEventListener("playing", renderPlaceholder);
  els.liveVideo.addEventListener("loadeddata", renderPlaceholder);
}
els.reply.onclick = () => setReplySheet(!!els.replySheet.hidden);
document.getElementById("replySheetClose").onclick = () => { setReplySheet(false); els.reply.focus(); };
els.scrim.onclick = () => setReplySheet(false);
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && !els.replySheet.hidden) { setReplySheet(false); els.reply.focus(); }
});
els.ignore.onclick = () => {
  ignoredRing = ringKey(selected);
  setReplySheet(false);
  updateCallButton();
  setStatus(t("ring.ignored"));
};
els.unlock.onclick = sendUnlock;
els.mic.onclick = toggleMic;

function updateCallButton() {
  updateLegacyCallButton();
  if (conference) renderConference();
}
// Setup detail is for the administrator: a quiet note under the resident's status line.
function renderAdminNote(setupKey) {
  const setup = setupKey ? t("panel.admin_note", { detail: t(setupKey) }) : "";
  if (els.setupNote.textContent !== setup) els.setupNote.textContent = setup;
  const extension = !selected ? "" : selected.extension ?
    t("panel.extension", { extension: selected.extension }) : t("panel.no_extension");
  if (els.extensionNote.textContent !== extension) els.extensionNote.textContent = extension;
}
// "Calling is not available" explains a disabled control; it is withdrawn as soon as the control
// works again, and never replaces a newer message.
let availabilityStatus = "";
function setAvailability(message) {
  if (message) { availabilityStatus = message; setStatus(message); }
  else if (availabilityStatus && els.status.textContent === availabilityStatus) { availabilityStatus = ""; setStatus(""); }
}
function updateLegacyCallButton() {
  renderSecondaryActions();
  renderAdminNote(!webrtc || !webrtc.ws_url ? "panel.webrtc_required" :
    selected && !selected.extension ? "panel.extension_unconfigured" : "");
  if (session) {
    els.call.setAttribute("data-semantic-id", "call.end");
    els.call.textContent = t("incall.end");
    els.call.disabled = false;
    if (latestPanelState) DoorbellPanelRuntime.applySemanticUi(latestPanelState, { page: "call" });
    return;
  }
  els.call.setAttribute("data-semantic-id", "ring.action");
  els.call.textContent = selectedRinging() ? t("ring.answer") : t("panel.call");
  if (!webrtc || !webrtc.ws_url) {
    els.call.disabled = true;
    // The reason sits in the action zone next to the disabled control.
    setAvailability(t(selectedRinging() ? "ring.answer_unavailable" : "panel.calling_unavailable"));
    return;
  }
  if (!selected || !selected.extension) {
    els.call.disabled = true;
    if (selected) setAvailability(t("panel.door_call_unavailable"));
    return;
  }
  setAvailability("");
  const answering = selected.calling || selected.call_state === "ringing" ||
    selected.call_state === "purpose_pending";
  if (answering && !selected.call_id) {
    els.call.disabled = true;
    setStatus(t("panel.lifecycle_identity_missing"), true);
    return;
  }
  els.call.disabled = !registered || !panelCsrf;
}

function receiveWebrtc(value) {
  const input = value || {};
  const next = Object.freeze({ ws_url: String(input.ws_url || ""), sip_user: String(input.sip_user || ""),
    sip_pass: String(input.sip_pass || ""), sip_pass_ref: String(input.sip_pass_ref || ""),
    server: String(input.server || ""), config_generation: String(input.config_generation || "") });
  // The credential participates only in this private in-memory comparison, never a log or URL.
  const identity = JSON.stringify(next);
  configurationReceived = true;
  configurationRevoked = false;
  if (identity !== desiredConfigIdentity) {
    desiredConfigIdentity = identity;
    desiredWebrtc = next;
    desired_config_generation = next.config_generation || "local:" + (++localConfigGeneration);
    failedConfig = uaRetirement && uaRetirement.blocked ? next : null;
  }
  initUa();
  renderConnection();
}

function currentUa(binding) {
  return pageActive && uaBinding === binding && ua === binding.ua && ua_generation === binding.generation;
}

function retireUa(force) {
  if (uaRetirement) {
    if (force) uaRetirement.finish(true);
    return;
  }
  const binding = uaBinding;
  if (!binding) return;
  ua = null; uaBinding = null; ua_generation++;
  registered = false;
  clearTimeout(binding.timer);
  binding.listeners.forEach(item => binding.ua.removeListener(item[0], item[1]));
  const retirement = { timer: null, done: false, finish: null };
  uaRetirement = retirement;
  const finish = disconnect => {
    if (retirement.done) return;
    retirement.done = true;
    clearTimeout(retirement.timer);
    binding.ua.removeListener("disconnected", disconnected);
    let closed = true;
    try {
      if (disconnect && binding.ua.transport) binding.ua.transport.disconnect();
      if (binding.ua.transport && binding.ua.transport.isConnected()) closed = false;
    } catch (_) { closed = false; }
    if (closed) uaRetirement = null;
    else {
      retirement.blocked = true; retirement.done = false;
      failedConfig = desiredWebrtc; attemptedConfig = desiredWebrtc;
    }
    if (closed && pageActive && !force) initUa();
    renderConnection();
  };
  const disconnected = () => finish(false);
  retirement.finish = finish;
  binding.ua.on("disconnected", disconnected);
  retirement.timer = setTimeout(() => finish(true), 2200);
  try { binding.ua.unregister(); } catch (_) { }
  try { binding.ua.stop(); } catch (_) { finish(true); }
  if (force) finish(true);
  else if (uaRetirement === retirement && binding.ua.transport && !binding.ua.transport.isConnected()) finish(false);
}

function revokeCalling() {
  configurationRevoked = true;
  configurationReceived = false;
  desiredConfigIdentity = "";
  attemptedConfig = null;
  if (session) endCall("permission_revoked");
  retireUa(true);
  renderConnection();
  updateCallButton();
}

function initUa() {
  if (!pageActive || !configurationReceived || configurationRevoked || session || uaRetirement) return;
  if (uaBinding && uaBinding.config === desiredWebrtc && !uaBinding.failed) return;
  if (uaBinding) { retireUa(false); return; }
  if (!desiredWebrtc || attemptedConfig === desiredWebrtc) return;
  const config = desiredWebrtc;
  attemptedConfig = config;
  webrtc = config;
  registered = false;
  registrationState = { state: "unregistered", reason: "" };
  renderRegistration();
  if (!config.ws_url || !config.sip_user) { updateCallButton(); return; }
  const binding = { config, generation: ++ua_generation, configGeneration: desired_config_generation,
    ua: null, listeners: [], timer: null };
  try {
    const socket = new JsSIP.WebSocketInterface(config.ws_url);
    const instance = new JsSIP.UA({
      sockets: [socket],
      uri: "sip:" + config.sip_user + "@" + (config.server || location.hostname),
      password: config.sip_pass,
      register: true,
    });
    binding.ua = instance; uaBinding = binding; ua = instance;
    const listen = (name, fn) => {
      const guarded = event => { if (currentUa(binding)) fn(event || {}); };
      binding.listeners.push([name, guarded]); instance.on(name, guarded);
    };
    const fail = () => {
      if (!currentUa(binding)) return;
      failedConfig = config;
      binding.failed = true;
      clearTimeout(binding.timer);
      registered = false;
      registrationState = { state: "unregistered", reason: "" };
      if (!session) retireUa(false);
      renderRegistration(); renderConnection(); updateCallButton();
    };
    listen("connected", () => { renderConnection(); });
    listen("registered", () => {
      clearTimeout(binding.timer);
      registered = true; appliedWebrtc = config; applied_generation = binding.configGeneration;
      failedConfig = null;
      registrationState = { state: "registered", reason: "", extension: config.sip_user };
      renderRegistration(); renderConnection(); updateCallButton();
    });
    listen("unregistered", () => {
      registered = false; registrationState = { state: "unregistered", reason: "" };
      renderRegistration(); updateCallButton();
    });
    listen("registrationFailed", fail);
    listen("disconnected", () => {
      registered = false; registrationState = { state: "unregistered", reason: "" };
      renderRegistration(); updateCallButton();
    });
    binding.timer = setTimeout(fail, 10000);
    instance.start();
  } catch (_) {
    failedConfig = config;
    if (uaBinding === binding) retireUa(true);
    renderConnection();
  }
  updateCallButton();
}

function startCall() {
  if (conference && selected && selected.conversation_supported) {
    const mine = conference.member(selected);
    const request = conferenceCallPress || conference.request(selected, !mine || mine.state === "waiting" ? "answer" : "leave");
    conferenceCallPress = null;
    if (request.door !== selected.id || request.call_id !== selected.call_id) return;
    conference.action(selected, request.action, request).then(ok => { if (!ok) showConferenceError(); }).catch(showConferenceError);
    return;
  }
  if (!ua || !selected || !selected.extension) return;
  if (!panelCsrf) { loadPanelSession(); return; }
  const answering = selected.calling || selected.call_state === "ringing" ||
    selected.call_state === "purpose_pending";
  if (answering && !selected.call_id) {
    setStatus(t("panel.lifecycle_identity_missing"), true);
    return;
  }
  const binding = answering ? {
    door: selected.id,
    callId: selected.call_id,
    stageRevision: Number(selected.stage_revision) || 0,
    dialogId: newDialogId(),
    owner: "",
    answered: false,
    answerPromise: null,
    ended: false,
  } : null;
  if (binding && !binding.dialogId) {
    setStatus(t("panel.dialog_identity_missing"), true);
    return;
  }
  activeLifecycle = binding;
  callRevision++;
  liveZoom.reset();
  setStatus(answering ? t("panel.answering") : t("calling.title"));
  els.call.textContent = t("incall.end");
  els.call.classList.add("hang");
  const newSession = ua.call("sip:" + selected.extension + "@" + (webrtc.server || location.hostname), {
    mediaConstraints: { audio: true, video: false },
  });
  session = newSession;
  els.call.setAttribute("data-semantic-id", "call.end");
  if (latestPanelState) DoorbellPanelRuntime.applySemanticUi(latestPanelState, { page: "call" });
  newSession.on("confirmed", () => {
    if (session !== newSession || activeLifecycle !== binding) return;
    sessionConfirmed = true;
    setStatus(t("incall.title"));
    if (binding) {
      binding.answerPromise = postLifecycle(binding, "answered").then(result => {
        binding.answered = result.ok;
        binding.owner = result.dialog_owner || "";
        if (activeLifecycle === binding && session === newSession) {
          if (!result.ok || !acceptLease(binding, result)) {
            setStatus(t(result.ok ? "panel.lifecycle_lease_unavailable" :
              "panel.lifecycle_connected_sync_failed"), true);
            endCall("lifecycle_rejected", binding, newSession);
          } else {
            scheduleHeartbeat(binding, 2000);
            if (els.sendVideo.checked) startSendingVideo();
          }
        }
        return result.ok;
      });
    }
  });
  newSession.on("ended", () => { if (session === newSession) endCall("sip_ended"); });
  newSession.on("failed", (e) => {
    if (session !== newSession) return;
    setStatus(t("panel.call_failed", { reason: e.cause || "?" }), true);
    endCall("transport_error");
  });
  newSession.connection.addEventListener("track", (ev) => {
    if (session !== newSession) return;
    if (ev.streams && ev.streams[0]) els.audio.srcObject = ev.streams[0];
  });
}

function postLifecycle(binding, state, reason, lane) {
  const request = { callId: binding.callId, stageRevision: binding.stageRevision,
    owner: binding.owner, started: monotonicNow() };
  return new Promise(resolve => {
    const complete = result => {
      const body = result.data || {};
      resolve(Object.assign({}, body, { ok: result.ok && body.ok === true,
        status: result.status || 0, kind: result.kind, error_code: result.error_code || "",
        request: request }));
    };
    try {
      const remaining = state === "heartbeat" ? binding.leaseDeadline - request.started : 1500;
      const options = { url: "/api/panel/call-lifecycle", method: "POST",
        deadline_ms: Math.max(1, Math.min(1500, Math.floor(remaining))),
        headers: { "Content-Type": "application/x-www-form-urlencoded", "X-Doorbell-CSRF": panelCsrf },
        body: DoorbellCallFlow.lifecycleForm(binding.door, request.callId,
          request.stageRevision, state, binding.dialogId, reason) };
      const handle = lane ? lane.start(options, complete) :
        DoorbellPanelRuntime.requestWithDeadline(options, complete);
      if (!handle) complete({ ok: false, kind: "busy" });
    } catch (error) { complete({ ok: false, kind: "network" }); }
  });
}

function reportLifecycleEnd(binding, reason) {
  if (!binding || binding.ended) return;
  binding.ended = true;
  const revision = callRevision;
  Promise.resolve(binding.answerPromise || binding.answered).then(answered => {
    if (answered) return postLifecycle(binding, "ended", reason || "sip_ended");
    return { ok: false };
  }).then(result => {
    if (binding.answered && !result.ok && !session && revision === callRevision)
      setStatus(t("panel.lifecycle_end_sync_failed"), true);
  });
}

function heartbeatCurrent(binding, expectedSession) {
  return pageActive && activeLifecycle === binding && !binding.ended &&
    session && (!expectedSession || session === expectedSession);
}

function stopHeartbeat(binding, preserveExpiry) {
  if (!binding) return;
  clearTimeout(binding.heartbeatTimer);
  binding.heartbeatTimer = null;
  if (!preserveExpiry) { clearTimeout(binding.leaseTimer); binding.leaseTimer = null; }
  binding.heartbeatGeneration = (binding.heartbeatGeneration || 0) + 1;
  binding.heartbeatPending = false;
  if (binding.heartbeatLane) binding.heartbeatLane.cancel();
}

function expireLease(binding, expectedSession) {
  if (!heartbeatCurrent(binding, expectedSession)) return;
  setStatus(t("panel.lifecycle_lease_expired"), true);
  endCall("lifecycle_lease_lost", binding, session);
}

function acceptLease(binding, result) {
  const remaining = result.lease_remaining_ms, request = result.request;
  if (!request || result.call_id !== binding.callId ||
      result.stage_revision !== request.stageRevision || binding.stageRevision !== request.stageRevision ||
      !binding.owner || result.dialog_owner !== binding.owner ||
      typeof remaining !== "number" || !Number.isInteger(remaining) || remaining < 0 || remaining > 10000)
    return false;
  const deadline = request.started + remaining;
  if (deadline <= monotonicNow()) return false;
  binding.leaseDeadline = deadline;
  binding.heartbeatRetry = 0;
  clearTimeout(binding.leaseTimer);
  const expectedSession = session;
  binding.leaseTimer = setTimeout(() => {
    if (binding.leaseDeadline === deadline) expireLease(binding, expectedSession);
  }, Math.max(0, deadline - monotonicNow()));
  return true;
}

// Lifecycle visibility policy: an answered, unended call keeps renewing its lease while the page
// is hidden (tab switch, phone screen lock) because the resident is still talking and media keeps
// flowing. Hidden pages stop only reads (state, config, call info). A call that is not yet
// answered, or a page that is only monitoring, makes no ownership claims while hidden. Real
// device sleep still stops timers, so the server-side lease bound remains the safety net.
function heartbeatPausedWhileHidden(binding) {
  return document.hidden && !(binding && binding.answered && !binding.ended);
}

function scheduleHeartbeat(binding, delay) {
  if (!heartbeatCurrent(binding) || !Number.isFinite(binding.leaseDeadline)) return;
  clearTimeout(binding.heartbeatTimer);
  const remaining = binding.leaseDeadline - monotonicNow();
  if (remaining <= 0) { expireLease(binding, session); return; }
  if (heartbeatPausedWhileHidden(binding) || binding.awaitingAuthority) return;
  binding.heartbeatTimer = setTimeout(() => heartbeatLifecycle(binding), Math.min(delay, remaining));
}

function heartbeatLifecycle(binding) {
  if (!binding || !binding.answered || !heartbeatCurrent(binding) || binding.heartbeatPending ||
      heartbeatPausedWhileHidden(binding) || binding.awaitingAuthority ||
      !Number.isFinite(binding.leaseDeadline)) return;
  if (monotonicNow() >= binding.leaseDeadline) { expireLease(binding, session); return; }
  if (binding.recoveryPending) { scheduleHeartbeat(binding, 500); return; }
  clearTimeout(binding.heartbeatTimer);
  binding.heartbeatTimer = null;
  if (!binding.heartbeatLane) binding.heartbeatLane = DoorbellPanelRuntime.createRequestLane();
  const expectedSession = session, generation = binding.heartbeatGeneration || 0;
  binding.heartbeatPending = true;
  postLifecycle(binding, "heartbeat", "", binding.heartbeatLane).then(result => {
    if (!heartbeatCurrent(binding, expectedSession) ||
        (binding.heartbeatGeneration || 0) !== generation) return;
    binding.heartbeatPending = false;
    if (monotonicNow() >= binding.leaseDeadline) { expireLease(binding, expectedSession); return; }
    if (["stale_owner", "call_ended", "auth_required", "permission_denied"].includes(result.error_code)) {
      setStatus(t("panel.lifecycle_heartbeat_failed"), true);
      endCall("lifecycle_lease_lost", binding, expectedSession);
    } else if (result.ok && acceptLease(binding, result)) {
      setStatus(t("incall.title"));
      scheduleHeartbeat(binding, 2000);
    } else {
      setStatus(t("panel.control_reconnecting"), true);
      const delay = [500, 1000, 2000][Math.min(binding.heartbeatRetry || 0, 2)];
      binding.heartbeatRetry = Math.min((binding.heartbeatRetry || 0) + 1, 2);
      scheduleHeartbeat(binding, delay);
    }
  });
}

async function reportRecovery(binding, restored) {
  if (!binding) return false;
  try {
    const response = await fetch("/api/panel/recovery", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded", "X-Doorbell-CSRF": panelCsrf },
      body: DoorbellCallFlow.recoveryForm(binding.door, binding.callId, restored, "",
        binding.dialogId),
    });
    return response.ok;
  } catch (e) {
    return false;
  }
}

function finishRecovery(binding, expectedSession, ok) {
  binding.recoveryPending = false;
  if (ok || activeLifecycle !== binding || session !== expectedSession || !sessionConfirmed) return false;
  setStatus(t("panel.recovery_failed"), true);
  return endCall("recovery_failed", binding, expectedSession);
}

function endCall(reason, expectedBinding, expectedSession) {
  if (expectedBinding && (activeLifecycle !== expectedBinding || session !== expectedSession)) return false;
  const binding = activeLifecycle;
  const endedSession = session;
  stopHeartbeat(binding);
  callRevision++;
  session = null;
  sessionConfirmed = false;
  activeLifecycle = null;
  if (endedSession) { try { if (!endedSession.isEnded()) endedSession.terminate(); } catch (e) { } }
  reportLifecycleEnd(binding, reason || "local_hangup");
  stopSendingVideo();
  liveZoom.reset();
  els.call.classList.remove("hang");
  initUa();
  renderConnection();
  updateCallButton();
  return true;
}

els.call.onclick = () => {
  if (session) endCall("local_hangup");
  else startCall();
};

window.addEventListener("pagehide", () => {
  pageActive = false;
  if (conference) conference.close();
  pageRevision++;
  retireReads();
  configurationReceived = false;
  attemptedConfig = null;
  if (playback) { playback.stop(); playback = null; }
  stopSendingVideo();
  const binding = activeLifecycle;
  if (!binding || !binding.answered || binding.ended) {
    endCall("page_closed"); retireUa(true); return;
  }
  binding.ended = true;
  try {
    fetch("/api/panel/call-lifecycle", {
      method: "POST",
      keepalive: true,
      headers: { "Content-Type": "application/x-www-form-urlencoded", "X-Doorbell-CSRF": panelCsrf },
      body: DoorbellCallFlow.lifecycleForm(binding.door, binding.callId,
        binding.stageRevision, "ended", binding.dialogId, "page_closed"),
    });
  } catch (e) { }
  endCall("page_closed");
  retireUa(true);
});

window.addEventListener("pageshow", () => {
  if (pageActive) return;
  pageActive = true;
  selected = null;
  start();
});


document.addEventListener("visibilitychange", () => {
  if (!pageActive) return;
  pageRevision++;
  retireReads();
  if (activeLifecycle && heartbeatPausedWhileHidden(activeLifecycle)) {
    activeLifecycle.awaitingAuthority = true;
    stopHeartbeat(activeLifecycle, true);
    setStatus(t("panel.control_reconnecting"), true);
    if (monotonicNow() >= activeLifecycle.leaseDeadline) expireLease(activeLifecycle, session);
  } else if (activeLifecycle && !document.hidden &&
      monotonicNow() >= activeLifecycle.leaseDeadline) {
    expireLease(activeLifecycle, session);
  }
  if (!document.hidden) start();
});


async function startSendingVideo() {
  if (videoBinding || frameTimer || !selected || !session) return;
  if (!panelCsrf || !activeLifecycle || !activeLifecycle.answered || !sessionConfirmed) {
    els.sendVideo.checked = false; setStatus(t("panel.video_unavailable"), true); return;
  }
  const binding = { session: session, door: selected.id, lifecycle: activeLifecycle,
    callId: activeLifecycle.callId, revision: activeLifecycle.stageRevision,
    owner: activeLifecycle.owner, target: "/call-frame", grant: null, sequence: 0,
    handle: null, retryTimer: null, failures: 0, acceptedAt: 0, acceptedSequence: 0 };
  videoBinding = binding;
  videoState = "AUTHORIZING";
  try {
    await authorizeVideo(binding);
    if (currentVideo(binding)) {
      if (!videoSession.start(binding)) { videoBinding = null; videoState = "OFF"; }
      else binding.started = true;
    }
  } catch (error) { failVideo(binding, error); }
}

function stopSendingVideo() {
  const binding = videoBinding;
  videoBinding = null;
  videoState = "OFF";
  if (binding) {
    if (binding.retryTimer !== null) clearTimeout(binding.retryTimer);
    binding.retryTimer = null;
    if (binding.handle) binding.handle.cancel();
  }
  videoSession.stop();
}

function currentVideo(binding) {
  return videoBinding === binding && binding.session === session &&
    binding.lifecycle === activeLifecycle && activeLifecycle.answered &&
    binding.callId === activeLifecycle.callId && binding.revision === activeLifecycle.stageRevision &&
    binding.owner === activeLifecycle.owner &&
    selected && binding.door === selected.id && els.sendVideo.checked;
}

function failVideo(binding, error) {
  if (videoBinding !== binding) return;
  if (binding.retryTimer !== null) { clearTimeout(binding.retryTimer); binding.retryTimer = null; }
  const code = error && error.code || "";
  const status = error && error.status || 0;
  const permanent = status === 401 || status === 403 || status === 409 ||
    /invalid|revoked|stale|wrong|not_owner|forbidden|unauthorized/i.test(code);
  if (permanent || !currentVideo(binding)) {
    stopSendingVideo(); els.sendVideo.checked = false; videoState = permanent ? "DENIED" : "STALE";
    setStatus(t("panel.video_unavailable"), true); return;
  }
  binding.failures++;
  if (binding.failures > 5) {
    videoState = "INTERRUPTED";
    videoSession.stop();
    setStatus(t("panel.video_unavailable"), true); return;
  }
  videoState = "RECOVERING";
  const delays = [250, 500, 1000, 2000, 4000];
  const wait = delays[binding.failures - 1];
  binding.retryTimer = setTimeout(async function () {
    binding.retryTimer = null;
    if (!currentVideo(binding)) { if (videoBinding === binding) videoState = "STALE"; return; }
    if (!binding.grant || binding.grant.deadline - monotonicNow() <= 3000) {
      videoState = "AUTHORIZING";
      try { await authorizeVideo(binding); }
      catch (retryError) { failVideo(binding, retryError); return; }
    }
    if (!binding.started) {
      if (!videoSession.start(binding)) { failVideo(binding, new Error("camera_restart_failed")); return; }
      binding.started = true;
    }
    videoState = "SENDING";
  }, wait);
}

function videoRequest(binding, options) {
  return new Promise((resolve, reject) => {
    if (!currentVideo(binding)) { reject(new Error("stale_media")); return; }
    binding.handle = DoorbellPanelRuntime.requestWithDeadline(options, result => {
      if (!currentVideo(binding)) { reject(new Error("stale_media")); return; }
      binding.handle = null;
      if (result.ok && result.data && result.data.ok === true) resolve(result.data);
      else {
        const error = new Error(result.error_code || result.kind || "media_failed");
        error.code = result.error_code || result.kind || "media_failed";
        error.status = result.status || 0;
        reject(error);
      }
    });
  });
}

async function authorizeVideo(binding) {
  const started = monotonicNow(), identity = binding.lifecycle;
  const data = await videoRequest(binding, { url: "/api/panel/media-authorize", method: "POST",
    deadline_ms: 1500, headers: { "Content-Type": "application/x-www-form-urlencoded",
      "X-Doorbell-CSRF": panelCsrf }, body: "door=" + encodeURIComponent(binding.door) +
      "&call_id=" + encodeURIComponent(identity.callId) + "&stage_revision=" + identity.stageRevision });
  if (!currentVideo(binding) || data.call_id !== identity.callId ||
      data.stage_revision !== identity.stageRevision || data.dialog_owner !== identity.owner ||
      !/^[0-9a-f]{32}$/.test(data.media_generation || "") ||
      !Number.isInteger(data.publish_remaining_ms) || data.publish_remaining_ms <= 0 ||
      data.publish_remaining_ms > 10000 || started + data.publish_remaining_ms <= monotonicNow()) {
    const error = new Error("invalid_media_authority"); error.code = "invalid_media_authority"; throw error;
  }
  binding.grant = { generation: data.media_generation, deadline: started + data.publish_remaining_ms };
  binding.sequence = 0;
}

async function postVideoFrame(binding, blob) {
  try {
    if (!currentVideo(binding) || videoState === "RECOVERING" || videoState === "INTERRUPTED") return;
    videoState = "SENDING";
    if (!binding.grant || binding.grant.deadline - monotonicNow() <= 3000) await authorizeVideo(binding);
    if (!currentVideo(binding)) return;
    const generation = binding.grant.generation, sequence = String(++binding.sequence);
    const identity = binding.lifecycle;
    const data = await videoRequest(binding, { url: "/call-frame?door=" + encodeURIComponent(binding.door) +
      "&call_id=" + encodeURIComponent(identity.callId) + "&stage_revision=" + identity.stageRevision +
      "&media_generation=" + generation + "&frame_sequence=" + sequence,
      method: "POST", body: blob, deadline_ms: Math.max(1, Math.min(3000,
        Math.floor(binding.grant.deadline - monotonicNow()))),
      headers: { "Content-Type": "image/jpeg", "X-Doorbell-CSRF": panelCsrf } });
    if (data.media_generation !== generation || data.frame_sequence !== sequence) {
      const error = new Error("invalid_media_ack"); error.code = "stale_media_ack"; throw error;
    }
    if (data.acceptance === "remote_core_accepted") {
      binding.acceptedAt = monotonicNow(); binding.acceptedSequence = Number(sequence);
      videoState = "REMOTE_CORE_ACCEPTED";
    } else {
      videoState = "SENDING";
    }
    binding.failures = 0;
  } catch (error) { failVideo(binding, error); throw error; }
}

const videoSession = DoorbellPanelVideo.create({
  getUserMedia: () => navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 320 }, height: { ideal: 240 } }, audio: false }),
  preview: els.self,
  onReady: binding => { if (currentVideo(binding)) videoState = "LOCAL_READY"; },
  createCanvas: () => document.createElement("canvas"),
  setInterval: (fn, delay) => { frameTimer = setInterval(fn, delay); return frameTimer; },
  clearInterval: timer => { clearInterval(timer); if (frameTimer === timer) frameTimer = null; },
  isCurrent: currentVideo,
  postFrame: (target, blob, binding) => postVideoFrame(binding, blob),
  onError: (error, binding) => {
    if (videoBinding !== binding) return;
    videoBinding = null;
    videoState = "DENIED";
    setStatus(t("panel.camera_failed", { reason: error.name || "error" }), true);
    els.sendVideo.checked = false;
  }
});

els.sendVideo.onchange = () => {
  if (els.sendVideo.checked) { if (session) startSendingVideo(); }
  else stopSendingVideo();
};


function refreshDoors(st) {
  const oldSelected = selected;
  const infoDoors = latestCallInfo && latestCallInfo.doors || {};
  doors = (st.doors || []).map(d => DoorbellCallFlow.projectDoor(d, infoDoors[d.id] || {}));
  renderTabs();
  const refreshed = oldSelected ? doors.find(d => d.id === oldSelected.id) : null;
  if (!oldSelected && doors.length)
    selectDoor(doors.find(d => d.id === INITIAL_DOOR) || doors[0]);
  else if (oldSelected && !refreshed && doors.length) selectDoor(doors[0], true);
  else if (refreshed && playbackKey(refreshed) !== playbackKey(oldSelected))
    selectDoor(refreshed, true);
  else { selected = refreshed; renderTabs(); updateCallButton(); }
  return refreshed;
}

function applyState(st, request) {
  if (!contextCurrent(request)) return false;
  if (!st || typeof st !== "object" || !Array.isArray(st.doors)) throw new Error("invalid state");
  emergencyOverlay.update(st);
  if (st.display) DoorbellPanelCommon.applyAppearance(st.display);
  // The call screen is not a home surface: it takes Core's accent, not its wallpaper ink.
  if (st.display && st.display.theme) DoorbellPanelCommon.applyColorRoles(st.display.theme, document, { ink: false });
  latestPanelState = st;
  const refreshed = refreshDoors(st);
  if (conference) conference.update(Object.assign({}, st, { doors: doors }));
  ensureLanguage(languageForState(st, selected && selected.id || INITIAL_DOOR));
  const callSnapshotCurrent = !activeLifecycle || (refreshed &&
    refreshed.id === activeLifecycle.door && refreshed.call_id === activeLifecycle.callId &&
    Number(refreshed.stage_revision) >= activeLifecycle.stageRevision);
  if (callSnapshotCurrent && refreshed && activeLifecycle)
    activeLifecycle.stageRevision = Math.max(activeLifecycle.stageRevision, refreshed.stage_revision);
  if (callSnapshotCurrent && refreshed && sessionConfirmed && activeLifecycle && refreshed.dialog_owner &&
    activeLifecycle.owner && refreshed.dialog_owner !== activeLifecycle.owner) {
    stopHeartbeat(activeLifecycle);
    activeLifecycle.ended = true;
    activeLifecycle = null;
    setStatus(t("panel.other_answered"));
    if (session) endCall("answered_elsewhere");
  }
  if (callSnapshotCurrent && refreshed && refreshed.recovery_required && activeLifecycle && sessionConfirmed &&
    refreshed.call_id === activeLifecycle.callId && !activeLifecycle.recoveryPending) {
    const recoveryBinding = activeLifecycle;
    const recoverySession = session;
    recoveryBinding.recoveryPending = true;
    reportRecovery(recoveryBinding, true).then(ok => {
      // This completion owns only the lifecycle and SIP session captured at request time. A
      // later call can reuse the same door and must never be ended by an old recovery result.
      finishRecovery(recoveryBinding, recoverySession, ok);
    });
  }
  if (activeLifecycle && activeLifecycle.awaitingAuthority && callSnapshotCurrent && refreshed &&
      refreshed.dialog_owner === activeLifecycle.owner && !activeLifecycle.recoveryPending) {
    activeLifecycle.awaitingAuthority = false;
    heartbeatLifecycle(activeLifecycle);
  }
  const disposition = callSnapshotCurrent ? DoorbellCallFlow.residentDisposition(
    refreshed ? refreshed.call_state : "", sessionConfirmed, !!activeLifecycle) : "keep";
  if (disposition === "answered_elsewhere") {
    setStatus(t("panel.other_answered"));
    if (session) endCall();
  }
  if (disposition === "end") {
    if (session) endCall();
    setStatus(t("panel.call_ended"));
  }
  if (disposition === "cancelled" || disposition === "expired") {
    setStatus(disposition === "cancelled" ? t("ring.cancelled") :
      t("panel.call_expired"), true);
    if (session) endCall();
  }
  if (!ua) initUa();
  DoorbellPanelRuntime.applySemanticUi(st, { page: "call" });
  latestStateContext = captureContext();
  if (!panelCsrf) loadPanelSession();
  return true;
}

function loadState() {
  readPoll(statePoll, DoorbellPanelRuntime.panelStateUrl(), applyState);
}

function loadCallInfo() {
  readPoll(callInfoPoll, "/api/panel/call-info", ci => {
    if (!ci || typeof ci !== "object" || Array.isArray(ci) ||
        ci.doors && (typeof ci.doors !== "object" || Array.isArray(ci.doors)))
      throw new Error("invalid call-info");
    latestCallInfo = ci;
    receiveWebrtc(ci.webrtc);
    // Configuration only reprojects the latest state; it never replays call lifecycle effects.
    if (latestPanelState && latestStateContext && contextCurrent(latestStateContext)) {
      refreshDoors(latestPanelState);
      latestStateContext = captureContext();
    }
    if (!ua) initUa();
    updateCallButton();
    return true;
  }, failure => {
    if (failure.status === 401 || failure.status === 403) revokeCalling();
  });
}

function load() {
  if (!readsAllowed()) return;
  loadState();
  loadCallInfo();
}
function start() {
  if (!readsAllowed()) return;
  const activation = pageRevision;
  ensureLanguage(latestPanelState ? languageForState(latestPanelState, selected && selected.id) : QUERY_LANG || "ja");
  applyI18n();
  installEmergency();
  DoorbellPanelRuntime.establishSession(result => {
    if (!pageActive || activation !== pageRevision) return;
    K = result.credential || "";
    if (result.ok) { loadPanelSession(); load(); }
    else setStatus(t("panel.auth_failed"), true);
  });
}

function loadPanelSession() {
  if (panelCsrfRequest) return;
  const request = { page: pageRevision };
  panelCsrfRequest = request;
  request.handle = DoorbellPanelRuntime.requestWithDeadline({ url: "/api/panel/session", deadline_ms: 1500 }, result => {
    if (panelCsrfRequest !== request) return;
    panelCsrfRequest = null;
    if (!pageActive || request.page !== pageRevision) return;
    panelCsrf = result.ok && result.data && /^[0-9a-f]{32}$/.test(result.data.csrf_token || "") ?
      result.data.csrf_token : "";
    updateCallButton();
  });
}

function showConferenceError() { setStatus(t("conversation.failed"), true); }
function conferencePost(path, body, closing) {
  return fetch(path, { method: "POST", credentials: "same-origin", keepalive: !!closing,
    headers: { "Content-Type": "application/json", "X-Doorbell-CSRF": panelCsrf },
    body: JSON.stringify(body) }).then(response => response.json());
}
const conference = typeof DoorbellConversations === "undefined" ? null : DoorbellConversations.create({
  send: (body, closing) => conferencePost("/api/panel/conversation", body, closing),
  authorize: body => conferencePost("/api/panel/conversation-media", body),
  error: showConferenceError,
  changed: () => renderConference(),
  media: (door, grant, callbacks) => {
    if (!ua || !registered || !door.extension) throw new Error("media unavailable");
    const call = ua.call("sip:" + door.extension + "@" + (webrtc.server || location.hostname), {
      mediaConstraints: { audio: true, video: false },
      extraHeaders: ["X-Doorbell-Mode: " + grant.mode, "X-Doorbell-Auth: " + grant.auth]
    });
    let held = true, remote = null;
    call.on("ended", callbacks.ended); call.on("failed", callbacks.ended);
    const tracks = () => {
      const connection = call.connection;
      if (!connection) return;
      for (const sender of connection.getSenders()) if (sender.track) sender.track.enabled = !held;
      if (!held && remote) els.audio.srcObject = remote;
      else if (els.audio.srcObject === remote) els.audio.srcObject = null;
    };
    call.on("confirmed", tracks);
    if (call.connection) call.connection.addEventListener("track", event => {
      remote = event.streams && event.streams[0] || null;
      tracks();
    });
    return { setHeld: value => { held = value; tracks(); }, close: () => {
      try { call.terminate(); } catch (_) {}
      if (els.audio.srcObject === remote) els.audio.srcObject = null;
    } };
  }
});
let conferenceActionSignature = "";
let conferenceCallPress = null;
if (conference) els.call.addEventListener("pointerdown", () => {
  if (!selected || !selected.conversation_supported) return;
  const mine = conference.member(selected);
  conferenceCallPress = conference.request(selected, !mine || mine.state === "waiting" ? "answer" : "leave");
});
function renderConference() {
  if (!conference) return;
  const summary = document.getElementById("conversationSummary");
  const actions = document.getElementById("conversationActions");
  const lines = [];
  for (const door of latestPanelState && latestPanelState.doors || []) {
    for (const member of door.conversation && door.conversation.participants || []) {
      const key = member.state === "waiting" ? "queued" : member.state;
      const messageKey = "conversation." + key;
      lines.push(door.label + " · " + t(messageKey, { device: member.name || member.device }));
    }
  }
  summary.textContent = lines.join("\n");
  if (!selected || !selected.conversation_supported) {
    actions.textContent = ""; conferenceActionSignature = ""; return;
  }
  const mine = conference.member(selected);
  const state = mine && mine.state || "";
  const owner = selected.conversation && selected.conversation.owner || "";
  els.call.textContent = t(!mine || state === "waiting" ? "conversation.answer" : "conversation.leave");
  els.call.disabled = !registered || !panelCsrf || conference.pending(selected) || (!mine && !!owner);
  const verbs = state === "connected" && conference.active(selected) ? ["hold"] :
    state === "held" || state === "connected" ? ["resume"] : !mine && owner ? ["join", "takeover"] : !mine ? ["respond"] : [];
  const signature = selected.id + ":" + selected.call_id + ":" + verbs.join(",");
  if (signature === conferenceActionSignature) return;
  conferenceActionSignature = signature; actions.textContent = "";
  for (const verb of verbs) {
    const button = document.createElement("button");
    const verbKey = "conversation." + verb;
    button.type = "button"; button.textContent = t(verbKey);
    let frozen = null, target = null;
    button.onpointerdown = () => { target = selected; frozen = conference.request(selected, verb); };
    button.onclick = () => {
      const door = target || selected, request = frozen || conference.request(door, verb);
      target = null; frozen = null;
      if (!selected || selected.id !== request.door || selected.call_id !== request.call_id) return;
      if (verb === "takeover" && !window.confirm(t("conversation.takeover_confirm"))) return;
      conference.action(door, verb, request).then(ok => { if (!ok) showConferenceError(); }).catch(showConferenceError);
    };
    actions.appendChild(button);
  }
}
if (conference) setInterval(() => conference.heartbeat(), 3000);
start();
</script>
</body>
</html>
