# Controlled Windows package build. Kept separate from build.yml so selecting
# this manual release lane does not spend hosted CI capacity on every contract job.
name: Windows release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  windows-release:
    runs-on: [self-hosted, windows, x64, doorbell-pjsip]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
      - name: Build and prove x64/x86 real-PJSIP bundle
        shell: cmd
        env:
          DB_BUILD_ID: release-${{ github.sha }}-${{ github.run_attempt }}
        run: win\build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: doorbell-windows-${{ github.sha }}
          path: win/dist/release-${{ github.sha }}-${{ github.run_attempt }}/
          retention-days: 30

  artifact-downloads:
    if: always()
    needs: [windows-release]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Publish artifact download table
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const available = data.artifacts.filter((artifact) => !artifact.expired);
            const artifactUrl = (id) =>
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}/artifacts/${id}`;

            await core.summary.addHeading("CI artifact downloads", 2);
            if (available.length === 0) {
              await core.summary.addRaw("No downloadable Windows release artifact was produced.\n");
            } else {
              await core.summary.addRaw("| Platform / package | Download | Expires |\n");
              await core.summary.addRaw("| --- | --- | --- |\n");
              for (const artifact of available.sort((left, right) => left.name.localeCompare(right.name))) {
                const expires = new Date(artifact.expires_at).toISOString().slice(0, 10);
                await core.summary.addRaw(
                  `| Windows x86/x64 release bundle | [${artifact.name}](${artifactUrl(artifact.id)}) | ${expires} |\n`
                );
              }
            }
            await core.summary.write();
