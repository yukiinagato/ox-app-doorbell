# Controlled iOS 5 package build. It is isolated from normal CI because it
# requires a licensed historical SDK and a self-hosted signing runner.
name: iOS 5 release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  runner-preflight:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.runners.outputs.available }}
    steps:
      - name: Require an idle licensed runner
        id: runners
        uses: actions/github-script@v7
        with:
          script: |
            const requiredLabels = ["self-hosted", "macOS", "ios5-armv7-licensed"];
            const runners = [];
            for (let page = 1; ; page += 1) {
              const { data } = await github.rest.actions.listSelfHostedRunnersForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                page,
                per_page: 100,
              });
              runners.push(...data.runners);
              if (data.runners.length < 100) break;
            }
            const matching = runners.filter((runner) => {
              const labels = new Set(runner.labels.map((label) => label.name));
              return runner.status === "online" && !runner.busy &&
                requiredLabels.every((label) => labels.has(label));
            });

            core.setOutput("available", matching.length > 0 ? "true" : "false");
            if (matching.length === 0) {
              core.setFailed(
                "No idle licensed iOS 5 runner is available " +
                "(self-hosted, macOS, ios5-armv7-licensed)."
              );
            }

  ios5-release:
    needs: runner-preflight
    if: needs.runner-preflight.outputs.available == 'true'
    runs-on: [self-hosted, macOS, ios5-armv7-licensed]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build deterministic Core and signed armv7 application
        env:
          DB_BUILD_ID: release-${{ github.sha }}-${{ github.run_attempt }}
        run: |
          ios-compat/scripts/build_core_ios5.sh --install
          ios-compat/scripts/build_app_ios5.sh
          ios-compat/scripts/test_host.sh
          ios-compat/scripts/build_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: doorbell-ios5-armv7-${{ github.sha }}
          path: |
            ios-kiosk/build/Doorbell.app/
            build/ios-compat/artifacts/ios5-armv7-pjsip-off/manifest.json
            build/ios-compat/artifacts/ios5-armv7-app/manifest.json
            build/ios-compat/artifacts/doorbell.deb
            build/ios-compat/artifacts/doorbell.deb.sha256
          retention-days: 30

  artifact-downloads:
    if: always()
    needs: [runner-preflight, ios5-release]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Publish artifact download table
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            const available = data.artifacts.filter((artifact) => !artifact.expired);
            const artifactUrl = (id) =>
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}/artifacts/${id}`;

            await core.summary.addHeading("CI artifact downloads", 2);
            if (available.length === 0) {
              await core.summary.addRaw("No downloadable iOS 5 release artifact was produced.\n");
            } else {
              await core.summary.addRaw("| Platform / package | Download | Expires |\n");
              await core.summary.addRaw("| --- | --- | --- |\n");
              for (const artifact of available.sort((left, right) => left.name.localeCompare(right.name))) {
                const expires = new Date(artifact.expires_at).toISOString().slice(0, 10);
                await core.summary.addRaw(
                  `| iOS 5.1 armv7 package | [${artifact.name}](${artifactUrl(artifact.id)}) | ${expires} |\n`
                );
              }
            }
            await core.summary.write();
